
</head>
<body>

<div class="fondo" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<!-- ============ 1. Acceso ============ -->
<section id="p-login">
  <form class="caja-ac vid panel" id="f-login" autocomplete="on">
    <div class="lg-aura" aria-hidden="true"></div>
    <div class="marca">
      <span class="cico" style="--c:var(--verde)" id="lg-ico"></span>
      <div class="marca-tx">
        <b>Bitlab Terminal</b>
        <small>Monitoreo remoto · multi-SO</small>
      </div>
    </div>
    <h2 class="lg-hola">Bienvenido</h2>
    <p class="lg-sub">Ingresa con tu cuenta corporativa para acceder al panel de monitoreo y comandos.</p>
    <label class="campo-lg"><span>Correo</span>
      <input type="email" id="lg-correo" required autocomplete="username" placeholder="usuario@bitlab-it.com"></label>
    <label class="campo-lg"><span>Contraseña</span>
      <input type="password" id="lg-pass" required autocomplete="current-password" placeholder="Tu contraseña"></label>
    <div class="err" id="lg-err" role="alert"></div>
    <button class="btn pri lg-btn-xl" type="submit" id="lg-btn">Entrar al panel</button>
    <div class="pie-ac">
      <span class="pie-chip">TLS 1.3</span>
      <span class="pie-chip">HMAC-SHA256</span>
      <span class="pie-chip">RLS activo</span>
    </div>
  </form>
</section>

<!-- ============ Armazón del panel ============ -->
<div id="app" hidden>
  <header class="top">
    <div>
      <h1 id="tit">Equipos</h1>
      <div class="ts" id="subt"></div>
    </div>
    <div class="der">
      <span class="ws" id="ws-ind"><i></i><span id="ws-txt">Conectado</span></span>
      <button class="ib" id="btnNotif" data-acc="notif" aria-label="Silenciar notificaciones" title="Notificaciones"></button>
      <button class="yo" id="yo" data-acc="cuenta" title="Mi cuenta">··</button>
    </div>
  </header>
  <main id="vista"></main>
</div>

<!-- ============ Modal: Mi cuenta ============ -->
<div id="m-cuenta" class="modal" hidden>
  <div class="modal-bg" data-acc="cuentaCerrar"></div>
  <div class="modal-caja vid panel">
    <header class="modal-head">
      <div class="modal-tit"><span class="cico" style="--c:var(--cian)" id="mc-ico"></span><div><b>Mi cuenta</b><small id="mc-sub">—</small></div></div>
      <button class="ib" data-acc="cuentaCerrar" aria-label="Cerrar" id="mc-cerrar"></button>
    </header>
    <div class="modal-cuerpo">
      <!-- Perfil -->
      <section class="mc-sec">
        <h3 class="mc-h">Sesión</h3>
        <div class="mc-info">
          <div class="mc-row"><span class="mc-k">Correo</span><span class="mc-v" id="mc-correo">—</span></div>
          <div class="mc-row"><span class="mc-k">Rol</span><span class="mc-v" id="mc-rol">—</span></div>
        </div>
      </section>
      <!-- Tema -->
      <section class="mc-sec">
        <h3 class="mc-h">Apariencia</h3>
        <div class="mc-tema">
          <button class="mc-opt" data-acc="temaSet" data-tema="oscuro" id="mc-t-oscuro">
            <span class="mc-opt-ic" id="mc-ic-oscuro"></span>
            <span>Oscuro</span>
          </button>
          <button class="mc-opt" data-acc="temaSet" data-tema="claro" id="mc-t-claro">
            <span class="mc-opt-ic" id="mc-ic-claro"></span>
            <span>Claro</span>
          </button>
        </div>
      </section>
      <!-- Cambiar contraseña -->
      <section class="mc-sec">
        <h3 class="mc-h">Cambiar contraseña</h3>
        <form id="f-cambia-pass" class="mc-form">
          <label class="lbl-f"><span>Contraseña nueva</span>
            <input type="password" id="mc-pass1" class="inp-f" required minlength="8" placeholder="Mínimo 8 caracteres"></label>
          <label class="lbl-f"><span>Confirmar contraseña</span>
            <input type="password" id="mc-pass2" class="inp-f" required minlength="8" placeholder="Repite la nueva contraseña"></label>
          <div class="err" id="mc-pass-err"></div>
          <div class="ok" id="mc-pass-ok"></div>
          <button class="btn pri" type="submit" id="mc-pass-btn">Actualizar contraseña</button>
        </form>
      </section>
      <!-- Cerrar sesión -->
      <section class="mc-sec">
        <button class="btn pel" style="width:100%" data-acc="salir">Cerrar sesión</button>
      </section>
    </div>
  </div>
</div>

<button id="fab" class="vid" data-acc="fab" aria-label="Menú de terminal rápida" aria-expanded="false" hidden></button>
<div id="fabPanel" class="vid" hidden></div>

<nav id="dock" class="vid" aria-label="Secciones del módulo" hidden><i id="lente"></i></nav>

<div id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
