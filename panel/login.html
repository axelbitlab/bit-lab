<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bitlab-IT · Iniciar Sesión</title>
  <!-- Tipografías y estilos base -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="modulos/estilos/base.css">
  <link rel="stylesheet" href="modulos/estilos/componentes.css">
  <!-- Cliente Supabase y configuración local -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <!-- Fondo decorativo dinámico -->
  <div class="fondo" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>

  <!-- Formulario de acceso aislado -->
  <section id="p-login" style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;">
    <form class="caja-ac vid panel" id="f-login" autocomplete="on">
      <div class="lg-aura" aria-hidden="true"></div>
      <div class="marca">
        <span class="cico" style="--c:var(--verde)">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        </span>
        <div class="marca-tx">
          <b>Bitlab Terminal</b>
          <small>Monitoreo remoto · multi-SO</small>
        </div>
      </div>
      <h2 class="lg-hola">Bienvenido</h2>
      <p class="lg-sub">Ingresa con tu cuenta corporativa para acceder al panel de monitoreo y comandos.</p>
      <label class="campo-lg"><span>Correo</span>
        <input type="email" id="lg-correo" required autocomplete="username" placeholder="usuario@bitlab-it.com" autofocus></label>
      <label class="campo-lg"><span>Contraseña</span>
        <input type="password" id="lg-pass" required autocomplete="current-password" placeholder="Tu contraseña"></label>
      <div class="err" id="lg-err" role="alert"></div>
      <button class="btn pri lg-btn-xl" type="submit" id="lg-btn">Entrar al panel</button>
      <div class="pie-ac">
        <span class="pie-chip">TLS 1.3</span>
        <span class="pie-chip">HMAC-SHA256</span>
        <span class="pie-chip">RLS activo</span>
      </div>
    </form>
  </section>

  <!-- Lógica de autenticación desacoplada -->
  <script src="modulos/datos/login.js"></script>
</body>
</html>
