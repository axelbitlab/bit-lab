/* =====================================================================
   VISTA · Monitoreo  (reemplaza la vista "equipos")
   KPIs + tarjetas de equipos con métricas en vivo + alertas + selección
   ===================================================================== */

const VistaMonitoreo={
 titulo:'Monitoreo',
 sub:()=>`${S.dispositivos.filter(d=>d.en_linea).length}/${S.dispositivos.length} en línea`,
 llena:false,

 /* ── recopilar alertas de TODOS los dispositivos ── */
 _todasAlertas(){
  const lista=[];
  S.dispositivos.forEach(d=>{
   const aa=Datos._alertasActivas(d);
   aa.forEach(tipo=>{
    const info={cpu:['CPU alta','pel','cpu'],memoria:['Memoria alta','ambar','cpu'],
     disco:['Disco casi lleno','ambar','hardDrive'],proceso:['Proceso elevado','indigo','activity'],
     red:['Sin contacto reciente','tx3','wifiOff']};
    const [msg,col,ic]=info[tipo]||[tipo,'tx3','alert'];
    lista.push({dispositivo_id:d.id,tipo,mensaje:msg,color:`var(--${col})`,icono:ic,nombre:d.nombre});
   });
  });
  return lista;
 },

 render(){
  const dd=S.dispositivos, on=dd.filter(d=>d.en_linea), off=dd.filter(d=>!d.en_linea);
  const alertas=this._todasAlertas();

  /* ── KPIs ── */
  let k=`<div class="kpis">
   <div class="kpi"><div class="kpi-v">${dd.length}</div><div class="kpi-l">Equipos</div></div>
   <div class="kpi ok"><div class="kpi-v">${on.length}</div><div class="kpi-l">En línea</div></div>
   <div class="kpi pel"><div class="kpi-v">${off.length}</div><div class="kpi-l">Fuera de línea</div></div>
   <div class="kpi warn"><div class="kpi-v">${alertas.length}</div><div class="kpi-l">Alertas</div></div>
  </div>`;

  /* ── Alertas activas ── */
  let al='';
  if(alertas.length){
   al=`<div class="alerta-banda" id="alerta-banda-wrap" hidden>
    <div class="banda-h">${ico('alert',14)} <b>Alertas activas</b> <span class="badge">${alertas.length}</span></div>
    <div class="alerta-lista" id="alerta-lista">`;
   alertas.slice(0,8).forEach(a=>{
    al+=`<div class="alerta-fila" data-acc="selNodo" data-dev="${a.dispositivo_id}">
     <span class="al-ico" style="color:${a.color}">${ico(a.icono||'alert',14)}</span>
     <span class="al-txt"><b>${esc(a.nombre||'—')}</b> ${esc(a.mensaje)}</span>
    </div>`;
   });
   al+=`</div></div>`;
  }

  /* ── Barra de filtros ── */
  let filtros=`<div class="tools" id="mon-tools">
   <div class="bq"><input type="text" id="mon-q" placeholder="Buscar equipo..." data-inp="monQ" class="inp-bus" value="${esc(S.tf?.q||'')}">
    <span class="bq-ico">${ico('search',14)}</span></div>
   <select data-chg="monSo" class="sel-filt" id="mon-so"><option value="">Todo SO</option>
    <option value="windows">Windows</option><option value="macos">macOS</option><option value="linux">Linux</option></select>
   <select data-chg="monEstado" class="sel-filt" id="mon-estado"><option value="">Todos</option>
    <option value="online">En línea</option><option value="offline">Fuera de línea</option></select>
   <div class="tools-der">
    <button class="btn-ico" data-acc="selEnLinea" title="Seleccionar todos en línea">${ico('wifi',14)} En línea</button>
    <button class="btn-ico" data-acc="selLimpiar" title="Limpiar selección">${ico('x',14)}</button>
    <span class="sel-count" id="sel-count">${Sel.ids.size?Sel.ids.size+' sel.':''}</span>
   </div>
  </div>`;

  /* ── Tarjetas de equipos ── */
  let tarjetas=`<div class="eq-grid" id="eq-grid">${this._tarjetas(this._filtrar(dd))}</div>`;

  return k+al+filtros+tarjetas;
 },

 _filtrar(dd){
  let f=dd;
  const q=(S.tf?.q||'').toLowerCase();
  const so=$('#mon-so')?.value||'';
  const est=$('#mon-estado')?.value||'';
  if(q) f=f.filter(d=>(d.nombre||'').toLowerCase().includes(q)||(d.ip_local||'').includes(q));

  return f;
 },

 _tarjetas(dd){

 },

 _tarjeta(d){

   const cls=val>85?'crit':val>70?'warn':'';
   return `<div class="met">
    <span class="met-l">${label}</span>
    <div class="met-bar"><div class="met-fill ${cls}" style="width:${Math.min(val,100)}%;background:${color}"></div></div>
    <span class="met-v">${val}%</span>
   </div>`;
  };

  return `<div class="eq-card${sel?' sel':''}${!on?' off':''}" data-acc="eqClick" data-dev="${d.id}">
   <div class="eq-top">
    <div class="eq-estado"><span class="dot ${on?'on':'off'}"></span></div>

     <div class="eq-meta">${soB(d.sistema)} ${d.apodo ? `<span style="opacity:.6;font-size:11px">(${esc(d.nombre)})</span> ` : ''}<span class="eq-ip">${esc(d.ip_local||'')}</span></div>
    </div>
    <div class="eq-check">
     <input type="checkbox" ${sel?'checked':''} data-acc="selChk" data-id="${d.id}" onclick="event.stopPropagation()">
    </div>
   </div>
   ${tieneAlerta?`<div class="eq-alerta">${alertas.map(a=>`<span class="eq-al-tag">${ico(a==='cpu'?'cpu':a==='memoria'?'cpu':a==='disco'?'hardDrive':'alert',10)} ${a}</span>`).join('')}</div>`:''}
   <div class="eq-metricas">
    ${barra('CPU',cpuVal,'var(--cian)')}
    ${barra('RAM',ramVal,'var(--verde)')}
    ${barra('Disco',discoVal,'var(--ambar)')}
   </div>
   <div class="eq-pie">
    <span class="eq-lat">${ico('clock',11)} ${d.visto?relativo(d.visto):'sin contacto'}</span>
    <span class="eq-ints">${(d.ints||[]).map(i=>intB(i)).join(' ')}</span>
   </div>
  </div>`;
 },

 refrescar(){
  const grid=$('#eq-grid');
  if(grid) grid.innerHTML=this._tarjetas(this._filtrar(S.dispositivos));
  const cnt=$('#sel-count');
  if(cnt) cnt.textContent=Sel.ids.size?Sel.ids.size+' sel.':'';
  /* KPIs */
  const kpis=$$('.kpi-v');
  if(kpis.length>=4){
   const dd=S.dispositivos, on=dd.filter(d=>d.en_linea);
   const alertas=this._todasAlertas();
   kpis[0].textContent=dd.length;
   kpis[1].textContent=on.length;
   kpis[2].textContent=dd.length-on.length;
   kpis[3].textContent=alertas.length;
  }
 },

 montar(){
  Bus.on('equipos',this._onEquipos);
  Bus.on('sel',this._onSel);
  // Animación de alertas: mostrar banda 5s luego colapsar a campana
  const alertas=this._todasAlertas();
  if(alertas.length) this._animarAlertas(alertas);
 },

 _animarAlertas(alertas){
  const banda=$('#alerta-banda-wrap');
  if(!banda)return;
  banda.classList.add('visible');
  const btn=$('#btnNotif');
  if(btn){
   btn.setAttribute('data-badge',alertas.length);
   btn.classList.add('tiene-alertas');
  }
  // 4.2s después → succión hacia campana + vibración simultánea
  setTimeout(()=>{
   const btnR=$('#btnNotif');
   if(btnR){
    const br=btnR.getBoundingClientRect();
    const wr=banda.getBoundingClientRect();
    banda.style.setProperty('--dest-x',(br.left-wr.left+br.width/2-wr.width/2)+'px');
    banda.style.setProperty('--dest-y',(br.top-wr.top-wr.height+br.height/2)+'px');
    // Campana vibra MIENTRAS la banda vuela hacia ella
    btnR.classList.add('campana-absorbe');
    btnR.addEventListener('animationend',()=>btnR.classList.remove('campana-absorbe'),{once:true});
   }
   banda.classList.add('colapsando');
   // Al terminar animación de succión → rebote final de campana
   setTimeout(()=>{
    banda.hidden=true;
    banda.classList.remove('visible','colapsando');
    if(btnR){
     btnR.style.transition='transform .3s cubic-bezier(.34,1.56,.64,1)';
     btnR.style.transform='scale(1.35)';
     setTimeout(()=>{ btnR.style.transform='scale(1)';
      setTimeout(()=>btnR.style.transition='',320);
     },120);
    }
   },580);
  },4200);
 },
 salir(){
  Bus.off('equipos',this._onEquipos);
  Bus.off('sel',this._onSel);
 },
 _onEquipos(){VistaMonitoreo.refrescar();if(typeof pintaNotif==='function')pintaNotif();},
 _onSel(){VistaMonitoreo.refrescar()}
};

 });

Acc.cataGuardarCategoria=async()=>{
 const nom=$('#cat-nuevo-nom')?.value?.trim();
 const col=$('#cat-nuevo-col')?.value||'#06b6d4';
 if(!nom){ Toast.mostrar('Escribe un nombre de categoría','aviso'); return; }
 try{
  const {data,error}=await sb.from('categorias_comandos').insert({nombre:nom,color:col,icono:'activity',orden:99}).select().single();
  if(error){
   // Guardar local si la tabla aún no tiene permisos o migración corrida
   const nueva={id:Date.now(),nombre:nom,color:col,icono:'activity',orden:99};
   S.categorias.push(nueva);
   guardar('categorias_locales',S.categorias);
  }else if(data){
   S.categorias.push(data);
  }
  Toast.mostrar('Categoría creada','ok',nom);
  Modal.cerrar();
  Nav.ir('catalogo');
 }catch(e){
  const nueva={id:Date.now(),nombre:nom,color:col,icono:'activity',orden:99};
  S.categorias.push(nueva);
  guardar('categorias_locales',S.categorias);
  Toast.mostrar('Categoría creada','ok',nom);
  Modal.cerrar();
  Nav.ir('catalogo');
 }
};

Acc.cataEliminarCategoria=async el=>{

 guardar('categorias_locales',S.categorias);
 Toast.mostrar('Categoría eliminada','ok');

};

Acc.cataEjecutar=el=>{
 const id=parseInt(el.dataset.id);
 const c=S.comandos.find(x=>x.id===id); if(!c)return;
 const dAct=dev(S.dispActivo);
 const online=S.dispositivos.filter(d=>d.en_linea&&compat(c,d));

 if(dAct&&dAct.en_linea&&compat(c,dAct)){
  const textoResuelto=(typeof esMultiPlataforma==='function'&&esMultiPlataforma(c))
   ?resolverScript(c,dAct):null;
  if(c.destructivo){
   Modal.abrir({aria:'Confirmar ejecución',ancho:420,titulo:'Acción destructiva',
    html:`<p style="line-height:1.6">El comando <b>${esc(c.nombre)}</b> está marcado como <b style="color:var(--pel)">destructivo</b>.<br>¿Ejecutar en <b>${esc(dAct.nombre)}</b>?</p>`,
    pie:`<button class="btn" data-acc="mCerrar">Cancelar</button>
     <button class="btn pel" data-acc="tConfirmar" data-id="${c.id}" data-txt="${esc(textoResuelto||c.script||'')}">Ejecutar de todas formas</button>`});
  }else{
   Sesion.abrir(dAct.id);
   Nav.ir('terminal');
   setTimeout(()=>{if(textoResuelto) Motor.lanzar(textoResuelto,null); else Motor.lanzar(null,c.id)},120);

 if(!online.length){
  Toast.mostrar('No hay equipos en línea compatibles ('+(c.sistema||'todos')+')','aviso');

 }

 Modal.abrir({
  aria:'Elegir equipo',ancho:440,titulo:'Ejecutar '+c.nombre,
  html:`<p style="font-size:12.5px;color:var(--txt-sec);margin-bottom:12px">Selecciona el equipo para ejecutar este comando:</p>

   ${online.map(d=>`<button class="btn sec" style="justify-content:flex-start;padding:10px 12px;gap:10px;text-align:left;width:100%" data-acc="cataLanzarEn" data-cid="${c.id}" data-did="${d.id}">

  pie:`<button class="btn" data-acc="mCerrar">Cancelar</button>`
 });
};

/** Paletas de color para xterm según el tema activo */
const XTERM_TEMAS = {
 oscuro: {
  background:'#07070b',       foreground:'#e2e8f0',
  cursor:'#39ff88',           selectionBackground:'rgba(57,255,136,.22)',
  black:'#1e1e2e',            red:'#ff5470',
  green:'#39ff88',            yellow:'#ffb703',
  blue:'#3b82f6',             magenta:'#c084fc',
  cyan:'#22d3ee',             white:'#e2e8f0',
  brightBlack:'#64748b',      brightRed:'#ff5470',
  brightGreen:'#39ff88',      brightYellow:'#ffb703',
  brightBlue:'#60a5fa',       brightMagenta:'#d8b4fe',
  brightCyan:'#67e8f9',       brightWhite:'#f1f5f9'
 },
 claro: {
  background:'#f8fbfe',       foreground:'#0d1b2a',
  cursor:'#00b85a',           selectionBackground:'rgba(0,184,90,.25)',
  black:'#2c3e50',            red:'#c2185b',
  green:'#1a7a40',            yellow:'#7c4a00',
  blue:'#1a66ff',             magenta:'#5b4fd4',
  cyan:'#008db8',             white:'#2c3e50',
  brightBlack:'#607d8b',      brightRed:'#d93060',
  brightGreen:'#00b85a',      brightYellow:'#c47c00',
  brightBlue:'#4480ff',       brightMagenta:'#7b6de0',
  brightCyan:'#00aad4',       brightWhite:'#0d1b2a'
 }
};

const Term={
 _inst:null,_fit:null,
 _tema(){ return document.documentElement.getAttribute('data-tema')==='claro'?'claro':'oscuro' },
 mont(host){
  if(this._inst){this._inst.dispose();this._inst=null}
  const paleta=XTERM_TEMAS[this._tema()];
  const t=new Terminal({theme:paleta,
   fontFamily:'JetBrains Mono, monospace',fontSize:13,
   lineHeight:1.45,cursorBlink:true,scrollback:3000,
   convertEol:true,allowTransparency:true});
  if(window.FitAddon){const f=new FitAddon.FitAddon();t.loadAddon(f);this._fit=f}
  if(window.WebLinksAddon)t.loadAddon(new WebLinksAddon.WebLinksAddon());
  t.open(host);
  this._inst=t;
  setTimeout(()=>this.ajustar(),30);
  const ro=new ResizeObserver(()=>this.ajustar());
  ro.observe(host);
  return t;
 },
 /** Actualiza la paleta de xterm cuando el usuario cambia el tema */
 actualizarTema(){
  if(!this._inst)return;
  const paleta=XTERM_TEMAS[this._tema()];
  this._inst.options.theme=paleta;
 },
 ajustar(){ try{this._fit?.fit()}catch(_){} },
 escr(txt,tipo='std'){
  const t=this._inst; if(!t)return;
  if(tipo==='err')t.write('\x1b[31m'+txt+'\x1b[0m');
  else if(tipo==='sys')t.write('\x1b[33m'+txt+'\x1b[0m');
  else t.write(txt);
 },
 limpiar(){ this._inst?.clear() },
 bienvenida(d){
  if(!this._inst)return;
  const esClaro=this._tema()==='claro';
  const col=esClaro?'\x1b[32m':'\x1b[32m';  // verde ANSI — contrasta en ambos temas
  this._inst.writeln(`${col}╭─ Bitlab-IT Terminal ─────────────────────────────╮\x1b[0m`);
  this._inst.writeln(`${col}│\x1b[0m  Equipo : \x1b[1m${d.nombre}\x1b[0m`);
  this._inst.writeln(`${col}│\x1b[0m  SO     : ${d.sistema} ${d.version_so||''}`);
  this._inst.writeln(`${col}│\x1b[0m  IP     : ${d.ip_local||'—'}`);
  this._inst.writeln(`${col}╰──────────────────────────────────────────────────╯\x1b[0m`);
  this._inst.writeln('');
 }
};

/* =====================================================================
   VISTA · Terminal  (3 columnas: árbol | terminal+tabs | panel lateral)
   ===================================================================== */

const VistaTerminal={
 titulo:'Terminal',
 sub:()=>{
  const a=Sesion.actual(),d=a?dev(a.dispId):null;
  if(!d) return 'Sin sesión';
  const nombreDisp = d.apodo ? `${d.apodo} (${d.nombre})` : d.nombre;
  if(S.ejActiva && !FIN.includes(S.ejActiva.estado)){
   return `Ejecutando comando en ${nombreDisp}...`;
  }
  return nombreDisp;
 },
 llena:true,
 _montado:false,

 render(){
  const dd=S.dispositivos;
  const ses=S.sesiones;
  const act=Sesion.actual();
  const dAct=act?dev(act.dispId):null;

  return `<div class="term-g">
   ${this._arbol(dd)}
   <div class="col central">
    ${this._tabs(ses,act)}
    ${this._barra(act,dAct)}
    <div class="tcuerpo" id="tcuerpo"></div>
    ${this._entrada(act,dAct)}
    ${this._guardar(act)}
   </div>
   ${this._panelDer()}
  </div>`;
 },

 _arbol(dd){
  const q=(S.arbolQ||'').toLowerCase();
  const porSo={windows:[],macos:[],linux:[]};
  dd.forEach(d=>{
   if(q && !(d.nombre||'').toLowerCase().includes(q)) return;
   const k=d.sistema||'linux';
   if(!porSo[k]) porSo[k]=[];
   porSo[k].push(d);
  });
  let h=`<div class="arbol">
   <div class="arbol-bus"><input type="text" placeholder="Buscar equipo..." data-inp="arbolQ" value="${esc(S.arbolQ||'')}" class="inp-bus"></div>`;
  Object.entries(porSo).forEach(([so,lista])=>{
   if(!lista.length) return;
   const info=SO[so]||{n:so,ic:'monitor'};
   h+=`<details class="arbol-grupo" open>
    <summary>${ico(info.ic,13)} ${info.n} <span class="badge">${lista.length}</span></summary>`;
   lista.forEach(d=>{
    const sel=Sel.ids.has(d.id);
    const activo=S.dispActivo===d.id;
    h+=`<div class="dv${sel?' sel':''}${activo?' act':''}" data-acc="tAbrirSesion" data-dev="${d.id}">
     <input type="checkbox" ${sel?'checked':''} data-acc="selChk" data-id="${d.id}" onclick="event.stopPropagation()">
     <span class="dot ${d.en_linea?'on':'off'}"></span>
     <span class="dv-n">${esc(d.nombre||'—')}</span>
     <span class="dv-int">${(d.ints||[]).length} int.</span>
    </div>`;
   });
   h+=`</details>`;
  });
  h+=`</div>`;
  return h;
 },

 _tabs(ses,act){
  if(!ses.length) return `<div class="tabs"><div class="tab vacio-tab">Selecciona un equipo para iniciar</div></div>`;
  let h=`<div class="tabs" id="ses-tabs">`;
  ses.forEach(s=>{
   const d=dev(s.dispId);
   const activo=act&&s.id===act.id;
   h+=`<div class="tab${activo?' act':''}" data-acc="tCambiarSesion" data-sid="${s.id}">
    <span class="dot ${d&&d.en_linea?'on':'off'}"></span>
    <span>${esc(d?d.nombre:'—')}</span>
    <span class="tab-int">${intB(s.int)}</span>
    <button class="tab-x" data-acc="tCerrarSesion" data-sid="${s.id}">${ico('x',10)}</button>
   </div>`;
  });
  h+=`</div>`;
  return h;
 },

 _barra(act,d){
  if(!act) return `<div class="tbarra" id="t-barra"><span class="tbarra-vacio">Sin sesión activa</span></div>`;
  return `<div class="tbarra" id="t-barra">
   <span class="dot ${d&&d.en_linea?'on':'off'}"></span>
   <b>${esc(d?d.nombre:'—')}</b>
   <span class="tbarra-int">${intB(act.int)}</span>
   <span id="t-aviso">${this.estado()}</span>
   <span class="tbarra-der">
    <select data-chg="tInt" id="t-int" class="sel-filt">
     ${(d&&d.ints||['powershell']).map(i=>`<option value="${i}"${act.int===i?' selected':''}>${(INT[i]||{n:i}).n}</option>`).join('')}
    </select>
    <button class="btn-ico" data-acc="tLimpiar" title="Limpiar terminal">${ico('trash',14)}</button>
    <button class="btn-ico" data-acc="tCancelar" title="Cancelar ejecución" ${!S.ejActiva?'disabled':''}>${ico('x',14)}</button>
   </span>
  </div>`;
 },

 _entrada(act,d){
  if(!act) return '';
  return `<div class="tentrada">
   <span class="tprompt">${esc(prompt(d,act.int))}</span>
   <input type="text" id="t-input" class="tinp" placeholder="Escribe un comando..." data-inp="tCmd"
    autocomplete="off" spellcheck="false">
   <button class="btn pri" data-acc="tEnviar">${ico('play',14)} Ejecutar</button>
  </div>`;
 },

 _guardar(act){
  if(!act) return '';
  return `<div class="tguardar" id="t-guardar" style="display:none">
   <span>${ico('save',13)} Guardar como comando</span>
   <button class="btn sec btn-sm" data-acc="tGuardarCmd">Guardar en catálogo</button>
  </div>`;
 },

 _panelDer(){
  const tab=S.panelDer||'catalogo';
  return `<div class="col lateral" id="panel-der">
   <div class="ptabs">
    <button class="ptab${tab==='catalogo'?' act':''}" data-acc="tPanelTab" data-v="catalogo">${ico('grid',13)} Catálogo</button>
    <button class="ptab${tab==='historial'?' act':''}" data-acc="tPanelTab" data-v="historial">${ico('clock',13)} Historial</button>
    <button class="ptab${tab==='detalles'?' act':''}" data-acc="tPanelTab" data-v="detalles">${ico('info',13)} Detalles</button>
   </div>
   <div class="pcuerpo" id="pcuerpo">${this._panelContenido(tab)}</div>
  </div>`;
 },

 _panelContenido(tab){
  if(tab==='catalogo') return this._panelCatalogo();
  if(tab==='historial') return this._panelHistorial();
  if(tab==='detalles') return this._panelDetalles();
  return '';
 },

 _panelCatalogo(){
  const q=(S.cf&&S.cf.q||'').toLowerCase();
  let cmds=S.comandos||[];
  if(q) cmds=cmds.filter(function(c){return (c.nombre||'').toLowerCase().includes(q)||(c.descripcion||'').toLowerCase().includes(q)});

  const dAct=dev(S.dispActivo);
  if(dAct) cmds=cmds.filter(function(c){return c.sistema===dAct.sistema||c.sistema==='todos'});

  const catMap={};
  cmds.forEach(function(c){
   const catId=c.categoria_id||'__sin__';
   if(!catMap[catId]) catMap[catId]=[];
   catMap[catId].push(c);
  });

  let h='<div class="pfiltros"><input type="text" placeholder="Buscar comando..." data-inp="cfQ" class="inp-bus inp-sm" value="'+esc(S.cf&&S.cf.q||'')+'">'
   +(dAct?'<small style="color:var(--tx3);font-size:11px;margin-top:4px;display:block">Filtrado por '+soB(dAct.sistema)+'</small>':'')
   +'</div>';

  if(!cmds.length){
   h+='<div class="vacio">'+ico('grid',18)+'<span>Sin comandos'+(dAct?' para '+soB(dAct.sistema):'')+'</span></div>';
   return h;
  }

  Object.keys(catMap).forEach(function(catId){
   const lista=catMap[catId];
   const ca=catId==='__sin__'?null:catById(catId);
   const catNom=ca&&ca.nombre||'Sin categoría';
   const catColor=ca&&(ca.color||ca.col)||'var(--azul)';
   const catIcon=ca&&(ca.icono||ca.ic)||'tag';
   h+='<div class="pcat-sec">'
    +'<div class="pcat-cab" style="--c:'+catColor+'">'+ico(catIcon,12)+' <span>'+esc(catNom)+'</span>'
    +'<span class="badge">'+lista.length+'</span></div>';
   lista.slice(0,10).forEach(function(c){
    const ok=dAct?compat(c,dAct):true;
    h+='<div class="pcard'+(ok?'':' dim')+'" data-acc="tSelCmd" data-cmd="'+c.id+'" title="'+esc(c.descripcion||c.nombre)+'">'
     +'<div class="pcard-h">'
     +'<span class="cico sm" style="--c:'+catColor+'">'+ico(catIcon,12)+'</span>'
     +'<div class="pcard-inf"><b>'+esc(c.nombre||'—')+'</b>'
     +'<small class="pcard-meta">'+intB(c.interprete)+(c.requiere_admin?' '+flagAdm:'')+(c.es_destructivo||c.destructivo?' '+flagDes:'')+'</small>'
     +'</div>'
     +'<button class="btn-ico pcard-play" data-acc="tCmd2" data-id="'+c.id+'" title="Ejecutar ahora" onclick="event.stopPropagation()">'+ico('play',12)+'</button>'
     +'</div>'
     +(c.descripcion?'<div class="pcard-desc">'+esc((c.descripcion||'').slice(0,70))+'</div>':'')
     +'</div>';
   });
   h+='</div>';
  });
  return h;
 },

 /* ── Panel Historial: carga desde Supabase ── */
 _histCargado:false,
 _histDatos:[],

 _panelHistorial(){

     +'</small>'

     +'<button class="btn-ico" data-acc="tHistReplay" data-id="'+ej.id+'" title="Re-ejecutar" onclick="event.stopPropagation()">'+ico('retry',12)+'</button>'
     +'<button class="btn-ico" data-acc="tHistVer" data-id="'+ej.id+'" title="Ver salida" onclick="event.stopPropagation()">'+ico('expand',12)+'</button>'
     +'</div>'
     +'</div></div>';
   });
  }
  h+='</div>';
  return h;
 },

 async _cargarHistorialPanel(){
  try{
   const dispActivo=S.dispActivo;
   let q=sb.from('ejecuciones_comandos')
    .select('id,dispositivo_id,comando_id,estado,texto_comando,duracion_ms,creado,codigo_salida')

    .limit(50);
   // Filtrar por equipo activo si hay uno seleccionado
   if(dispActivo) q=q.eq('dispositivo_id',dispActivo);
   const {data,error}=await q;
   if(error) throw error;
   this._histCargado=true;
   S.historialPanel=data||[];
   // Re-renderizar solo el panel si sigue en la pestaña historial
   if(S.panelDer==='historial'){
    const pc=$('#pcuerpo');
    if(pc) pc.innerHTML=VistaTerminal._panelHistorial();
   }
  }catch(e){
   this._histCargado=true;
   const el=$('#p-hist-cargando');
   if(el) el.innerHTML=ico('info',18)+'<span>Error al cargar historial</span>';
  }
 },

 _panelDetalles(){

 },

 estado(){
  if(!S.ejActiva) return '';
  const e=S.ejActiva;
  const cls={en_cola:'warn',despachado:'info',ejecutando:'info',exitoso:'ok',fallido:'pel',tiempo_agotado:'warn',cancelado:'off'};
  return pill(e.estado||'—', cls[e.estado]||'info');
 },

  _pollTimer:null,
  _secuenciaVista:0,
  _procesarFrag(f){
   if(!f)return;
   const seq=f.secuencia||0;
   if(seq>0&&seq<=this._secuenciaVista)return;
   if(seq>0)this._secuenciaVista=seq;
   let txt=f.texto||f.contenido||'';
   if(!txt)return;
   txt=txt.replace(/\r?\n/g,'\r\n');
   if(!txt.endsWith('\r\n')) txt+='\r\n';
   if(f.flujo==='error_estandar'||f.flujo==='stderr')Term.escr('\x1b[31m'+txt+'\x1b[0m');
   else if(f.flujo==='sistema')Term.escr('\x1b[90m'+txt+'\x1b[0m');
   else Term.escr(txt);
  },
  _finalizarEjecucion(ej){
   const fin=['exitoso','fallido','tiempo_agotado','cancelado'];
   if(this._pollTimer){clearInterval(this._pollTimer);this._pollTimer=null}
   S.ejActiva=Object.assign({},S.ejActiva,ej);
   const a=$('#t-aviso'); if(a)a.innerHTML=VistaTerminal.estado();
   const btn=$('[data-acc=tCancelar]'); if(btn)btn.disabled=true;
   const inp=$('#t-input'); if(inp)inp.disabled=false;
   if(fin.includes(ej.estado)){
    const col=ej.estado==='exitoso'?'\x1b[32m':'\x1b[31m';
    Term.escr('\r\n'+col+'['+ej.estado.toUpperCase()+'] código: '+(ej.codigo_salida!=null?ej.codigo_salida:'—')+'\x1b[0m\r\n');
    // Agregar al historial local Y resetear cache del panel
    S.historialLocal=S.historialLocal||[];
    S.historialLocal.unshift(ej);
    if(S.historialLocal.length>50)S.historialLocal.pop();
    // Forzar recarga del historial del panel en la próxima apertura
    S.historialPanel=null;
    this._histCargado=false;
    // Si el panel lateral está en historial, refrescarlo
    if(S.panelDer==='historial'){
     const pc=$('#pcuerpo');
     if(pc) pc.innerHTML=VistaTerminal._panelHistorial();
    }
    const g=$('#t-guardar'); if(g)g.style.display='flex';
   }
  },
  hist(){
   if(!S.ejActiva)return;
   const ejId=S.ejActiva.id;
   const self=this;
   self._secuenciaVista=0;
   if(self._pollTimer){clearInterval(self._pollTimer);self._pollTimer=null}

   // 1. Cargar fragmentos previos
   if(typeof Datos!=='undefined'&&Datos.salida){
    Datos.salida(ejId,0).then(function(fragmentos){
     if(fragmentos&&fragmentos.length){
      fragmentos.forEach(f=>self._procesarFrag(f));
     }
    }).catch(function(){});
   }

   // 2. Suscribirse a Realtime de Supabase
   if(typeof Realtime!=='undefined'&&Realtime.seguir){
    Realtime.seguir(ejId,
     function(frag){self._procesarFrag(frag)},
     function(ej){self._finalizarEjecucion(ej)}
    );
   }

   // 3. Polling activo de respaldo (cada 750 ms) para asegurar salida en vivo 100%
   self._pollTimer=setInterval(async function(){
    if(!S.ejActiva||S.ejActiva.id!==ejId||FIN.includes(S.ejActiva.estado)){
     if(self._pollTimer){clearInterval(self._pollTimer);self._pollTimer=null}
     return;
    }
    try{
     const frags=await Datos.salida(ejId,self._secuenciaVista);
     if(frags&&frags.length){
      frags.forEach(f=>self._procesarFrag(f));
     }
     const datos=await Datos.ejecucion(ejId);
     if(datos&&datos.estado){
      S.ejActiva=Object.assign({},S.ejActiva,datos);
      const a=$('#t-aviso'); if(a)a.innerHTML=VistaTerminal.estado();
      if(FIN.includes(datos.estado)){
       const ultimos=await Datos.salida(ejId,self._secuenciaVista);
       if(ultimos&&ultimos.length)ultimos.forEach(f=>self._procesarFrag(f));
       self._finalizarEjecucion(datos);
      }
     }
    }catch(_){}
   },750);
  },

 montar(){
  this._montado=true;
  const act=Sesion.actual();
  const self=this;
  setTimeout(function(){
   const cuerpo=$('#tcuerpo');
   if(cuerpo&&typeof Term!=='undefined'){
    Term.mont(cuerpo);
    if(act){
     const d=dev(act.dispId);
     Term.bienvenida(d);
     (act.lineas||[]).forEach(function(l){
      if(l.f==='s') Term.escr('\x1b[90m'+l.t+'\x1b[0m\r\n');
      else if(l.f==='e') Term.escr('\x1b[31m'+l.t+'\x1b[0m\r\n');
      else if(l.f==='i') Term.escr('\x1b[36m'+(l.p||'>')+' '+l.t+'\x1b[0m\r\n');
      else Term.escr(l.t+'\r\n');
     });
     if(S.ejActiva&&!FIN.includes(S.ejActiva.estado)){
      self.hist();
     }
    } else {
     Term.escr('\x1b[90mSelecciona un equipo en el panel izquierdo\x1b[0m\r\n');
    }
   }
   const inp=$('#t-input');
   if(inp) inp.focus();
  },60);
  this._onEquipos=function(){VistaTerminal._refrescarArbol()};
  this._onSel=function(){VistaTerminal._refrescarArbol()};
  this._onCmds=function(){VistaTerminal._refrescarPanel()};
  Bus.on('equipos',this._onEquipos);
  Bus.on('sel',this._onSel);
  Bus.on('comandos:cargados',this._onCmds);
 },

 salir(){
  this._montado=false;
  if(this._pollTimer){clearInterval(this._pollTimer);this._pollTimer=null}
  if(this._onEquipos) Bus.off('equipos',this._onEquipos);
  if(this._onSel) Bus.off('sel',this._onSel);
  if(this._onCmds) Bus.off('comandos:cargados',this._onCmds);
 },

 _refrescarArbol(){
  const arbol=$('.arbol');
  if(!arbol) return;
  const parent=arbol.parentElement;
  if(parent){
   const nuevo=document.createElement('div');
   nuevo.innerHTML=VistaTerminal._arbol(S.dispositivos);
   const nuevoArbol=nuevo.querySelector('.arbol');
   if(nuevoArbol) parent.replaceChild(nuevoArbol, arbol);
  }
 },

 _refrescarPanel(){
  const p=$('#pcuerpo');
  if(p) p.innerHTML=VistaTerminal._panelContenido(S.panelDer||'catalogo');
 }
};

/* =====================================================================
   TERMINAL · Motor de ejecución
   ===================================================================== */
const Motor={
 async lanzar(texto=null,cmdId=null,confirmar=false){
  const d=dev(S.dispActivo);
  if(!d){Toast.mostrar('Selecciona un equipo primero','aviso');return}
  if(!d.en_linea){Toast.mostrar('El equipo está fuera de línea','aviso');return}
  if(!texto&&!cmdId){Toast.mostrar('Escribe un comando','aviso');return}
  try{
   // BTL-200: si el comando tiene variantes, resolver el script correcto para este SO
   const cmdObj=cmdId?S.comandos.find(x=>x.id===cmdId):null;
   let textoFinal=texto;
   let cmdIdFinal=cmdId;
   if(cmdObj && typeof esMultiPlataforma==='function' && esMultiPlataforma(cmdObj)){
    const scriptVariante=resolverScript(cmdObj,d);
    if(scriptVariante){
     textoFinal=scriptVariante; // script ad-hoc para este SO
     cmdIdFinal=cmdId;          // referencia al comando en historial
    }
   }
   const id=await Datos.ejecutar({dispositivo:d.id,comando:cmdIdFinal,texto:textoFinal,confirmar});
   S.ejActiva={id,estado:'en_cola',codigo_salida:null};
   Term.limpiar();
   if(cmdObj){
    const scriptMostrar=(typeof resolverScript==='function'?resolverScript(cmdObj,d):null)||cmdObj.script||'';
    const badgeSO=(typeof esMultiPlataforma==='function'&&esMultiPlataforma(cmdObj))?' \x1b[35m[multi-SO → '+(d.sistema||'?')+']\x1b[0m':'';
    Term.escr('\x1b[36m$ [Catálogo: '+cmdObj.nombre+']'+badgeSO+'\x1b[0m\r\n\x1b[90m'+scriptMostrar+'\x1b[0m\r\n');
   }else if(textoFinal){
    Term.escr(`\x1b[36m$ ${texto}\x1b[0m\r\n`);
   }

/* =====================================================================
   HISTORIAL · Vista de ejecuciones con filtros y agrupación por lote

const VistaHistorial={
 titulo:'Historial',
 sub:()=>'Ejecuciones recientes',
 llena:false,
 _filtro:{estado:'',equipo:'',desde:'',hasta:''},
 _datos:[],
 _lotes:{},
 _abiertos:{},

 render(){
  return `<div class="hist-wrap">
   <div class="filtros">
    <label class="campo"><span>Estado</span>
     <select data-chg="histEstado">
      <option value="">Todos</option>
      <option value="exitoso">Exitoso</option>
      <option value="fallido">Fallido</option>
      <option value="ejecutando">Ejecutando</option>
      <option value="cancelado">Cancelado</option>
      <option value="tiempo_agotado">Tiempo agotado</option>
     </select>
    </label>
    <label class="campo"><span>Equipo</span>
     <select data-chg="histEquipo">
      <option value="">Todos</option>
      ${S.dispositivos.map(d=>`<option value="${d.id}"${this._filtro.equipo===d.id?' selected':''}>${esc(d.nombre)}</option>`).join('')}
     </select>
    </label>
    <label class="campo"><span>Desde</span>
     <input type="date" data-chg="histDesde" value="${this._filtro.desde}">
    </label>
    <label class="campo"><span>Hasta</span>
     <input type="date" data-chg="histHasta" value="${this._filtro.hasta}">
    </label>
   </div>
   <div class="tools" style="margin-bottom:10px">
    <div class="grow">
     <span class="ico">${ico('search',14)}</span>
     <input data-inp="histQ" placeholder="Buscar comando o equipo…" autocomplete="off">
    </div>
    <button class="btn" data-acc="histRefrescar">${ico('retry',14)} Actualizar</button>
   </div>
   <div class="tarj" style="overflow:hidden;padding:0">
    <div class="tab-scroll"><table class="t" id="hist-tabla">
     <thead><tr>
      <th style="width:34px"></th>
      <th>Fecha</th><th>Equipo</th><th>Comando</th>
      <th>Estado</th><th>Duración</th><th>Código</th><th>Acciones</th>
     </tr></thead>
     <tbody id="hist-body"></tbody>
    </table></div>
   </div>
   <div id="hist-vacio" class="vacio" hidden>Sin ejecuciones que coincidan con los filtros.</div>
  </div>`;
 },

 montar(){
  this._cargar();
 },

 async _cargar(){
  try{
   let q=sb.from('ejecuciones_comandos')
    .select('id,dispositivo_id,comando_id,lote_id,estado,texto_comando,interprete,codigo_salida,duracion_ms,mensaje_error,creado,iniciado,terminado,origen')
    .order('creado',{ascending:false}).limit(200);
   const f=this._filtro;
   if(f.estado)q=q.eq('estado',f.estado);
   if(f.equipo)q=q.eq('dispositivo_id',f.equipo);
   if(f.desde)q=q.gte('creado',f.desde+'T00:00:00');
   if(f.hasta)q=q.lte('creado',f.hasta+'T23:59:59');
   const {data,error}=await q;
   if(error){Toast.mostrar('Error al cargar historial','err',error.message);return}
   this._datos=data||[];
   this._renderTabla();
  }catch(e){
   Toast.mostrar('Error al cargar historial','err',e.message);
  }
 },

 _renderTabla(){
  const body=$('#hist-body');
  const vacio=$('#hist-vacio');
  if(!body)return;
  const q=(this._q||'').toLowerCase();
  let filas=this._datos;
  if(q){
   filas=filas.filter(e=>{
    const d=dev(e.dispositivo_id);
    const c=S.comandos.find(x=>x.id===e.comando_id);
    const txt=[d?.nombre,c?.nombre,e.texto_comando].filter(Boolean).join(' ').toLowerCase();
    return txt.includes(q);
   });
  }
  if(!filas.length){
   body.innerHTML='';
   if(vacio)vacio.hidden=false;
   return;
  }
  if(vacio)vacio.hidden=true;

  // Agrupar por lote
  const lotes={};
  const sueltas=[];
  filas.forEach(e=>{
   if(e.lote_id){
    if(!lotes[e.lote_id])lotes[e.lote_id]={items:[],estado:null};
    lotes[e.lote_id].items.push(e);
   }else sueltas.push(e);
  });

  let html='';
  const pintados=new Set();

  filas.forEach(e=>{
   if(pintados.has(e.id))return;
   if(e.lote_id && lotes[e.lote_id] && lotes[e.lote_id].items.length>1){
    const lote=lotes[e.lote_id];
    if(pintados.has('lote_'+e.lote_id))return;
    pintados.add('lote_'+e.lote_id);
    const abierto=this._abiertos[e.lote_id];
    const ok=lote.items.filter(x=>x.estado==='exitoso').length;
    const fail=lote.items.filter(x=>x.estado==='fallido'||x.estado==='tiempo_agotado').length;
    html+=`<tr class="grupo" data-acc="histLote" data-lote="${e.lote_id}">
     <td>${ico(abierto?'chev':'chev',14)}</td>
     <td>${this._fecha(lote.items[0].creado)}</td>
     <td><span class="flag">${lote.items.length} equipos</span></td>
     <td><b>Lote</b></td>
     <td><span class="fl">${pill('exitoso')} <small>${ok}</small> ${pill('fallido')} <small>${fail}</small></span></td>
     <td>—</td><td>—</td>
     <td><div class="acts">
      <button class="ib" title="Reintentar fallidos" data-acc="histReintentarLote" data-lote="${e.lote_id}">${ico('retry',14)}</button>
     </div></td>
    </tr>`;
    if(abierto){
     lote.items.forEach(h=>{
      pintados.add(h.id);
      html+=this._fila(h,true);
     });
    }
    lote.items.forEach(h=>pintados.add(h.id));
   }else{
    pintados.add(e.id);
    html+=this._fila(e,false);
   }
  });
  body.innerHTML=html;
 },

 _fila(e,hijo){
  const d=dev(e.dispositivo_id);
  const c=S.comandos.find(x=>x.id===e.comando_id);
  return `<tr class="fila${hijo?' hijo':''}" data-acc="histDetalle" data-id="${e.id}">
   <td></td>
   <td style="white-space:nowrap;font-size:12px">${this._fecha(e.creado)}</td>
   <td><div class="nm"><b>${esc(d?.nombre||'—')}</b><small>${esc(d?.ip_local||'')}</small></div></td>
   <td><div><span class="cmdn">${esc(c?.nombre||'Comando manual')}</span>
    <span class="cmdt">${esc(e.texto_comando||c?.script||'')}</span></div></td>
   <td>${pill(e.estado)}</td>
   <td style="font:12px var(--f-mono)">${durTxt(e.duracion_ms)}</td>
   <td style="font:12px var(--f-mono)">${e.codigo_salida!=null?e.codigo_salida:'—'}</td>
   <td><div class="acts">
    <button class="ib" title="Ver salida" data-acc="histSalida" data-id="${e.id}">${ico('expand',14)}</button>
    ${FIN.includes(e.estado)?`<button class="ib" title="Reintentar" data-acc="histReintentar" data-id="${e.id}">${ico('retry',14)}</button>`:''}
    ${!FIN.includes(e.estado)?`<button class="ib pel" title="Cancelar" data-acc="histCancelar" data-id="${e.id}">${ico('stop',14)}</button>`:''}
   </div></td>
  </tr>`;
 },

 _fecha(t){
  if(!t)return '—';
  const d=new Date(t);
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 },

 async verSalida(id){
  const frags=await Datos.salida(id,0);
  const ej=await Datos.ejecucion(id);
  const d=dev(ej?.dispositivo_id);
  const txt=frags.map(f=>{
   if(f.flujo==='error_estandar')return `<div class="ln e">${esc(f.texto)}</div>`;
   return `<div class="ln o">${esc(f.texto)}</div>`;
  }).join('')||'<div class="ln s">Sin salida registrada.</div>';
  Modal.abrir({aria:'Salida de ejecución',lado:true,ancho:640,titulo:'Salida · '+(d?.nombre||'Equipo'),
   html:`<div class="kv" style="margin-bottom:12px">
    <dt>Estado</dt><dd>${pill(ej?.estado||'—')}</dd>
    <dt>Duración</dt><dd>${durTxt(ej?.duracion_ms)}</dd>
    <dt>Código</dt><dd>${ej?.codigo_salida??'—'}</dd>
    ${ej?.mensaje_error?`<dt>Error</dt><dd style="color:var(--pel)">${esc(ej.mensaje_error)}</dd>`:''}
   </div>
   <div class="tcuerpo" style="max-height:50vh;border-radius:14px">${txt}</div>`,
   pie:`<button class="btn" data-acc="mCerrar">Cerrar</button>`
  });
 }
};

Acc.histReintentarLote=async el=>{
 const loteId=el.dataset.lote;
 if(!loteId)return;
 // Obtener ejecuciones fallidas del lote
 const {data:fallidas,error}=await sb.from('ejecuciones_comandos')
  .select('id,dispositivo_id,comando_id,texto_comando')
  .eq('lote_id',loteId)
  .in('estado',['fallido','tiempo_agotado']);
 if(error||!fallidas||!fallidas.length){
  Toast.mostrar('No hay ejecuciones fallidas en este lote','aviso');
  return;
 }
 let ok=0, fail=0;
 for(const ej of fallidas){
  try{
   await Datos.ejecutar({dispositivo:ej.dispositivo_id,comando:ej.comando_id,texto:ej.texto_comando});
   ok++;
  }catch(e){ fail++; }
 }
 Toast.mostrar(`Reintentando ${ok} ejecución(es)${fail?' · '+fail+' error(es)':''}`,ok?'ok':'aviso');
 VistaHistorial._cargar();
};

 },

};

 abrir(){

 async cambiarPass(e){
  e.preventDefault();
  const p1=$('#mc-pass1').value, p2=$('#mc-pass2').value;
  const err=$('#mc-pass-err'), ok=$('#mc-pass-ok'), btn=$('#mc-pass-btn');
  err.textContent=''; ok.textContent='';
  if(p1.length<8){err.textContent='La contraseña debe tener al menos 8 caracteres.';return}
  if(p1!==p2){err.textContent='Las contraseñas no coinciden.';return}
  btn.disabled=true; btn.textContent='Actualizando…';
  try{
   const {error}=await sb.auth.updateUser({password:p1});
   if(error) throw error;
   ok.textContent='Contraseña actualizada correctamente.';
   $('#mc-pass1').value=''; $('#mc-pass2').value='';
   setTimeout(()=>ok.textContent='',4000);
  }catch(e){
   err.textContent='No se pudo actualizar: '+(e.message||'error desconocido');
  }finally{
   btn.disabled=false; btn.textContent='Actualizar contraseña';
  }
 }
};

      <select data-chg="masComando" id="mas-cmd-sel" style="width:100%;margin-bottom:8px">
       ${VistaMasiva._opcionesComandos(this._seleccion)}
      </select>
      <div style="margin-bottom:8px">
       <textarea data-inp="masTexto" id="mas-texto" placeholder="…o escribe un comando manual" rows="3" style="width:100%;resize:vertical;font:13px var(--f-mono);background:var(--neg);color:var(--txt);border:1px solid var(--borde);border-radius:10px;padding:10px"></textarea>
      </div>
      <button class="btn verde w100" data-acc="masLanzar" id="mas-lanzar">${ico('send',14)} Lanzar en ${this._seleccion.length} equipos</button>
     </div>
    </div>
    <div class="mosaico" id="mosaico">
     ${this._renderTiles()}
    </div>
   </div>
  </div>`;
 },

 // Devuelve las <option> del catálogo filtradas según los SO de los equipos seleccionados.
 // Si hay mezcla de SO → solo muestra comandos con variantes (⚡ Multi-SO).
 // Si hay un solo SO → muestra comandos de ese SO + comandos Multi-SO.
 // Si no hay selección → muestra todos.
 _opcionesComandos(seleccion){
  const sos=new Set();
  (seleccion||[]).forEach(id=>{
   const d=dev(id);
   if(d?.sistema)sos.add((d.sistema||'').toLowerCase());
  });
  let comandosFiltrados;
  if(sos.size===0){
   // Sin selección: mostrar todos
   comandosFiltrados=S.comandos;
  } else if(sos.size===1){
   // Un solo SO: multi-SO + comandos de ese SO + comandos "todos"
   const so=[...sos][0];
   comandosFiltrados=S.comandos.filter(c=>{
    if(typeof esMultiPlataforma==='function'&&esMultiPlataforma(c))return true;
    const cs=(c.sistema||'').toLowerCase();
    return cs==='todos'||cs===so||cs==='';
   });
  } else {
   // Mezcla de SO: solo comandos Multi-SO (tienen script para cada SO)
   comandosFiltrados=S.comandos.filter(c=>typeof esMultiPlataforma==='function'&&esMultiPlataforma(c));
  }
  // Eliminar duplicados por id (por si hay registros repetidos en BD)
  const vistos=new Set();
  const unicos=comandosFiltrados.filter(c=>{
   if(vistos.has(c.id))return false;
   vistos.add(c.id);return true;
  });
  const hayMezcla=sos.size>1;
  const label=hayMezcla
   ?'— Solo comandos Multi-SO (selección mixta) —'
   :'— Seleccionar del catálogo —';
  return `<option value="">${label}</option>`+
   unicos.map(c=>{
    const multi=typeof esMultiPlataforma==='function'&&esMultiPlataforma(c);
    const badge=multi?' ⚡':'';
    return `<option value="${c.id}">${esc(c.nombre)}${badge}</option>`;
   }).join('');
 },

 // Actualiza el <select> de comandos sin re-renderizar toda la vista
 _actualizarSelect(){
  const sel=$('#mas-cmd-sel');
  if(!sel)return;
  const anterior=sel.value;
  sel.innerHTML=VistaMasiva._opcionesComandos(VistaMasiva._seleccion);
  // Intentar mantener la selección anterior si sigue disponible
  if(anterior&&[...sel.options].some(o=>o.value===anterior))sel.value=anterior;
 },

 _renderTiles(){
  if(!this._lote||!this._lote.ejecuciones) return '<div class="vacio" style="padding:40px;grid-column:1/-1">Selecciona equipos y lanza un comando para ver el mosaico.</div>';
  return this._lote.ejecuciones.map((ej,idx)=>{
   const d=dev(ej.dispositivo_id);
   const tileKey=ej.id || `err-${idx}-${ej.dispositivo_id}`;
   return `<div class="tile" data-ej="${tileKey}">
    <div class="tile-cab">
     <span>${soB(d?.sistema)} <b>${esc(d?.apodo||d?.nombre||'—')}</b></span>
     ${pill(ej.estado)}
    </div>
    <div class="tile-term" id="tile-t-${tileKey}">
     ${ej.error ? `<div style="padding:16px;color:#ff4d6d;font-family:var(--f-mono);font-size:12px;line-height:1.6"><b style="color:#fff">No se pudo despachar:</b><br>${esc(ej.error)}</div>` : ''}
    </div>
   </div>`;
  }).join('');
 },

 montar(){
  if(this._lote && this._lote.ejecuciones){
   this._lote.ejecuciones.forEach(ej=>{
    if(!ej.id)return;
    const host=$(`#tile-t-${ej.id}`);
    if(!host)return;
    const t=new Terminal({theme:{background:'#07070b',foreground:'#e2e8f0',cursor:'#39ff88',
     selectionBackground:'rgba(57,255,136,.22)'},
     fontFamily:'JetBrains Mono, monospace',fontSize:11,lineHeight:1.3,
     cursorBlink:false,scrollback:1000,convertEol:true,allowTransparency:true});
    if(window.FitAddon){const f=new FitAddon.FitAddon();t.loadAddon(f);
     t.open(host);try{f.fit()}catch(_){}
     this._terms[ej.id]={term:t,fit:f};
    }else{t.open(host);this._terms[ej.id]={term:t}}
   });
   this._suscribir();
  }
 },

 salir(){
  Object.values(this._terms).forEach(t=>t.term?.dispose());
  this._terms={};
 },

 _suscribir(){
  if(!this._lote)return;
  this._lote.ejecuciones.forEach(ej=>{
   if(!ej.id)return;
   const canal=sb.channel('masiva_'+ej.id);
   canal.on('postgres_changes',{event:'INSERT',schema:'public',table:'fragmentos_salida_comandos',filter:`ejecucion_id=eq.${ej.id}`},
    payload=>{
     const f=payload.new;
     const t=this._terms[ej.id];
     if(!t)return;
     if(f.flujo==='error_estandar')t.term.write('\x1b[31m'+f.texto+'\x1b[0m');
     else t.term.write(f.texto);
    }).subscribe();
  });
 },

 async _lanzarLote(){
  const cmdId=$('#mas-cmd-sel')?.value;
  const texto=$('#mas-texto')?.value?.trim();
  if(!cmdId&&!texto){Toast.mostrar('Selecciona un comando o escribe uno','aviso');return}
  if(!this._seleccion.length){Toast.mostrar('Selecciona al menos un equipo','aviso');return}

  const ejecuciones=[];
  const cmdObj=cmdId?S.comandos.find(x=>String(x.id)===String(cmdId)):null;
  for(const dId of this._seleccion){
   const dObj=dev(dId);
   try{
    if(!dObj) throw new Error('Equipo no encontrado');
    if(!dObj.en_linea) throw new Error('El equipo está fuera de línea');
    // BTL-200: resolver variante de script por SO del equipo destino
    let textoFinal=texto||null;
    let cmdIdFinal=cmdId?parseInt(cmdId):null;
    const esMulti=cmdObj && typeof esMultiPlataforma==='function' && esMultiPlataforma(cmdObj);
    if(esMulti){
     const variante=resolverScript(cmdObj,dObj);
     if(variante){
      textoFinal=variante;    // script específico para este SO
      cmdIdFinal=parseInt(cmdId); // mantener referencia al comando
     }
    }
    let id;
    try{
     id=await Datos.ejecutar({dispositivo:dId,comando:cmdIdFinal,texto:textoFinal});
    }catch(errRpc){
     // Si el backend rechaza c.sistema <> d.sistema (ej. comando con sistema='todos' o variantes)
     // reintentar directamente con el script resuelto de la variante
     if(/sistema de este equipo|sistema/i.test(errRpc.message||'') && textoFinal){
      id=await Datos.ejecutar({dispositivo:dId,comando:null,texto:textoFinal});
     }else{
      throw errRpc;
     }
    }
    ejecuciones.push({id,dispositivo_id:dId,estado:'en_cola'});
   }catch(e){
    ejecuciones.push({id:null,dispositivo_id:dId,estado:'fallido',error:e.message});
   }
  }
  this._lote={
   ejecuciones,
   total:ejecuciones.length,
   ok:0, fail:ejecuciones.filter(e=>e.estado==='fallido').length,
   run:0, queue:ejecuciones.filter(e=>e.estado==='en_cola').length
  };
  Nav.ir('masiva');
  this._pollLote();
 },

 async _pollLote(){
  if(!this._lote)return;
  const poll=async()=>{
   let ok=0,fail=0,run=0,queue=0;
   for(const ej of this._lote.ejecuciones){
    if(!ej.id)continue;
    if(FIN.includes(ej.estado))continue;
    const datos=await Datos.ejecucion(ej.id);
    if(datos)ej.estado=datos.estado;
   }
   this._lote.ejecuciones.forEach(e=>{
    const st=(e.estado||'').toLowerCase();
    if(st==='exitoso'||st==='exitosa'||st==='completado')ok++;
    else if(st==='fallido'||st==='fallida'||st==='tiempo_agotado')fail++;
    else if(st==='ejecutando')run++;
    else if(st==='en_cola'||st==='despachado'||st==='pendiente')queue++;
   });
   Object.assign(this._lote,{ok,fail,run,queue});
   // Update header counts
   const prog=$('.mprog');
   if(prog)prog.innerHTML=`${pill('exitoso')} <b>${ok}</b> ${pill('fallido')} <b>${fail}</b> ${pill('ejecutando')} <b>${run}</b> ${pill('en_cola')} <b>${queue}</b>`;
   // Update tile pills
   this._lote.ejecuciones.forEach(ej=>{
    const tile=$(`.tile[data-ej="${ej.id}"]`);
    if(tile){
     const cab=tile.querySelector('.tile-cab');
     const p=cab?.querySelector('.pill');
     if(p){
      const tmp=document.createElement('div');
      tmp.innerHTML=pill(ej.estado);
      if(tmp.firstElementChild)p.replaceWith(tmp.firstElementChild);
     }
    }
   });
   if(run>0||queue>0)setTimeout(poll,5000);
   else Toast.mostrar(`Lote finalizado: ${ok} exitosos, ${fail} fallidos`,'ok');
  };
  setTimeout(poll,3000);
 }
};

/* ░▒ _modulos/70-mini-menu/01-mini-menu.js ▒░ */
/* =====================================================================
   MINI MENÚ CONTEXTUAL · Flotante por equipo seleccionado
   Se abre al hacer clic en una tarjeta de equipo (o al llamar
   MiniMenu.abrir desde otra vista). Muestra:
     1. Cabecera con el equipo y sus alertas activas
     2. Comandos recomendados (ordenados por relevancia de alerta)
     3. Atajos: abrir terminal, ver historial, limpiar selección
   Si eliminas esta carpeta, las tarjetas de equipo caen al
   comportamiento anterior (abrir terminal directo).
   ===================================================================== */
const MiniMenu={
 _el:null,
 _overlay:null,
 _eqId:null,
 _construido:false,
 _construir(){
  if(this._construido)return;
  this._construido=true;
  // Overlay invisible para cerrar al hacer clic afuera
  const ov=document.createElement('div');
  ov.id='mm-overlay';
  ov.className='mm-overlay';
  ov.hidden=true;
  ov.addEventListener('click',e=>{ if(e.target===ov)this.cerrar() });
  document.body.appendChild(ov);
  this._overlay=ov;
  // Panel del menú
  const el=document.createElement('div');
  el.id='mm-panel';
  el.className='vid mm-panel';
  el.hidden=true;
  // Interceptar clicks dentro del mini-menú para ejecutar data-acc sin depender de la propagación a document
  el.addEventListener('click',e=>{
   const btn=e.target.closest('[data-acc]');
   if(btn && Acc[btn.dataset.acc]){
    e.stopPropagation();
    Acc[btn.dataset.acc](btn,e);
   }
  });
  document.body.appendChild(el);
  this._el=el;
 },
 abrir(eqId,x,y){
  this._construir();
  const d=dev(eqId); if(!d)return;
  this._eqId=eqId;
  this._el.innerHTML=this._html(d);
  // Mostrar primero para medir
  this._overlay.hidden=false;
  this._el.hidden=false;
  // Posicionar junto al cursor o al elemento
  const anchoV=innerWidth, altoV=innerHeight;
  const r=this._el.getBoundingClientRect();
  const w=r.width||360, h=r.height||400;
  let px=x||80, py=y||80;
  if(px+w+16>anchoV) px=Math.max(16, anchoV-w-16);
  if(py+h+16>altoV) py=Math.max(16, altoV-h-16);
  this._el.style.left=px+'px';
  this._el.style.top=py+'px';
  this._el.classList.add('abierto');
 },
 cerrar(){
  if(!this._el)return;
  this._el.classList.remove('abierto');
  this._el.hidden=true;
  this._overlay.hidden=true;
  this._eqId=null;
 },
 _html(d){
  const alertas=Datos?._alertasActivas?.(d)||[];
  const rec=(Datos?.recomendados?.(d)||[]).slice(0,6);
  const on=d.en_linea;

  const alertasHtml=alertas.length?
   `<div class="mm-alertas">${alertas.map(a=>{const info=TA[a]||{};
    return `<span class="mm-alerta" style="--c:${info.c||'var(--txt-sec)'}">${ico(info.ic||'alert',11)} ${info.n||a}</span>`;
   }).join('')}</div>`:
   `<div class="mm-sin-alertas">${ico('check',12)} Sin alertas activas</div>`;

  // Rejilla 6 acciones como el boceto
  const a=(ic,c,t,s,acc,dis)=>`<button class="mm-acc${dis?' mm-dis':''}" data-acc="${acc}" data-eq="${d.id}" ${dis?'disabled':''}>
   <span class="cico" style="--c:${c}">${ico(ic,15)}</span><div><b>${t}</b><small>${s}</small></div></button>`;

  const ejDisp = (S.ejActiva && String(S.ejActiva.dispositivo_id) === String(d.id)) ? S.ejActiva : null;
  const ultimaEj = ejDisp ? ('Último: ' + durTxt(ejDisp.duracion_ms)) : 'Reintentar último';

  const rejilla=`<div class="mm-rejilla">
   ${a('terminal','var(--verde)','Abrir terminal','Sesión en vivo','miniTerminal',!on)}
   ${a('list','var(--azul)','Catálogo','Elegir comando','miniCatalogoEquipo',false)}
   ${a('zap','var(--cian)','Fragmentos','Comandos rápidos','miniFrag',!on)}
   ${a('retry','var(--lima)','Reintentar',ultimaEj,'miniReintentar',!on)}
   ${a('history','var(--indigo)','Ver historial','Ejecuciones del equipo','miniHistorial',false)}
   ${a('activity','var(--verde)','Diagnóstico','Info del sistema','miniDiag',!on)}
  </div>`;

  // Comandos recomendados (top 4)
  const cmdsHtml=rec.length?`<div class="mm-sec-titulo">${ico('zap',12)} Recomendados por alerta</div>
   <div class="mm-cmds">${rec.slice(0,4).map(c=>`<button class="mm-cmd" data-acc="miniLanzar" data-id="${c.id}" data-eq="${d.id}" ${!on?'disabled':''}>
    <span class="mm-ic">${ico('terminal',14)}</span>
    <span class="mm-tx"><b>${esc(c.nombre)}</b><small>${esc(c.descripcion||c.interprete||'auto')}</small></span>
    ${c.destructivo?`<span class="mm-dest">${ico('alert',10)}</span>`:''}</button>`).join('')}</div>`:'';

  const otrosSo=d.sistema==='windows'?'PowerShell':d.sistema==='macos'?'zsh / Bash':'Bash';

  return `
   <header class="mm-head">
    <div class="mm-nn" style="flex:1;min-width:0">
     <span class="dot ${on?'on':'off'}"></span>
     <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:6px">
       <b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.apodo || d.nombre)}</b>
       <button class="ib" data-acc="miniEditarApodo" data-eq="${d.id}" title="Cambiar apodo o identificación" style="padding:2px;opacity:.7">
        ${ico('edit',13)}
       </button>
      </div>
      <small style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
       ${d.apodo ? `<span style="opacity:.75">(${esc(d.nombre)}) · </span>`:''}${esc(d.sistema)} · ${esc(d.ip_local||'—')} · ${otrosSo}
      </small>
     </div>
    </div>
    <button class="ib mm-x" data-acc="miniCerrar" aria-label="Cerrar">${ico('x',16)}</button>
   </header>
   ${alertasHtml}
   ${rejilla}
   ${cmdsHtml}
   <div class="mm-foot">
    <button class="btn sm" data-acc="miniMasiva" data-eq="${d.id}">
     ${ico('layers',13)} Agregar a masiva
    </button>
    <button class="btn sm" data-acc="miniCerrar">${ico('x',12)} Cerrar</button>
   </div>
  `;
 }
};

  const {error}=await sb.from('dispositivos').update({apodo:nuevo}).eq('id',d.id);
  if(error){
   // Si la columna apodo aún no ha sido corrida en Supabase, guardamos localmente en localStorage
   let apodos=leer('apodos_equipos',{})||{};
   apodos[d.id]=nuevo;
   guardar('apodos_equipos',apodos);
  }
  d.apodo=nuevo;
  Toast.mostrar('Nombre actualizado','ok',nuevo||d.nombre);
  MiniMenu.cerrar();
  Bus.emit('equipos');
  if(typeof VistaMonitoreo!=='undefined') VistaMonitoreo.refrescar();
 }catch(e){
  let apodos=leer('apodos_equipos',{})||{};
  apodos[d.id]=nuevo;
  guardar('apodos_equipos',apodos);
  d.apodo=nuevo;
  Toast.mostrar('Nombre guardado','ok');
  MiniMenu.cerrar();
  Bus.emit('equipos');
  if(typeof VistaMonitoreo!=='undefined') VistaMonitoreo.refrescar();
 }
};
Acc.miniTerminal=el=>{
 const d=dev(el.dataset.eq); if(!d)return;
 if(!d.en_linea){Toast.mostrar(d.nombre+' está fuera de línea','aviso');return}
 S.dispActivo=d.id; guardar('disp',d.id); S.interprete=null; Sesion.abrir(d.id);
 if(typeof Sel!=='undefined') Sel.fijar([d.id]);
 MiniMenu.cerrar(); Nav.ir('terminal');
};
Acc.miniCatalogoEquipo=el=>{
 const d=dev(el.dataset.eq); if(!d)return;
 S.dispActivo=d.id; guardar('disp',d.id);
 if(typeof Sel!=='undefined') Sel.fijar([d.id]);
 if(typeof VistaCatalogo!=='undefined') VistaCatalogo._so=d.sistema;
 MiniMenu.cerrar(); Nav.ir('catalogo');
};
Acc.miniHistorial=el=>{
 const d=dev(el.dataset.eq); if(!d)return;
 if(typeof Sel!=='undefined') Sel.fijar([d.id]);
 if(typeof VistaHistorial!=='undefined'){
  VistaHistorial._filtro.equipo=d.id;
 }
 MiniMenu.cerrar(); Nav.ir('historial');

Acc.miniFrag=el=>{
 const d=dev(el.dataset.eq);
 if(d){ S.dispActivo=d.id; guardar('disp',d.id); Sesion.abrir(d.id); if(typeof Sel!=='undefined') Sel.fijar([d.id]); }
 MiniMenu.cerrar();
 if(typeof Acc.fFrag==='function') Acc.fFrag();
};
Acc.miniMasiva=el=>{
 const d=dev(el.dataset.eq); if(!d)return;
 if(typeof VistaMasiva!=='undefined'){
  if(!VistaMasiva._seleccion.includes(d.id)) VistaMasiva._seleccion.push(d.id);
 }
 MiniMenu.cerrar(); Nav.ir('masiva');
 Toast.mostrar(d.nombre+' agregado a masiva','ok');
};
Acc.miniReintentar=async el=>{
 const d=dev(el.dataset.eq); if(!d)return;
 if(!d.en_linea){Toast.mostrar(d.nombre+' está fuera de línea','aviso');return}
 S.dispActivo=d.id; guardar('disp',d.id); Sesion.abrir(d.id);
 MiniMenu.cerrar();
 Nav.ir('terminal');

 // 1. Si hay ejActiva para este equipo, usarla directamente
 if(S.ejActiva && (String(S.ejActiva.dispositivo_id)===String(d.id) || !S.ejActiva.dispositivo_id)){
  const ej=S.ejActiva;
  setTimeout(()=>Motor.lanzar(ej.texto_comando||null,ej.comando_id||null),150);
  return;
 }

 // 2. Si no, consultar la última ejecución de este equipo en Supabase
 try{
  const {data}=await sb.from('ejecuciones_comandos')
   .select('id,comando_id,texto_comando,dispositivo_id')
   .eq('dispositivo_id',d.id)
   .order('creado',{ascending:false})
   .limit(1)
   .maybeSingle();

  if(data && (data.texto_comando || data.comando_id)){
   setTimeout(()=>Motor.lanzar(data.texto_comando||null,data.comando_id||null),150);
  }else{
   Toast.mostrar('Sin comandos previos para reintentar','aviso');
  }
 }catch(err){
  Toast.mostrar('Sin comandos previos para reintentar','aviso');
 }
};
Acc.miniDiag=el=>{
 const d=dev(el.dataset.eq); if(!d||!d.en_linea){Toast.mostrar('Equipo fuera de línea','aviso');return}
 S.dispActivo=d.id; guardar('disp',d.id); Sesion.abrir(d.id);
 MiniMenu.cerrar(); Nav.ir('terminal');
 const diag=d.sistema==='windows'?'Get-ComputerInfo | Select-Object CsName,OsName,OsVersion,CsProcessors,CsTotalPhysicalMemory | Format-List'
  :d.sistema==='macos'?'system_profiler SPHardwareDataType SPSoftwareDataType 2>/dev/null | head -30'
  :'uname -a && uptime && free -h && df -h / && lscpu | head -10';
 setTimeout(()=>Motor.lanzar(diag),150);
 Toast.mostrar('Diagnóstico iniciado','ok',d.nombre);
};

Acc.miniLanzar=async el=>{
 const cid=el.dataset.id;
 const eqId=el.dataset.eq||MiniMenu._eqId;
 const c=S.comandos.find(x=>String(x.id)===String(cid));
 const d=dev(eqId);
 if(!c||!d)return;
 if(!d.en_linea){Toast.mostrar(d.nombre+' está fuera de línea','aviso');return}
 // Resolver variante Multi-SO si aplica
 const textoResuelto=(typeof esMultiPlataforma==='function'&&esMultiPlataforma(c))
  ?resolverScript(c,d):null;
 MiniMenu.cerrar();
 S.dispActivo=d.id; guardar('disp',d.id); Sesion.abrir(d.id);
 Nav.ir('terminal');
 setTimeout(()=>{
  if(c.destructivo){
   Modal.abrir({aria:'Confirmar ejecución',ancho:420,titulo:'Acción destructiva',
    html:`<p style="line-height:1.6">El comando <b>${esc(c.nombre)}</b> está marcado como <b style="color:var(--pel)">destructivo</b>.<br>¿Ejecutar en <b>${esc(d.nombre)}</b>?</p>`,
    pie:`<button class="btn" data-acc="mCerrar">Cancelar</button>
     <button class="btn pel" data-acc="tConfirmar" data-id="${c.id}" data-txt="${esc(textoResuelto||'')}">Ejecutar de todas formas</button>`});
  }else{
   if(textoResuelto) Motor.lanzar(textoResuelto,null);
   else Motor.lanzar(null,c.id);
  }
 },150);
};

// Cerrar con ESC
document.addEventListener('keydown',e=>{
 if(e.key==='Escape' && MiniMenu._el && !MiniMenu._el.hidden)MiniMenu.cerrar();
});

/* ░▒ _modulos/90-arranque/01-eventos.js ▒░ */
/* =====================================================================
   ARRANQUE · Delegación global de eventos
   ===================================================================== */
document.addEventListener('click',e=>{
 if(typeof Fab!=='undefined' && Fab.abierto && !e.target.closest('#fabPanel') && !e.target.closest('#fab')) Fab.cerrar();
 const el=e.target.closest('[data-acc]'); if(!el)return;
 const f=Acc[el.dataset.acc]; if(f)f(el,e);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){
  if($('#m-cuenta') && !$('#m-cuenta').hidden){Cuenta.cerrar()}
  else if(typeof MiniMenu!=='undefined' && MiniMenu._el && !MiniMenu._el.hidden){MiniMenu.cerrar()}
  else if($('#modal') && !$('#modal').hidden){Modal.cerrar()}
  else if(typeof Fab!=='undefined'){Fab.cerrar()}
 }
});
document.addEventListener('change',e=>{
 const el=e.target.closest('[data-chg]');
 if(el && Chg[el.dataset.chg])Chg[el.dataset.chg](el,e);
});
document.addEventListener('input',e=>{
 const el=e.target.closest('[data-inp]');
 if(el && Inp[el.dataset.inp])Inp[el.dataset.inp](el,e);
});
let _rafPointer=false;
document.addEventListener('pointermove',e=>{
 if(_rafPointer)return;
 _rafPointer=true;
 requestAnimationFrame(()=>{
  _rafPointer=false;
  const v=e.target.closest&&e.target.closest('.vid');
  if(v){
   const r=v.getBoundingClientRect();
   v.style.setProperty('--mx',(e.clientX-r.left)+'px');
   v.style.setProperty('--my',(e.clientY-r.top)+'px');
  }
 });
},{passive:true});
addEventListener('resize',()=>{ if(typeof Dock!=='undefined')Dock.marcar() });

/* =====================================================================
   ARRANQUE · Iniciar la aplicación
   Este archivo DEBE ser el último; cierra el IIFE principal.
   ===================================================================== */
Acceso.iniciar();
})();
