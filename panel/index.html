<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="build-id" content="1793872113"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitlab-IT · Panel</title><!-- build 1793872113 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{color-scheme:dark;
--neg:#04070a;--tx:#e6f5ee;--tx2:#98afa6;--tx3:#62786f;
--verde:#39ff88;--azul:#2f7bff;--cian:#22e5ff;--lima:#b7ff3c;--indigo:#8a7dff;--pel:#ff4d6d;--ambar:#ffc857;
--f-disp:'Unbounded',system-ui,sans-serif;--f-cuerpo:'Manrope',system-ui,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
--rim:rgba(255,255,255,.12)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--neg);color:var(--tx);font:14px/1.45 var(--f-cuerpo);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cian);outline-offset:2px}
h1,h2,h3,p{margin:0}
code,pre,.mono{font-family:var(--f-mono)}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.ico{flex:none;display:block}

/* ===== fondo ===== */
.fondo{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 50% 0%,#07100f 0%,#04070a 60%)}
.fondo i{position:absolute;border-radius:50%;filter:blur(80px);animation:deriva 28s ease-in-out infinite alternate}
.fondo .a{width:48vmax;height:48vmax;right:-14vmax;top:-16vmax;background:radial-gradient(circle,rgba(25,255,138,.75),transparent 66%);opacity:.5}
.fondo .b{width:54vmax;height:54vmax;left:-20vmax;bottom:-26vmax;background:radial-gradient(circle,rgba(31,107,255,.85),transparent 66%);opacity:.55;animation-delay:-9s}
.fondo .c{width:26vmax;height:26vmax;left:44%;top:34%;background:radial-gradient(circle,rgba(18,217,255,.7),transparent 66%);opacity:.22;animation-delay:-16s}
.fondo::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%);mask-image:radial-gradient(ellipse at 50% 25%,#000,transparent 72%)}
@keyframes deriva{to{transform:translate(6vmax,4vmax) scale(1.12)}}

/* ===== liquid glass ===== */
.vid{position:relative;background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 42%,rgba(255,255,255,.075));
-webkit-backdrop-filter:blur(26px) saturate(185%) brightness(1.06);backdrop-filter:blur(26px) saturate(185%) brightness(1.06);
border:1px solid rgba(255,255,255,.08);
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 34px rgba(90,255,190,.045),0 22px 50px -18px rgba(0,0,0,.75)}
.vid::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
background:linear-gradient(155deg,rgba(255,255,255,.6),rgba(255,255,255,0) 28%,rgba(255,255,255,0) 62%,rgba(47,123,255,.5));
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.vid::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.13),transparent 62%)}
.vid:hover::after{opacity:1}
.cr{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.085);border-radius:16px}

/* ===== controles ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s,box-shadow .2s,border-color .2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.22)}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--verde),var(--cian));color:#021a10;border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 26px rgba(57,255,136,.35)}
.btn.pri:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 34px rgba(57,255,136,.55)}
.btn.azul{background:linear-gradient(135deg,var(--azul),var(--cian));color:#02121d;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 24px rgba(47,123,255,.4)}
.btn.pel{background:rgba(255,77,109,.16);border-color:rgba(255,77,109,.5);color:#ffb3c0}
.btn.sm{padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.ib{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--tx2);transition:.2s;flex:none}
.ib:hover{color:var(--tx);background:rgba(255,255,255,.14)}
.ib.pel:hover{color:var(--pel)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);font-size:12px;font-weight:600;color:var(--tx2);transition:.2s}
button.chip:hover{color:var(--tx);background:rgba(255,255,255,.12)}
.chip.on{color:#03150c;background:linear-gradient(135deg,var(--verde),var(--cian));border-color:transparent}
.chip[disabled]{opacity:.35;pointer-events:none}
input[type=text],input[type=search],input[type=number],select,textarea{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 14px;outline:none;width:100%;min-width:0;font-size:13.5px;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--cian);box-shadow:0 0 0 3px rgba(34,229,255,.18)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
select option{background:#0b1218;color:var(--tx)}
textarea{font-family:var(--f-mono);font-size:12.5px;resize:vertical;min-height:84px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.05);display:inline-grid;place-content:center;cursor:pointer;flex:none;margin:0;transition:.15s}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--verde),var(--cian));border-color:transparent}
input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border-left:2px solid #02110a;border-bottom:2px solid #02110a;transform:rotate(-45deg) translate(1px,-1px)}
label.campo{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.04em;text-transform:uppercase}
label.campo>*:not(span){text-transform:none;letter-spacing:0;font-weight:500;color:var(--tx)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx2);cursor:pointer;user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;transition:.2s;border:0;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s cubic-bezier(.3,1.5,.5,1)}
.sw input:checked{background:linear-gradient(135deg,var(--verde),var(--cian))}
.sw input:checked::after{transform:translateX(14px)}

/* identificadores */
.os{font:700 10px var(--f-mono);letter-spacing:.06em;padding:2px 6px;border-radius:6px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.int{font:600 10.5px var(--f-mono);padding:2px 7px;border-radius:6px;color:var(--tx2);border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.28)}
.cico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 18px color-mix(in srgb,var(--c) 22%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.pill.ejecutando i,.pill.en_ejecucion i{animation:lat 1s ease-in-out infinite}
@keyframes lat{50%{opacity:.25;transform:scale(.7)}}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tx3)}
.dot.on{background:var(--verde);box-shadow:0 0 10px var(--verde)}
.dot.off{background:var(--pel);box-shadow:0 0 8px var(--pel)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px}
.flag.adm{color:var(--ambar);background:rgba(255,200,87,.12);border:1px solid rgba(255,200,87,.35)}
.flag.des{color:var(--pel);background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.4)}
.flag.seg{color:var(--tx2);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font-family:var(--f-mono)}
.etq{font-size:11px;padding:1px 8px;border-radius:99px;color:var(--cian);background:rgba(34,229,255,.08);border:1px solid rgba(34,229,255,.25)}

/* ===== app ===== */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 16px 8px 82px;min-height:72px}
.top h1{font:600 16px var(--f-disp);letter-spacing:.01em}
.top .ts{font-size:12px;color:var(--tx2);margin-top:2px}
.top .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.ws{display:inline-flex;align-items:center;gap:7px;font:600 11px var(--f-mono);color:var(--verde);padding:6px 11px;border-radius:99px;border:1px solid rgba(57,255,136,.3);background:rgba(57,255,136,.08)}
.ws i{width:6px;height:6px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);animation:lat 2s infinite}
.yo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--f-cuerpo);color:#02141a;background:linear-gradient(135deg,var(--cian),var(--azul));border:1px solid rgba(255,255,255,.4)}
#vista{flex:1;min-height:0;overflow:auto;padding:6px 16px 130px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#vista.llena{overflow:hidden;padding-bottom:104px}
.vista-in{animation:ent .4s cubic-bezier(.2,.9,.3,1)}
@keyframes ent{from{opacity:.001;transform:translateY(10px)}}
.panel{border-radius:24px;padding:16px}
.panel>header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel h2{font:600 13px var(--f-disp);letter-spacing:.02em}
.eyebrow{font:600 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.vacio{padding:34px 16px;text-align:center;color:var(--tx2)}

/* ===== monitoreo ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{padding:12px 14px;display:flex;gap:12px;align-items:center}
.kpi b{font:600 20px var(--f-mono);display:block;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{font-size:11.5px;color:var(--tx2)}
.grid-mon{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px;margin-bottom:12px}
.mapa{position:relative;height:340px;border-radius:18px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mapa .zona{position:absolute;border-radius:22px;border:1px dashed rgba(255,255,255,.16);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01))}
.mapa .zona span{position:absolute;left:12px;top:8px;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.mapa svg.lineas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hub{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;border:1.5px solid rgba(34,229,255,.6);background:rgba(34,229,255,.15)}
.nodo{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:4px;background:none;border:0;padding:6px;border-radius:14px;color:var(--tx2)}
.nodo .pt{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--c) 45%);--c:var(--verde);box-shadow:0 0 14px var(--c),0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent);transition:.25s cubic-bezier(.3,1.5,.5,1)}
.nodo.off .pt{--c:var(--pel);filter:saturate(.8)}
.nodo small{font:600 9.5px var(--f-mono);letter-spacing:.02em;white-space:nowrap}
.nodo:hover .pt{transform:scale(1.2)}
.nodo.sel .pt{box-shadow:0 0 18px var(--azul),0 0 0 4px rgba(47,123,255,.4),0 0 0 8px rgba(34,229,255,.16);transform:scale(1.15)}
.nodo.sel small{color:var(--cian)}
.banda{position:absolute;border:1px solid var(--cian);background:rgba(34,229,255,.1);border-radius:8px;pointer-events:none}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--tx2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;text-align:left;width:100%;transition:.2s;position:relative;overflow:hidden}
.alerta:hover{background:rgba(255,255,255,.1)}
.alerta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.alerta b{font-size:13px;display:block}
.alerta small{color:var(--tx2);font-size:11.5px}
.lista-al{display:grid;gap:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .grow{flex:1 1 200px;min-width:160px;position:relative}
.tools .grow .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.tools .grow input{padding-left:36px}
.tab-scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;border-radius:16px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px}
table.t th{position:sticky;top:0;text-align:left;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:8px 12px;background:rgba(6,10,14,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
table.t td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
table.t tr.fila{cursor:pointer;transition:background .15s}
table.t tr.fila:hover{background:rgba(255,255,255,.05)}
table.t tr.sel{background:linear-gradient(90deg,rgba(47,123,255,.2),rgba(34,229,255,.06))}
table.t tr.grupo td{background:rgba(255,255,255,.045);cursor:pointer}
table.t tr.hijo td:first-child{padding-left:30px}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nm b{display:block;font-weight:700}
.nm small{color:var(--tx3);font-family:var(--f-mono);font-size:11px}
.cmdn{font-weight:700;display:block}
.cmdt{font:11.5px var(--f-mono);color:var(--tx2);display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:4px;justify-content:flex-end}

/* ===== dock estilo IG ===== */
#dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;padding:6px;border-radius:999px;-webkit-backdrop-filter:blur(30px) saturate(200%) brightness(1.1);backdrop-filter:blur(30px) saturate(200%) brightness(1.1)}
#dock .btn-d{position:relative;z-index:1;width:66px;height:56px;display:grid;place-items:center;align-content:center;gap:3px;background:none;border:0;border-radius:999px;color:var(--tx2);font:700 10px var(--f-cuerpo);letter-spacing:.02em;transition:color .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
#dock .btn-d:active{transform:scale(.88)}
#dock .btn-d.act{color:#fff}
#dock .btn-d .bd{position:absolute;top:5px;right:12px;min-width:16px;height:16px;border-radius:99px;background:var(--verde);color:#02150b;font:700 9.5px var(--f-mono);display:grid;place-items:center;padding:0 4px;box-shadow:0 0 10px var(--verde)}
#lente{position:absolute;top:6px;left:6px;width:66px;height:56px;border-radius:999px;z-index:0;background:linear-gradient(160deg,rgba(57,255,136,.3),rgba(47,123,255,.32));border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 16px rgba(34,229,255,.12),0 0 28px rgba(57,255,136,.28);transition:transform .5s cubic-bezier(.3,1.35,.5,1)}

/* ===== FAB ===== */
#fab{position:fixed;z-index:50;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:0;padding:0;touch-action:none;color:var(--verde);transition:box-shadow .3s,transform .3s cubic-bezier(.3,1.6,.5,1)}
#fab:active{transform:scale(.92)}
#fab::before{background:linear-gradient(155deg,rgba(255,255,255,.7),rgba(255,255,255,0) 35%,rgba(57,255,136,.55) 100%)}
#fab .ico{filter:drop-shadow(0 0 6px rgba(57,255,136,.8))}
#fab.abierto{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 30px rgba(57,255,136,.4)}
#fabPanel{position:fixed;z-index:49;width:322px;max-width:calc(100vw - 24px);border-radius:28px;padding:10px;transform-origin:var(--ox,0) var(--oy,0);animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
#fabPanel .it{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:18px;background:none;border:0;text-align:left;transition:background .2s}
#fabPanel .it:hover{background:rgba(255,255,255,.09)}
#fabPanel .it b{display:block;font-size:13.5px}
#fabPanel .it small{color:var(--tx2);font-size:11.5px}
.recientes{margin-top:6px;padding:10px 12px 4px;border-top:1px solid rgba(255,255,255,.08)}
.recientes .r{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0}
.recientes .r span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== mini menu contextual ===== */
#mini{position:fixed;z-index:45;width:348px;border-radius:26px;padding:12px;animation:pop .35s cubic-bezier(.3,1.4,.5,1);transform-origin:top left}
#mini .mh{display:flex;align-items:center;gap:10px;cursor:grab;touch-action:none;padding:2px 2px 10px}
#mini .mh:active{cursor:grabbing}
#mini .apilados{display:flex}
#mini .apilados span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 9px var(--f-mono);margin-left:-8px;border:2px solid #0a1116;color:#02141a;background:var(--c)}
#mini .apilados span:first-child{margin-left:0}
#mini .mh b{font-size:14px;display:block}
#mini .mh small{font-size:11.5px;color:var(--tx2)}
.aviso{font-size:11.5px;color:var(--ambar);background:rgba(255,200,87,.09);border:1px solid rgba(255,200,87,.3);border-radius:12px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acc{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:16px;text-align:left;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);transition:.2s cubic-bezier(.3,1.5,.5,1);min-height:52px}
.acc:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
.acc:active{transform:scale(.96)}
.acc .cico{width:30px;height:30px;border-radius:10px}
.acc b{font-size:12.5px;line-height:1.15;display:block}
.acc small{font-size:10.5px;color:var(--tx2)}
.acc[disabled]{opacity:.38;pointer-events:none}
.seg{display:flex;padding:3px;border-radius:99px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);gap:2px;margin:8px 0}
.seg button{flex:1;padding:5px 8px;border-radius:99px;background:none;border:0;font:600 11.5px var(--f-mono);color:var(--tx2)}
.seg button.on{background:linear-gradient(135deg,rgba(57,255,136,.3),rgba(47,123,255,.3));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.fav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.mfoot{display:flex;gap:8px;margin-top:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.lista-c{display:grid;gap:6px;max-height:280px;overflow:auto;margin:8px 0;scrollbar-width:thin}
.item-c{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;text-align:left;width:100%;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);transition:.2s}
.item-c:hover{background:rgba(255,255,255,.12)}
.item-c .cico{width:32px;height:32px;border-radius:11px}
.item-c b{font-size:13px;display:block}
.item-c small{font-size:11px;color:var(--tx2)}
.barra{height:8px;border-radius:99px;background:rgba(255,255,255,.08);display:flex;overflow:hidden}
.barra i{display:block;height:100%;transition:width .5s cubic-bezier(.3,1,.5,1)}
.mrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0}
.mrow span:nth-child(2){flex:1}

/* ===== catálogo ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.card:hover{transform:translateY(-3px)}
.card.inact{opacity:.5}
.card .h{display:flex;gap:11px;align-items:center}
.card .h b{font-size:14px;display:block;line-height:1.2}
.card .h small{font-size:11.5px;color:var(--c)}
.card p{font-size:12.5px;color:var(--tx2)}
.codebox{font:11.5px/1.5 var(--f-mono);padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);color:#c8fbe0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.card .pie{display:flex;gap:6px;align-items:center;margin-top:auto}
.card .pie .btn{flex:1}
.hl-a{color:var(--cian);background:rgba(34,229,255,.12);border-radius:4px;padding:0 3px}
.hl-v{color:var(--azul);filter:brightness(1.5)}
.hl-s{color:var(--lima)}
.hl-f{color:#c6b6ff}

/* ===== historial ===== */
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}

/* ===== terminal ===== */
.term-g{display:grid;grid-template-columns:264px minmax(0,1fr) 336px;gap:12px;height:100%;min-height:0}
.col{border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.col>header{padding:14px 14px 8px}
.arbol{overflow:auto;padding:4px 8px 12px;flex:1;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.arbol details{margin-bottom:4px}
.arbol summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 8px;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.arbol summary::-webkit-details-marker{display:none}
.arbol summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:.2s}
.arbol details[open] summary::before{transform:rotate(45deg)}
.dv{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;transition:.15s}
.dv:hover{background:rgba(255,255,255,.07)}
.dv.sel{background:rgba(47,123,255,.2)}
.dv.act{box-shadow:inset 0 0 0 1px rgba(34,229,255,.55)}
.dv button.nom{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:grid;line-height:1.2}
.dv button.nom b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv button.nom small{font-size:10.5px;color:var(--tx3);font-family:var(--f-mono)}
.tabs{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none;align-items:center}
.tab{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:14px 14px 0 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-bottom:0;font:600 12px var(--f-mono);color:var(--tx2);white-space:nowrap;cursor:pointer}
.tab.act{background:rgba(0,0,0,.42);color:var(--tx);box-shadow:inset 0 2px 0 var(--verde)}
.tab .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--tx3)}
.tab .x:hover{background:rgba(255,255,255,.15);color:#fff}
.tbarra{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap;background:rgba(0,0,0,.42);border-bottom:1px solid rgba(255,255,255,.06)}
.tbarra b{font:700 13px var(--f-mono)}
.tbarra select{width:auto;padding:5px 26px 5px 10px;font:600 11.5px var(--f-mono);border-radius:99px}
.tcuerpo{flex:1;min-height:180px;overflow:auto;background:rgba(0,0,0,.5);padding:12px 14px;font:12.5px/1.55 var(--f-mono);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.ln{white-space:pre-wrap;word-break:break-word}
.ln.o{color:#d7efe4}.ln.e{color:#ff8fa3}.ln.s{color:var(--tx3);font-style:italic}
.ln.i{color:var(--verde)}.ln.i span{color:var(--cian)}
.tguardar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;background:rgba(0,0,0,.5);border-top:1px solid rgba(255,255,255,.05)}
.tentrada{display:flex;gap:10px;align-items:center;padding:10px 12px;background:rgba(0,0,0,.62);border-top:1px solid rgba(255,255,255,.08)}
.tentrada .pr{font:600 12.5px var(--f-mono);color:var(--cian);white-space:nowrap;max-width:36%;overflow:hidden;text-overflow:ellipsis}
.tentrada input{flex:1;background:none;border:0;padding:6px 0;font:13px var(--f-mono);color:var(--verde);border-radius:0;box-shadow:none!important;caret-color:var(--verde)}
.ptabs{display:flex;gap:4px;padding:10px 10px 0}
.ptabs button{flex:1;padding:8px 6px;border-radius:99px;background:none;border:0;font-weight:700;font-size:12px;color:var(--tx2)}
.ptabs button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pcuerpo{flex:1;min-height:0;overflow:auto;padding:10px;display:grid;gap:6px;align-content:start;scrollbar-width:thin}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:12.5px}
.kv dt{color:var(--tx3);font-size:11px;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.kv dd{margin:0;word-break:break-word}
.t-izq-btn{display:none}
.hs{display:none}

/* ===== masiva ===== */
.mcab{display:grid;gap:12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:16px}
.stat b{font:600 22px var(--f-mono);display:block;font-variant-numeric:tabular-nums;color:var(--c)}
.stat small{font-size:11.5px;color:var(--tx2)}
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tile{border-radius:20px;overflow:hidden;display:flex;flex-direction:column;height:230px}
.tile>header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(0,0,0,.3)}
.tile>header b{font:700 12.5px var(--f-mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tb{flex:1;overflow:auto;background:rgba(0,0,0,.5);padding:8px 10px;font:11px/1.5 var(--f-mono);scrollbar-width:thin}
.tile>footer{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(0,0,0,.36);font:11px var(--f-mono);color:var(--tx2)}
.tile>footer .grow{flex:1}

/* ===== modal / hoja ===== */
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
#modal .velo{position:absolute;inset:0;background:rgba(2,6,8,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:vel .3s}
@keyframes vel{from{opacity:0}}
.caja,.hoja{position:relative;width:min(var(--w,640px),100%);max-height:calc(100% - 8px);display:flex;flex-direction:column;border-radius:30px;animation:pop .4s cubic-bezier(.3,1.35,.5,1);transform-origin:center;background:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.06) 45%,rgba(255,255,255,.1))}
.hoja{margin-left:auto;height:calc(100% - 8px);border-radius:30px;transform-origin:right center}
.caja>header,.hoja>header{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.caja>header h2,.hoja>header h2{font:600 15px var(--f-disp);flex:1}
.cuerpo{padding:6px 18px 12px;overflow:auto;display:grid;gap:14px;align-content:start;scrollbar-width:thin}
.caja>footer,.hoja>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap;align-items:center}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.val{display:grid;gap:5px;font-size:12.5px}
.val div{display:flex;gap:8px;align-items:flex-start}
.val .ok{color:var(--verde)}.val .av{color:var(--ambar)}.val .no{color:var(--pel)}
.prev{font:12.5px/1.6 var(--f-mono);padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.07);word-break:break-all}
.prev .ps{color:var(--cian);user-select:none}
.desb{border:1px solid rgba(255,77,109,.5);background:rgba(255,77,109,.1);border-radius:16px;padding:12px;display:grid;gap:8px;font-size:12.5px}
.esq{display:grid;gap:6px}
.esq .r{display:grid;grid-template-columns:1fr 110px 1fr 34px;gap:6px}
.sec-t{font:600 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}

/* ===== toasts ===== */
#toasts{position:fixed;z-index:90;top:calc(14px + env(safe-area-inset-top,0px));right:14px;display:grid;gap:8px;width:min(340px,calc(100vw - 28px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:20px;animation:tin .45s cubic-bezier(.3,1.4,.5,1);font-size:13px}
.toast b{display:block}.toast small{color:var(--tx2)}
.toast .cico{width:28px;height:28px;border-radius:10px}
@keyframes tin{from{opacity:0;transform:translateX(40px) scale(.9)}}


/* capas flotantes con más cuerpo para legibilidad */
#fabPanel,#mini,.caja,.hoja,.toast,#dock{background-color:rgba(6,12,16,.62)}
#mini{max-height:calc(100% - 170px);overflow:auto;scrollbar-width:thin}
.tab .x{background:none;border:0;padding:0}
#toasts{top:calc(74px + env(safe-area-inset-top,0px))}

/* ===== responsive ===== */
@media (max-width:1180px){.term-g{grid-template-columns:230px minmax(0,1fr)}.t-der{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;height:min(60vh,460px);transform:translateY(calc(100% + 16px));transition:transform .45s cubic-bezier(.3,1.2,.5,1)}.t-der.abierto{transform:none}.hs{display:inline-flex}}
@media (max-width:900px){.grid-mon{grid-template-columns:1fr}.term-g{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.t-izq{display:none}.t-izq.abierto{display:flex;position:fixed;inset:80px 12px calc(96px + env(safe-area-inset-bottom,0px)) 12px;z-index:31}.t-izq-btn{display:inline-flex}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){
.top{padding-left:76px}.top .ws{display:none}.f2{grid-template-columns:1fr}
#mini{left:12px!important;right:12px;top:auto!important;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:auto;max-height:64vh;overflow:auto}
#mini .mh{cursor:default}
.acc{min-height:58px}.ib{width:38px;height:38px}
#dock .btn-d{width:58px}#lente{width:58px}
.mapa{height:300px}
.esq .r{grid-template-columns:1fr 1fr}
.caja,.hoja{border-radius:26px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ====== Añadidos propios de la demo de tres pantallas ====== */

/* ---- acceso ---- */
#p-login{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:24px;overflow:hidden}
#p-login .caja-ac{width:min(480px,100%);padding:44px 40px;display:grid;gap:18px;position:relative;overflow:hidden;border-radius:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08) inset,0 1px 0 rgba(255,255,255,.14) inset}
#p-login .lg-aura{position:absolute;inset:-60% -30% auto -30%;height:280px;background:radial-gradient(60% 100% at 50% 0%,rgba(57,255,136,.28),rgba(34,229,255,.12) 40%,transparent 70%);filter:blur(30px);pointer-events:none;z-index:0}
#p-login .marca,#p-login .lg-hola,#p-login .lg-sub,#p-login .campo-lg,#p-login .err,#p-login .btn,#p-login .pie-ac{position:relative;z-index:1}
#p-login .marca{display:flex;align-items:center;gap:14px;margin-bottom:4px}
#p-login .marca .cico{width:54px;height:54px;border-radius:16px;box-shadow:0 0 28px rgba(57,255,136,.4),inset 0 1px 0 rgba(255,255,255,.3)}
#p-login .marca-tx{display:grid;gap:3px}
#p-login .marca b{font:700 19px var(--f-disp);letter-spacing:.005em;display:block;background:linear-gradient(135deg,#fff,#aef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#p-login .marca small{color:var(--tx3);font:600 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase}
#p-login .lg-hola{font:700 26px var(--f-disp);margin:10px 0 0;letter-spacing:-.01em;color:#fff}
#p-login .lg-sub{color:var(--tx2);font-size:13.5px;line-height:1.55;margin:0 0 6px}
#p-login .campo-lg{display:grid;gap:8px;font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase}
#p-login .campo-lg span{padding-left:2px}
#p-login .campo-lg input{text-transform:none;letter-spacing:0;font:500 15px var(--f-cuerpo);color:var(--tx);background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;outline:none;width:100%;box-sizing:border-box;transition:border-color .2s,box-shadow .2s,background .2s}
#p-login .campo-lg input::placeholder{color:var(--tx3);opacity:.5}
#p-login .campo-lg input:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.18)}
#p-login .campo-lg input:focus-visible{border-color:var(--cian);background:rgba(34,229,255,.05);box-shadow:0 0 0 4px rgba(34,229,255,.16)}
#p-login .err{color:var(--pel);font-size:13px;min-height:19px;line-height:1.4;font-weight:500}
#p-login .lg-btn-xl{padding:14px 20px;font-size:15px;border-radius:14px;margin-top:4px;letter-spacing:.01em}
#p-login .pie-ac{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#p-login .pie-chip{color:var(--tx3);font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
@media (max-width:480px){#p-login .caja-ac{padding:36px 26px}#p-login .lg-hola{font-size:22px}}

/* ---- equipos ---- */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.eq{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;border:none;color:inherit;font:inherit}
.eq:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.eq .eh{display:flex;align-items:center;gap:10px;padding:14px 15px 11px}
.eq .eh .nn{flex:1;min-width:0}
.eq .eh b{display:block;font:600 13.5px var(--f-cuerpo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .eh small{color:var(--tx3);font:500 11.5px var(--f-mono);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq .med{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.06)}
.eq .m{background:rgba(0,0,0,.22);padding:10px 13px}
.eq .m span{display:block;color:var(--tx3);font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.eq .m b{display:block;font:600 15px var(--f-mono);margin-top:3px;color:var(--c,var(--tx))}
.eq .pie-e{display:flex;align-items:center;gap:8px;padding:10px 13px;border-top:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.14)}
.eq .pie-e .grow{flex:1;color:var(--tx3);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq.off{opacity:.62}
.eq.off .m b{color:var(--tx3)}
.med-b{height:3px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.med-b i{display:block;height:100%;border-radius:99px;transition:width .5s}

/* ---- terminal: tres zonas ---- */
.t-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;height:100%;min-height:0}
.t-main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0;overflow:hidden}
/* lateral en dos zonas: comandos con scroll propio arriba, equipo fijo abajo */
.t-lado{display:grid;grid-template-rows:minmax(140px,1fr) auto;gap:0;min-height:0;overflow:hidden;background:rgba(8,8,13,.72)}
.t-lado .kv dd{font-weight:600}
.lado-cmd{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;padding:14px 14px 12px}
.lado-cmd .buscar{position:relative;margin-bottom:10px}
.lado-cmd .buscar input{padding:7px 11px 7px 30px;font-size:12.5px;border-radius:11px}
.lado-cmd .buscar .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.lado-eq{padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);max-height:44vh;overflow:auto}
.lado-eq .kv{font-size:12px;gap:6px 12px}
.t-cab{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.2);flex-wrap:wrap}
.t-cab .nn{flex:1;min-width:0}
.t-cab .nn b{display:block;font:600 13.5px var(--f-cuerpo)}
.t-cab .nn small{color:var(--tx3);font:500 11px var(--f-mono)}
#xterm-host{flex:1;min-height:0;padding:10px 4px 4px 12px;background:#07070b}
#xterm-host .xterm{height:100%}
.t-pie{border-top:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.26);padding:10px 12px;display:grid;gap:8px}
.t-linea{display:flex;align-items:center;gap:9px}
.t-linea .gp{font:600 12.5px var(--f-mono);color:var(--verde);flex:none;user-select:none}
.t-linea input{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 13px;color:var(--tx);font:500 12.5px var(--f-mono)}
.t-linea input:focus{outline:none;border-color:rgba(57,255,136,.45);background:rgba(57,255,136,.05)}
.t-linea input:disabled{opacity:.45;cursor:not-allowed}
.t-aviso{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx3)}
.t-aviso.mal{color:var(--ambar)}
.rec{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;overflow-y:auto;overflow-x:hidden;min-height:0;padding-right:2px;align-content:start}
.rec-i{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;padding:9px 11px;line-height:1.3;border-radius:13px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:inherit;cursor:pointer;font:inherit;transition:.16s}
.rec-i:hover:not(:disabled){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);transform:translateX(2px)}
.rec-i:disabled{opacity:.4;cursor:not-allowed}

/* ========== Tema claro — gris marcado, bordes visibles, texto denso ========== */
:root[data-tema="claro"]{color-scheme:light;
  /* fondos en tonos grises, no blanco puro */
  --neg:#e8ecee; --tx:#0a1420; --tx2:#3d4d5c; --tx3:#6b7a8a;
  --rim:#b4c0cc;
  /* acentos más oscuros para contraste */
  --verde:#15803d; --azul:#1e40af; --cian:#0e7490; --lima:#4d7c0f;
  --indigo:#4338ca; --pel:#b91c1c; --ambar:#c2410c;
}
:root[data-tema="claro"] body{background:#e8ecee;color:var(--tx);font-weight:500}
:root[data-tema="claro"] .fondo{background:#e8ecee}
:root[data-tema="claro"] .fondo .a,:root[data-tema="claro"] .fondo .b,:root[data-tema="claro"] .fondo .c{display:none}
:root[data-tema="claro"] .fondo::after{background-image:linear-gradient(rgba(10,20,32,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(10,20,32,.06) 1px,transparent 1px)}
:root[data-tema="claro"] .vid{background:#f1f4f6;border:1.5px solid #b4c0cc;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 2px rgba(10,20,32,.06),0 4px 12px rgba(10,20,32,.08)}
:root[data-tema="claro"] .panel{background:#f1f4f6}

/* Textos con más cuerpo */
:root[data-tema="claro"] h1,:root[data-tema="claro"] h2,:root[data-tema="claro"] h3{color:var(--tx);font-weight:700}
:root[data-tema="claro"] .mut{color:var(--tx)}
:root[data-tema="claro"] .mut2,:root[data-tema="claro"] .ts{color:var(--tx2);font-weight:600}
:root[data-tema="claro"] .mut3{color:var(--tx3);font-weight:600}
:root[data-tema="claro"] p,:root[data-tema="claro"] span,:root[data-tema="claro"] div,:root[data-tema="claro"] label{font-weight:500}
:root[data-tema="claro"] b,:root[data-tema="claro"] strong{font-weight:700}

/* Inputs */
:root[data-tema="claro"] input[type=email],
:root[data-tema="claro"] input[type=password],
:root[data-tema="claro"] input[type=text],
:root[data-tema="claro"] input[type=search],
:root[data-tema="claro"] input[type=number],
:root[data-tema="claro"] select,
:root[data-tema="claro"] textarea{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:500;box-shadow:inset 0 1px 2px rgba(10,20,32,.06)}
:root[data-tema="claro"] input::placeholder,:root[data-tema="claro"] textarea::placeholder{color:#7d8c96;opacity:1;font-weight:500}
:root[data-tema="claro"] input:focus-visible,
:root[data-tema="claro"] select:focus-visible,
:root[data-tema="claro"] textarea:focus-visible{border-color:var(--azul);background:#fff;box-shadow:0 0 0 3px rgba(30,64,175,.15)}

/* Botones */
:root[data-tema="claro"] .btn{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(10,20,32,.06)}
:root[data-tema="claro"] .btn:hover{background:#f1f4f6;border-color:var(--azul);transform:none}
:root[data-tema="claro"] .btn.pri{background:linear-gradient(180deg,#1e40af,#1e3a8a);color:#fff;border-color:#1e3a8a;box-shadow:0 1px 2px rgba(30,64,175,.35),0 2px 5px rgba(30,64,175,.2);font-weight:700}
:root[data-tema="claro"] .btn.pri:hover{background:linear-gradient(180deg,#2451c7,#1e40af);box-shadow:0 2px 4px rgba(30,64,175,.45),0 3px 8px rgba(30,64,175,.3)}
:root[data-tema="claro"] .btn.pel{background:#fee2e2;color:#991b1b;border-color:#dc2626;font-weight:700}
:root[data-tema="claro"] .btn.pel:hover{background:#fecaca;border-color:#991b1b}

/* Header */
:root[data-tema="claro"] .top{background:#f1f4f6;border-bottom:1.5px solid #b4c0cc}

/* Dock, FAB, avatar */
:root[data-tema="claro"] #dock{background:#f1f4f6;border:1.5px solid #b4c0cc;box-shadow:0 8px 24px rgba(10,20,32,.1)}
:root[data-tema="claro"] #dock .btn-d{color:var(--tx2);font-weight:600}
:root[data-tema="claro"] #dock .btn-d.act{color:var(--tx);font-weight:700}
:root[data-tema="claro"] #lente{background:#fafbfc;border:1.5px solid #8a99a8}
:root[data-tema="claro"] #fab{background:linear-gradient(180deg,#1e40af,#1e3a8a);color:#fff;border:1.5px solid #1e3a8a;box-shadow:0 2px 6px rgba(30,64,175,.4),0 6px 16px rgba(30,64,175,.25)}
:root[data-tema="claro"] .yo{background:linear-gradient(180deg,#1e40af,#1e3a8a);color:#fff;border:1.5px solid #1e3a8a;font-weight:700}
:root[data-tema="claro"] .ws{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx2);font-weight:600}
:root[data-tema="claro"] .ws i{background:var(--verde)}

/* Tarjetas, stats */
:root[data-tema="claro"] .card,:root[data-tema="claro"] .tarj,:root[data-tema="claro"] .stat{background:#fafbfc;border:1.5px solid #b4c0cc;color:var(--tx);box-shadow:0 1px 2px rgba(10,20,32,.06)}
:root[data-tema="claro"] .stat b{color:var(--tx);font-weight:700}
:root[data-tema="claro"] .stat small{color:var(--tx2);font-weight:600}

/* Login */
:root[data-tema="claro"] #p-login{background:#e8ecee}
:root[data-tema="claro"] #p-login .caja-ac{background:#f1f4f6;border:1.5px solid #b4c0cc;box-shadow:0 10px 40px rgba(10,20,32,.12),0 2px 8px rgba(10,20,32,.08)}
:root[data-tema="claro"] #p-login .lg-aura{opacity:.5;background:radial-gradient(60% 100% at 50% 0%,rgba(30,64,175,.12),transparent 65%)}
:root[data-tema="claro"] #p-login .marca b{background:none;-webkit-text-fill-color:initial;color:var(--tx);font-weight:800}
:root[data-tema="claro"] #p-login .marca small{color:var(--tx3);font-weight:600}
:root[data-tema="claro"] #p-login .lg-hola{color:var(--tx);font-weight:800}
:root[data-tema="claro"] #p-login .lg-sub{color:var(--tx2);font-weight:500}
:root[data-tema="claro"] #p-login .campo-lg{color:var(--tx3);font-weight:700}
:root[data-tema="claro"] #p-login .campo-lg input{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:500}
:root[data-tema="claro"] #p-login .campo-lg input:hover{background:#fff;border-color:#64748b}
:root[data-tema="claro"] #p-login .campo-lg input:focus-visible{background:#fff;border-color:var(--azul);box-shadow:0 0 0 4px rgba(30,64,175,.18)}
:root[data-tema="claro"] #p-login .pie-chip{background:#fafbfc;border:1.5px solid #b4c0cc;color:var(--tx3);font-weight:700}

/* Catálogo filas */
:root[data-tema="claro"] .cata-thead{background:#f1f4f6;border-bottom:1.5px solid #b4c0cc;color:var(--tx3);font-weight:700}
:root[data-tema="claro"] .cata-tabla{background:#fafbfc}
:root[data-tema="claro"] .cata-fila{border-bottom:1px solid #d1dae2}
:root[data-tema="claro"] .cata-fila:hover{background:#f1f4f6}
:root[data-tema="claro"] .cata-nombre b{color:var(--tx);font-weight:700}
:root[data-tema="claro"] .cata-nombre small{color:var(--tx2);font-weight:500}
:root[data-tema="claro"] .cata-flags .flag{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:700}
:root[data-tema="claro"] .cata-flags .flag.pel{background:#fee2e2;color:#991b1b;border:1.5px solid #dc2626}
:root[data-tema="claro"] .btn-ic{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx2)}
:root[data-tema="claro"] .btn-ic:hover{background:#eef2f7;color:var(--azul);border-color:var(--azul)}
:root[data-tema="claro"] .btn-ic[title="Eliminar"]:hover{background:#fee2e2;border-color:#dc2626;color:#991b1b}

/* Formulario del modal */
:root[data-tema="claro"] .inp-f{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:500}
:root[data-tema="claro"] .inp-f:focus-visible{border-color:var(--azul);background:#fff;box-shadow:0 0 0 3px rgba(30,64,175,.15)}
:root[data-tema="claro"] .lbl-f{color:var(--tx3);font-weight:700}
:root[data-tema="claro"] .lbl-chk{background:#f1f4f6;border:1.5px solid #8a99a8;color:var(--tx);font-weight:600}

/* Toast */
:root[data-tema="claro"] .toast{background:#fafbfc;border:1.5px solid #b4c0cc;color:var(--tx);font-weight:600;box-shadow:0 4px 12px rgba(10,20,32,.12)}

/* ========== Modal: base (Mi cuenta) ========== */
.modal{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;animation:mfade .2s ease}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-caja{position:relative;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:0;background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 42%,rgba(255,255,255,.075));-webkit-backdrop-filter:blur(26px) saturate(185%) brightness(1.06);backdrop-filter:blur(26px) saturate(185%) brightness(1.06);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08) inset,0 1px 0 rgba(255,255,255,.14) inset}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:1;background:rgba(14,22,20,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.modal-tit{display:flex;align-items:center;gap:12px}
.modal-tit .cico{width:38px;height:38px;border-radius:12px;flex:none}
.modal-tit b{display:block;font:700 15px var(--f-disp);letter-spacing:.005em;color:var(--tx)}
.modal-tit small{color:var(--tx3);font:600 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:2px}
.modal-head .ib{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer;color:var(--tx);flex:none}
.modal-head .ib:hover{background:rgba(255,255,255,.12)}
.modal-cuerpo{padding:20px 24px 24px;display:grid;gap:22px}
.mc-sec{display:grid;gap:10px}
.mc-h{font:700 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin:0 0 2px}
.mc-info{display:grid;gap:1px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden}
.mc-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(0,0,0,.2);gap:12px}
.mc-k{color:var(--tx3);font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.mc-v{color:var(--tx);font:500 13.5px var(--f-cuerpo);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-tema{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;color:var(--tx);font-weight:600;font-size:13px;transition:all .18s}
.mc-opt:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.mc-opt.act{background:rgba(34,229,255,.1);border-color:var(--cian);box-shadow:0 0 0 3px rgba(34,229,255,.15)}

.mc-opt.act .mc-opt-ic{color:var(--cian)}
.mc-form{display:grid;gap:12px}
.mc-form .ok{color:var(--verde);font-size:13px;min-height:19px;line-height:1.4;font-weight:500}
.mc-form .err{color:var(--pel);font-size:13px;min-height:19px;line-height:1.4;font-weight:500}

/* ========== Modal Mi cuenta · modo claro ========== */

/* ========== Toolbar del catálogo con chips de filtro ========== */
.cata-toolbar{display:grid;gap:12px;margin-bottom:18px;grid-template-columns:1fr auto;align-items:start}
.cata-buscar{position:relative;grid-column:1/-1}
.cata-buscar input{width:100%;padding:12px 40px 12px 42px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;color:var(--tx);font:500 14px var(--f-cuerpo);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.cata-buscar input:focus-visible{border-color:var(--cian);background:rgba(34,229,255,.04);box-shadow:0 0 0 3px rgba(34,229,255,.15)}
.cata-buscar-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.cata-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--tx2);cursor:pointer}
.cata-clear:hover{background:rgba(255,255,255,.16);color:var(--tx)}

.cata-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-wrap{position:relative}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);color:var(--tx);font:600 12.5px var(--f-cuerpo);cursor:pointer;transition:all .18s;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.chip-on{background:rgba(34,229,255,.12);border-color:var(--cian);color:var(--cian)}
.chip-wrap.open .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.chip-wrap.open .chip svg:last-child{transform:rotate(180deg)}
.chip svg:last-child{transition:transform .2s}
.chip-reset{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.35);color:#ffb3c0;font-weight:700}
.chip-reset:hover{background:rgba(255,77,109,.18);border-color:#ff4d6d;color:#fff}

.chip-pop{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;max-height:340px;overflow-y:auto;background:rgba(14,22,20,.98);border:1.5px solid rgba(255,255,255,.12);border-radius:14px;padding:6px;z-index:50;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 12px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.3);animation:chipPopIn .18s ease}
.chip-pop[hidden]{display:none}
.chip-opt{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;color:var(--tx);font:500 13px var(--f-cuerpo);text-align:left;cursor:pointer;border-radius:9px;transition:background .12s}
.chip-opt:hover{background:rgba(255,255,255,.08)}
.chip-opt.act{background:rgba(34,229,255,.12);color:var(--cian);font-weight:700}
.chip-opt.act::after{content:"✓";margin-left:auto;font-weight:700}
.chip-dot{width:10px;height:10px;border-radius:50%;flex:none}
@keyframes chipPopIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.cata-new-btn{align-self:start;padding:11px 18px;font-size:13.5px;border-radius:14px}

    const {data:p,error:pe}=await sb.rpc('mi_perfil');

const Datos={
 async cargar(){ await Promise.all([this.equipos(),this.comandos()]) },

 async equipos(){
  const {data,error}=await sb.from('dispositivos')
   .select('id,nombre,sistema,ip_local,usuario_so,version_so,arquitectura,version_agente,interpretes,metricas,ultimo_latido,ultimo_contacto,en_linea,activo')
   .eq('activo',true).order('en_linea',{ascending:false}).order('nombre');
  if(error){Toast.mostrar('No se pudieron leer los equipos','err',error.message);return}
  S.dispositivos=(data||[]).map(this.normaliza);
  if(S.dispActivo&&!dev(S.dispActivo))S.dispActivo=null;
 },

 normaliza(d){
  const m=d.metricas||{};
  const discos=Array.isArray(m.discos)?m.discos:[];
  const pr=discos[0]||null;
  return {...d,
   ints:Array.isArray(d.interpretes)?d.interpretes:[],
   cpu:m.cpu_pct??null,
   ram:m.memoria_usada_pct??null,
   ramTot:m.memoria_total_mb?Math.round(m.memoria_total_mb/1024):null,
   disco:pr?{u:pr.unidad,tot:pr.total_gb,libre:pr.libre_gb,pct:pr.libre_pct}:null,
   discos, procesos:Array.isArray(m.procesos_top)?m.procesos_top:[],
   encendido:m.tiempo_encendido_seg??null,
   visto:d.ultimo_latido||d.ultimo_contacto};
 },

 async comandos(){
  const {data:cats}=await sb.from('categorias_comandos').select('id,nombre,orden').order('orden').order('nombre');
  S.categorias=cats||[];
  // Intentar con tipo_alerta; si la columna no existe (migración pendiente), reintentar sin ella
  let cmds, error;
  ({data:cmds,error}=await sb.from('comandos')
   .select('id,categoria_id,nombre,descripcion,sistema,script,interprete,destructivo,requiere_admin,timeout_seg,tipo_alerta,activo')
   .eq('activo',true).order('nombre'));
  if(error && /tipo_alerta|column/i.test(error.message||'')){
   ({data:cmds,error}=await sb.from('comandos')
    .select('id,categoria_id,nombre,descripcion,sistema,script,interprete,destructivo,requiere_admin,timeout_seg,activo')
    .eq('activo',true).order('nombre'));
  }
  if(error){
   if(typeof Toast!=='undefined')Toast.mostrar('No se pudo leer el catálogo','aviso',error.message);
   S.comandos=[]; return;
  }
  S.comandos=cmds||[];
 },

 /* ─── Recomendaciones por reglas (sin IA) ───────────────────────────
    Analiza las métricas reales del equipo y devuelve los comandos del
    catálogo que son relevantes según el estado detectado.
    Orden: alertas activas primero, luego por sistema operativo.         */
 recomendados(d){
  if(!d)return [];
  const alertas=this._alertasActivas(d);
  const compatibles=S.comandos.filter(c=>
   c.sistema===d.sistema || c.sistema==='todos');
  const prioritarios=compatibles.filter(c=>
   c.tipo_alerta && alertas.includes(c.tipo_alerta));
  const resto=compatibles.filter(c=>
   !c.tipo_alerta || !alertas.includes(c.tipo_alerta));
  return [...prioritarios,...resto];
 },

 _alertasActivas(d){
  const alertas=[];
  const m=d;
  if(m.cpu!=null && m.cpu>80) alertas.push('cpu');
  if(m.ram!=null && m.ram>85) alertas.push('memoria');
  if(m.disco){
   const usadoPct=m.disco.pct!=null?m.disco.pct:null;
   if(usadoPct!=null && usadoPct<20) alertas.push('disco');
  }
  if(Array.isArray(m.discos)){
   m.discos.forEach(dk=>{
    if(dk.libre_pct!=null && dk.libre_pct<20 && !alertas.includes('disco'))
     alertas.push('disco');
   });
  }
  if(Array.isArray(m.procesos)&&m.procesos.some(p=>p.cpu>50))
   alertas.push('proceso');
  if(m.visto){
   const seg=(Date.now()-new Date(m.visto))/1000;
   if(seg>120) alertas.push('red');
  }
  return alertas;
 },

 async ejecutar({dispositivo,comando=null,texto=null,confirmar=false}){
  const {data,error}=await sb.rpc('crear_ejecucion',{
   p_dispositivo:dispositivo, p_comando:comando, p_texto:texto,
   p_simulacion:false, p_confirmar:confirmar});
  if(error)throw error;
  return data;
 },

 async cancelar(id){
  const {error}=await sb.rpc('cancelar_ejecucion',{p_ejecucion:id});
  if(error)throw error;
 },

 async ejecucion(id){
  const {data}=await sb.from('ejecuciones_comandos')
   .select('id,dispositivo_id,comando_id,estado,texto_comando,interprete,codigo_salida,duracion_ms,mensaje_error,creado,iniciado,terminado')
   .eq('id',id).maybeSingle();
  return data;
 },

 async salida(id,desde=0){
  const {data}=await sb.from('fragmentos_salida_comandos')
   .select('secuencia,flujo,texto').eq('ejecucion_id',id)
   .gt('secuencia',desde).order('secuencia').limit(4000);
  return data||[];
 },

 async crearComando(campos){
  const {data,error}=await sb.rpc('crear_comando',{
   p_nombre:campos.nombre, p_descripcion:campos.descripcion||'',
   p_categoria_id:campos.categoria_id, p_sistema:campos.sistema,
   p_script:campos.script, p_interprete:campos.interprete||'powershell',
   p_destructivo:!!campos.destructivo, p_requiere_admin:!!campos.requiere_admin,
   p_timeout_seg:campos.timeout_seg||60, p_tipo_alerta:campos.tipo_alerta||null});
  if(error)throw error;
  await this.comandos();
  return data;
 },

 async actualizarComando(id,campos){
  const {error}=await sb.rpc('actualizar_comando',{
   p_id:id, p_nombre:campos.nombre, p_descripcion:campos.descripcion||'',
   p_categoria_id:campos.categoria_id, p_sistema:campos.sistema,
   p_script:campos.script, p_interprete:campos.interprete||'powershell',
   p_destructivo:!!campos.destructivo, p_requiere_admin:!!campos.requiere_admin,
   p_timeout_seg:campos.timeout_seg||60, p_tipo_alerta:campos.tipo_alerta||null});
  if(error)throw error;
  await this.comandos();
 },

 async eliminarComando(id){
  const {error}=await sb.rpc('eliminar_comando',{p_id:id});
  if(error)throw error;
  await this.comandos();
 },

 async duplicarComando(id){
  const {data,error}=await sb.rpc('duplicar_comando',{p_id:id});
  if(error)throw error;
  await this.comandos();
  return data;
 }
};

/* =====================================================================
   Tiempo real: estado de equipos, salida y cierre de ejecuciones
   ===================================================================== */
const Realtime={
 conectar(){
  this.cortar();
  S.canalEq=sb.channel('eq')
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'dispositivos'},({new:n})=>{
    const i=S.dispositivos.findIndex(d=>d.id===n.id);
    if(i<0){Datos.equipos().then(()=>Bus.emit('equipos'));return}
    const antes=S.dispositivos[i].en_linea;
    S.dispositivos[i]=Datos.normaliza({...S.dispositivos[i],...n});
    if(antes!==n.en_linea&&!S.silenciado)
     Toast.mostrar(n.nombre+(n.en_linea?' se conectó':' se desconectó'),n.en_linea?'ok':'aviso');
    Bus.emit('equipos');
   })
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'dispositivos'},()=>{
    Datos.equipos().then(()=>Bus.emit('equipos'));
   })
   .subscribe(st=>this.indicador(st));
 },
 seguir(id,alLlegar,alCerrar){
  this.dejar();
  S.canalSalida=sb.channel('sal-'+id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'fragmentos_salida_comandos',
        filter:'ejecucion_id=eq.'+id},({new:n})=>alLlegar(n))
   .subscribe();
  S.canalEjec=sb.channel('ej-'+id)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ejecuciones_comandos',
        filter:'id=eq.'+id},({new:n})=>alCerrar(n))
   .subscribe();
 },
 dejar(){
  if(S.canalSalida){sb.removeChannel(S.canalSalida);S.canalSalida=null}
  if(S.canalEjec){sb.removeChannel(S.canalEjec);S.canalEjec=null}
 },
 cortar(){ this.dejar(); if(S.canalEq){sb.removeChannel(S.canalEq);S.canalEq=null} },
 indicador(st){
  const ok=st==='SUBSCRIBED', e=$('#ws-ind');
  if(!e)return;
  $('#ws-txt').textContent=ok?'En vivo':'Reconectando…';
  e.style.borderColor=ok?'rgba(57,255,136,.3)':'rgba(255,183,3,.35)';
  e.style.background=ok?'rgba(57,255,136,.08)':'rgba(255,183,3,.08)';
  e.style.color=ok?'var(--verde)':'var(--ambar)';
 }
};

const Toast={
 mostrar(t,tipo='ok',sub=''){
  if(S.silenciado&&tipo!=='forzar')return;
  const c={ok:'var(--verde)',aviso:'var(--ambar)',err:'var(--pel)',info:'var(--cian)'}[tipo]||'var(--cian)';
  const ic={ok:'check',aviso:'alert',err:'alert',info:'zap'}[tipo]||'zap';
  const el=document.createElement('div');el.className='toast vid';
  el.innerHTML=`<span class="cico" style="--c:${c}">${ico(ic,15)}</span><div><b>${esc(t)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`;
  $('#toasts').appendChild(el);setTimeout(()=>{el.style.transition='.4s';el.style.opacity=0;el.style.transform='translateX(30px)';setTimeout(()=>el.remove(),400)},4200);
 }
};

const Acc={},Chg={},Inp={};
const Vistas={};

Vistas.equipos={
 titulo:'Equipos',
 sub(){
  const on=S.dispositivos.filter(d=>d.en_linea).length, t=S.dispositivos.length;
  return t?`${on} de ${t} en línea · latido cada 30 s`:'Sin equipos registrados';
 },
 barra(v,c){return `<div class="med-b"><i style="width:${Math.min(100,Math.max(0,v||0))}%;background:${c}"></i></div>`},
 color(p){return p==null?'var(--tx3)':p<60?'var(--verde)':p<85?'var(--ambar)':'var(--pel)'},

 tarjeta(d){
  const on=d.en_linea, act=d.id===S.dispActivo;
  const dsk=d.disco, usado=dsk?100-(dsk.pct??0):null;
  return `<button class="eq vid ${on?'':'off'}" data-acc="eqAbrir" data-id="${d.id}"
   aria-label="Abrir terminal en ${esc(d.nombre)}"${act?' style="border-color:rgba(57,255,136,.4)"':''}>
   <div class="eh">
    <span class="dot ${on?'on':'off'}"></span>
    <span class="nn"><b>${esc(d.nombre)}</b><small>${esc(d.ip_local||'sin IP')} · ${esc(d.usuario_so||'—')}</small></span>
    ${soB(d.sistema)}
   </div>
   <div class="med">
    <div class="m" style="--c:${this.color(d.cpu)}"><span>CPU</span><b>${d.cpu==null?'—':d.cpu+'%'}</b>
     ${on?this.barra(d.cpu,this.color(d.cpu)):''}</div>
    <div class="m" style="--c:${this.color(d.ram)}"><span>Memoria</span><b>${d.ram==null?'—':d.ram+'%'}</b>
     ${on?this.barra(d.ram,this.color(d.ram)):''}</div>
    <div class="m" style="--c:${this.color(usado)}"><span>Disco ${dsk?esc(dsk.u):''}</span>
     <b>${dsk?gb(dsk.libre)+' libres':'—'}</b>${on&&dsk?this.barra(usado,this.color(usado)):''}</div>
    <div class="m"><span>Agente</span><b style="font-size:12.5px">v${esc(d.version_agente||'—')}</b>
     <div class="mut3" style="font:500 10px var(--f-mono);margin-top:5px">${d.ints.length} intérpretes</div></div>
   </div>
   <div class="pie-e">
    <span class="grow">${on?'latido '+relativo(d.visto):'sin contacto '+relativo(d.visto)}</span>
    ${on?`<span class="flag" style="color:var(--verde);background:rgba(57,255,136,.1);border:1px solid rgba(57,255,136,.25)">${ico('terminal',11)} Abrir</span>`
        :`<span class="flag" style="color:var(--tx3)">${ico('plug',11)} Fuera de línea</span>`}
   </div></button>`;
 },

 render(){
  const on=S.dispositivos.filter(d=>d.en_linea).length;
  const t=S.dispositivos.length;
  if(!t)return `<section class="vid panel vacio" style="display:grid;gap:12px;place-items:center;padding:46px 24px">
   <span class="cico" style="--c:var(--ambar);width:52px;height:52px;border-radius:16px">${ico('plug',22)}</span>
   <div style="text-align:center;line-height:1.6">Todavía no hay equipos registrados.<br>
   <span class="mut3" style="font-size:12.5px">Instala el agente en una computadora y aparecerá aquí en menos de un minuto.</span></div></section>`;
  return `<div class="stats" style="margin-bottom:14px">
   <div class="stat cr" style="--c:var(--verde)"><b>${on}</b><small>En línea</small></div>
   <div class="stat cr" style="--c:var(--pel)"><b>${t-on}</b><small>Fuera de línea</small></div>
   <div class="stat cr" style="--c:var(--azul)"><b>${S.comandos.length}</b><small>Comandos</small></div>
   <div class="stat cr" style="--c:var(--cian)"><b>${t}</b><small>Equipos</small></div></div>
   <div class="tools"><div class="grow"><input type="search" data-inp="eqQ" id="eqQ"
     placeholder="Buscar por nombre, IP o usuario" autocomplete="off">${ico('search',16)}</div>
    <button class="btn" data-acc="eqRefrescar">${ico('retry',14)} Actualizar</button></div>
   <div class="eq-grid" id="eq-grid">${this.lista()}</div>`;
 },

 lista(){
  const q=(this._q||'').toLowerCase().trim();
  const l=S.dispositivos.filter(d=>!q||
   (d.nombre+' '+(d.ip_local||'')+' '+(d.usuario_so||'')+' '+(d.version_so||'')).toLowerCase().includes(q));
  return l.map(d=>this.tarjeta(d)).join('')||
   '<div class="vacio vid panel" style="grid-column:1/-1">Ningún equipo coincide con la búsqueda.</div>';
 },

 refrescar(){ const g=$('#eq-grid'); if(g)g.innerHTML=this.lista(); Nav.sub() }
};
Inp.eqQ=el=>{Vistas.equipos._q=el.value;Vistas.equipos.refrescar()};

 ['todos','Todos (multi-SO)'],

 ['macos','macOS'],
 ['linux','Linux'],
];

const INTERPRETE_OPTS=[
 ['powershell','PowerShell'],
 ['bash','Bash'],
 ['cmd','CMD'],
 ['zsh','Zsh'],
 ['automatico','Automático'],
];

const TA={
 cpu:{ic:'cpu',c:'var(--ambar)'},
 memoria:{ic:'activity',c:'var(--indigo)'},
 disco:{ic:'hdd',c:'var(--cian)'},
 proceso:{ic:'layers',c:'var(--lima)'},
 impresora:{ic:'print',c:'var(--pel)'},
 red:{ic:'wifi',c:'var(--azul)'},
 sistema:{ic:'shield',c:'var(--gris,#aaa)'},
};

const esAdmin=()=>true; // acceso total al CRUD para todos los usuarios

Vistas.catalogo={
 titulo:'Catálogo',
 sub:()=>`${S.comandos.length} comandos`,
 llena:false,
 _q:'',_so:'',_cat:'',_ta:'',
 render(){
  const admin=esAdmin();
  const cats=S.categorias;
  // Etiquetas visibles de los chips
  const labSO = this._so ? (SISTEMA_OPTS.find(o=>o[0]===this._so)?.[1]||'SO') : 'Sistema: todos';
  const catNom = this._cat ? (cats.find(c=>c.id==this._cat)?.nombre||'Categoría') : 'Categoría: todas';
  const labTA = this._ta ? (TIPO_ALERTA_OPTS.find(o=>o[0]===this._ta)?.[1]||'Alerta') : 'Alerta: todas';
  const chevron = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex:none"><path d="M6 9l6 6 6-6"/></svg>`;
  return `<div class="cata-wrap">
   <!-- toolbar con chips de filtro -->
   <div class="cata-toolbar">
    <div class="cata-buscar">
     <span class="cata-buscar-ic">${ico('search',16)}</span>
     <input data-inp="cataQ" placeholder="Buscar comando por nombre o descripción…" value="${esc(this._q)}">
     ${this._q?`<button class="cata-clear" data-acc="cataLimpiarBuscar" title="Limpiar">${ico('x',14)}</button>`:''}
    </div>
    <div class="cata-chips">
     <!-- Chip Sistema -->
     <div class="chip-wrap" id="chip-so-wrap">
      <button class="chip${this._so?' chip-on':''}" data-acc="chipTog" data-chip="so">
       <span>${esc(labSO)}</span>${chevron}
      </button>
      <div class="chip-pop" id="chip-so-pop" hidden>
       <button class="chip-opt${!this._so?' act':''}" data-acc="chipSet" data-chip="so" data-val="">Todos los sistemas</button>
       ${SISTEMA_OPTS.map(([v,l])=>`<button class="chip-opt${this._so===v?' act':''}" data-acc="chipSet" data-chip="so" data-val="${v}">${l}</button>`).join('')}
      </div>
     </div>
     <!-- Chip Categoría -->
     <div class="chip-wrap" id="chip-cat-wrap">
      <button class="chip${this._cat?' chip-on':''}" data-acc="chipTog" data-chip="cat">
       <span>${esc(catNom)}</span>${chevron}
      </button>
      <div class="chip-pop" id="chip-cat-pop" hidden>
       <button class="chip-opt${!this._cat?' act':''}" data-acc="chipSet" data-chip="cat" data-val="">Todas las categorías</button>
       ${cats.map(c=>`<button class="chip-opt${this._cat==c.id?' act':''}" data-acc="chipSet" data-chip="cat" data-val="${c.id}">${esc(c.nombre)}</button>`).join('')}
      </div>
     </div>
     <!-- Chip Alerta -->
     <div class="chip-wrap" id="chip-ta-wrap">
      <button class="chip${this._ta?' chip-on':''}" data-acc="chipTog" data-chip="ta">
       <span>${esc(labTA)}</span>${chevron}
      </button>
      <div class="chip-pop" id="chip-ta-pop" hidden>
       <button class="chip-opt${!this._ta?' act':''}" data-acc="chipSet" data-chip="ta" data-val="">Todas las alertas</button>
       ${TIPO_ALERTA_OPTS.filter(x=>x[0]).map(([v,l])=>{
        const t=TA[v]||{};
        return `<button class="chip-opt${this._ta===v?' act':''}" data-acc="chipSet" data-chip="ta" data-val="${v}"><span class="chip-dot" style="background:${t.c||'var(--tx3)'}"></span>${l}</button>`;
       }).join('')}
      </div>
     </div>
     ${(this._q||this._so||this._cat||this._ta)?`<button class="chip chip-reset" data-acc="cataLimpiarFiltros" title="Limpiar todos los filtros">${ico('x',12)} Limpiar</button>`:''}
    </div>
    ${admin?`<button class="btn pri cata-new-btn" data-acc="cataNew">${ico('plus',18)} Nuevo comando</button>`:''}
   </div>
   <!-- stats -->
   ${this._stats()}
   <!-- tabla -->
   <div class="tarj" style="overflow:hidden;padding:0">
    <div class="cata-thead">
     <span>Nombre</span><span>Sistema</span><span>Categoría</span><span>Alerta</span><span>Flags</span><span></span>
    </div>
    <div class="cata-tabla" id="cata-lista"></div>
   </div>
  </div>`;
 },
 montar(){
  this._q=''; this._so=''; this._cat=''; this._ta='';
  this._renderLista();
  Bus.on('comandos',()=>this._renderLista());
 },
 _stats(){
  const c=S.comandos;
  const win=c.filter(x=>x.sistema==='windows').length;
  const mac=c.filter(x=>x.sistema==='macos').length;
  const multi=c.filter(x=>x.sistema==='todos').length;
  const dest=c.filter(x=>x.destructivo).length;
  return `<div class="stats" style="margin-bottom:16px">
   <div class="stat cr"><b>${c.length}</b><small>Total</small></div>
   <div class="stat cr" style="--c:var(--azul)"><b>${win}</b><small>Windows</small></div>
   <div class="stat cr" style="--c:var(--cian)"><b>${mac}</b><small>macOS</small></div>
   <div class="stat cr" style="--c:var(--indigo)"><b>${multi}</b><small>Multi-SO</small></div>
   <div class="stat cr" style="--c:var(--pel)"><b>${dest}</b><small>Destructivos</small></div>
  </div>`;
 },
 _renderLista(){
  const el=$('#cata-lista'); if(!el)return;
  const lista=this._filtrar();
  el.innerHTML=lista.length?lista.map(c=>this._fila(c,esAdmin())).join('')
   :`<div class="vacio" style="padding:48px 24px">${ico('search',28)}<br>Sin resultados</div>`;
 },
 _filtrar(){
  const q=this._q.toLowerCase(), so=this._so, cat=this._cat, ta=this._ta;
  return S.comandos.filter(c=>{
   if(q&&!c.nombre.toLowerCase().includes(q)&&!(c.descripcion||'').toLowerCase().includes(q))return false;
   if(so&&c.sistema!==so)return false;
   if(cat&&c.categoria_id!=cat)return false;
   if(ta&&c.tipo_alerta!==ta)return false;
   return true;
  });
 },
 _fila(c,admin){
  const catNom=S.categorias.find(x=>x.id===c.categoria_id)?.nombre||'—';
  const taBadge=c.tipo_alerta&&TA[c.tipo_alerta]
   ?`<span class="flag" style="color:${TA[c.tipo_alerta].c};border-color:${TA[c.tipo_alerta].c}44;background:${TA[c.tipo_alerta].c}11">${ico(TA[c.tipo_alerta].ic,12)} ${c.tipo_alerta}</span>`
   :'<span style="color:var(--tx3);font-size:11px">—</span>';
  const soB=c.sistema==='windows'?'<span class="flag" style="color:var(--azul)">Win</span>'
   :c.sistema==='macos'?'<span class="flag" style="color:var(--cian)">macOS</span>'
   :c.sistema==='linux'?'<span class="flag" style="color:var(--lima)">Linux</span>'
   :'<span class="flag">Multi</span>';
  const flags=[
   c.destructivo?`<span class="flag pel">${ico('alert',11)} Destructivo</span>`:'',
   c.requiere_admin?`<span class="flag" style="color:var(--ambar)">${ico('shield',11)} Admin</span>`:'',
  ].filter(Boolean).join('');
  const acciones=admin?`<div class="cata-actos">
   <button class="btn-ic" title="Editar" data-acc="cataEditar" data-id="${c.id}">${ico('edit',15)}</button>
   <button class="btn-ic" title="Duplicar" data-acc="cataDuplicar" data-id="${c.id}">${ico('copy',15)}</button>
   <button class="btn-ic" title="Eliminar" data-acc="cataEliminar" data-id="${c.id}" style="color:var(--pel)">${ico('trash',15)}</button>
  </div>`:'';
  return `<div class="cata-fila">
   <div class="cata-nombre"><b class="cata-nm">${esc(c.nombre)}</b>
    <small>${esc(c.descripcion||'')}</small></div>
   <div>${soB}</div>
   <div style="font-size:12px;color:var(--tx2)">${esc(catNom)}</div>
   <div>${taBadge}</div>
   <div class="cata-flags">${flags||'<span style="color:var(--tx3);font-size:11px">—</span>'}</div>
   ${acciones}
  </div>`;
 },
 abrirForm(id=null){
  const c=id?S.comandos.find(x=>x.id===id):null;
  Modal.abrir({
   aria:c?'Editar comando':'Nuevo comando',
   ancho:640,titulo:c?'Editar comando':'Nuevo comando',
   html:`<div class="form-cata">${this._htmlForm(c)}</div>`,
   pie:`<button class="btn" data-acc="mCerrar">Cancelar</button>
    <button class="btn ok" data-acc="cataGuardar" data-id="${id||''}">${c?'Guardar cambios':'Crear comando'}</button>`
  });
 },
 _htmlForm(c){
  const cats=S.categorias;
  const v=(f,fb='')=>c?esc(c[f]??fb):fb;
  const sel=(f,opts,fb='')=>opts.map(([val,lab])=>`<option value="${val}"${(c?c[f]:fb)===val?' selected':''}>${lab}</option>`).join('');
  return `
   <div class="form-row-2">
    <label class="lbl-f">Nombre *
     <input class="inp-f" name="nombre" placeholder="Nombre del comando" value="${v('nombre')}" required>
    </label>
    <label class="lbl-f">Sistema operativo
     <select class="inp-f" name="sistema"><option value="">—</option>${sel('sistema',SISTEMA_OPTS,'todos')}</select>
    </label>
   </div>
   <label class="lbl-f">Descripción
    <input class="inp-f" name="descripcion" placeholder="Descripción breve" value="${v('descripcion')}">
   </label>
   <div class="form-row-2">
    <label class="lbl-f">Categoría
     <select class="inp-f" name="categoria_id">
      <option value="">Sin categoría</option>
      ${cats.map(cat=>`<option value="${cat.id}"${c?.categoria_id==cat.id?' selected':''}>${esc(cat.nombre)}</option>`).join('')}
     </select>
    </label>
    <label class="lbl-f">Tipo de alerta
     <select class="inp-f" name="tipo_alerta">${TIPO_ALERTA_OPTS.map(([v2,l])=>`<option value="${v2}"${c?.tipo_alerta===v2?' selected':''}>${l}</option>`).join('')}</select>
    </label>
   </div>
   <label class="lbl-f">Script / Comando *
    <textarea class="inp-f mono" name="script" rows="5" placeholder="Escribe el comando o script aquí…">${v('script')}</textarea>
   </label>
   <div class="form-row-2">
    <label class="lbl-f">Intérprete
     <select class="inp-f" name="interprete">${sel('interprete',INTERPRETE_OPTS,'powershell')}</select>
    </label>
    <label class="lbl-f">Timeout (segundos)
     <input class="inp-f" name="timeout_seg" type="number" min="5" max="3600" value="${v('timeout_seg','60')}">
    </label>
   </div>
   <div style="display:flex;gap:12px;flex-wrap:wrap">
    <label class="lbl-chk" style="flex:1;min-width:200px">
     <input type="checkbox" name="destructivo" ${c?.destructivo?'checked':''}>
     <span><b>Comando destructivo</b><small>Requiere confirmación antes de ejecutar</small></span>
    </label>
    <label class="lbl-chk" style="flex:1;min-width:200px">
     <input type="checkbox" name="requiere_admin" ${c?.requiere_admin?'checked':''}>
     <span><b>Requiere administrador</b><small>Eleva privilegios al ejecutar</small></span>
    </label>
   </div>`;
 },
 async guardar(id=null){
  const mo=$('#modal');
  const campos={
   nombre:mo.querySelector('[name=nombre]')?.value?.trim()||'',
   descripcion:mo.querySelector('[name=descripcion]')?.value?.trim()||'',
   sistema:mo.querySelector('[name=sistema]')?.value||'todos',
   categoria_id:mo.querySelector('[name=categoria_id]')?.value||null,
   tipo_alerta:mo.querySelector('[name=tipo_alerta]')?.value||null,
   script:mo.querySelector('[name=script]')?.value?.trim()||'',
   interprete:mo.querySelector('[name=interprete]')?.value||'powershell',
   timeout_seg:parseInt(mo.querySelector('[name=timeout_seg]')?.value)||60,
   destructivo:mo.querySelector('[name=destructivo]')?.checked||false,
   requiere_admin:mo.querySelector('[name=requiere_admin]')?.checked||false,
  };
  if(!campos.nombre||!campos.script){
   Toast.mostrar('Nombre y script son obligatorios','aviso'); return;
  }
  const btn=mo.querySelector('[data-acc=cataGuardar]');
  if(btn){btn.disabled=true;btn.textContent='Guardando…'}
  try{
   if(id){ await Datos.actualizarComando(parseInt(id),campos); Toast.mostrar('Comando actualizado','ok') }
   else { await Datos.crearComando(campos); Toast.mostrar('Comando creado','ok') }
   Modal.cerrar();
   Bus.emit('comandos');
   this._renderLista();
  }catch(e){ Toast.mostrar('Error al guardar','err',e.message); if(btn){btn.disabled=false;btn.textContent=id?'Guardar cambios':'Crear comando'} }
 },
 confirmarEliminar(id){
  const c=S.comandos.find(x=>x.id===id);
  Modal.abrir({aria:'Eliminar comando',ancho:420,titulo:'Eliminar comando',
   html:`<p style="line-height:1.6">¿Eliminar el comando <b>${esc(c?.nombre||'')}</b>?<br>
    <small style="color:var(--tx3)">Se desactiva; el historial de ejecuciones se conserva.</small></p>`,
   pie:`<button class="btn" data-acc="mCerrar">Cancelar</button>
    <button class="btn pel" data-acc="cataEliminarOk" data-id="${id}">Eliminar</button>`});
 },
 async eliminar(id){
  try{
   await Datos.eliminarComando(parseInt(id));
   Toast.mostrar('Comando eliminado','ok');
   Modal.cerrar();
   this._renderLista();
  }catch(e){ Toast.mostrar('Error al eliminar','err',e.message) }
 },
 async duplicar(id){
  try{
   await Datos.duplicarComando(parseInt(id));
   Toast.mostrar('Comando duplicado','ok');
   this._renderLista();
  }catch(e){ Toast.mostrar('Error al duplicar','err',e.message) }
 }
};
