<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bitlab-IT</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    (async function() {
      try {
        if (typeof BTL_CONFIG !== 'undefined' && BTL_CONFIG.supabase_url && window.supabase) {
          const sb = supabase.createClient(BTL_CONFIG.supabase_url, BTL_CONFIG.supabase_key);
          const { data } = await sb.auth.getSession();
          if (data && data.session) {
            window.location.replace('equipos.html');
            return;
          }
        }
      } catch (_) {}
      window.location.replace('login.html');
    })();
  </script>
</head>
<body style="background:#0a0a0f;margin:0;display:flex;align-items:center;justify-content:center;height:100vh;color:#8e8ea0;font-family:system-ui,-apple-system,sans-serif;">
  <p>Cargando Bitlab-IT…</p>
</body>
</html>
