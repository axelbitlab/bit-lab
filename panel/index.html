/* ---------- Chips de filtro: dropdowns custom ---------- */
Acc.chipTog=(el)=>{
 const chip=el.dataset.chip;
 const pop=$('#chip-'+chip+'-pop');
 if(!pop)return;
 // cerrar los otros
 $$('.chip-pop').forEach(p=>{ if(p!==pop)p.hidden=true });
 $$('.chip-wrap').forEach(w=>w.classList.remove('open'));
 pop.hidden=!pop.hidden;
 if(!pop.hidden)$('#chip-'+chip+'-wrap').classList.add('open');
};
Acc.chipSet=(el)=>{
 const chip=el.dataset.chip, val=el.dataset.val;
 const V=Vistas.catalogo;
 if(chip==='so')V._so=val;
 else if(chip==='cat')V._cat=val;
 else if(chip==='ta')V._ta=val;
 // cerrar popovers y re-renderizar toda la vista
 $$('.chip-pop').forEach(p=>p.hidden=true);
 Nav.ir('catalogo');
};
Acc.cataLimpiarBuscar=()=>{
 Vistas.catalogo._q='';
 Nav.ir('catalogo');
};
Acc.cataLimpiarFiltros=()=>{
 const V=Vistas.catalogo;
 V._q=''; V._so=''; V._cat=''; V._ta='';
 Nav.ir('catalogo');
};

// Cerrar popovers al hacer clic afuera
document.addEventListener('click',e=>{
 if(e.target.closest('.chip-wrap'))return;
 $$('.chip-pop').forEach(p=>p.hidden=true);
 $$('.chip-wrap').forEach(w=>w.classList.remove('open'));
},true);

/* =====================================================================
   Terminal en vivo — xterm.js
   ===================================================================== */
const Term={
 _inst:null,_fit:null,
 mont(host){
  if(this._inst){this._inst.dispose();this._inst=null}
  const t=new Terminal({theme:{background:'#07070b',foreground:'#e2e8f0',
   cursor:'#39ff88',selectionBackground:'rgba(57,255,136,.22)',
   black:'#1e1e2e',red:'#ff5470',green:'#39ff88',yellow:'#ffb703',
   blue:'#3b82f6',magenta:'#c084fc',cyan:'#22d3ee',white:'#e2e8f0',
   brightBlack:'#64748b',brightRed:'#ff5470',brightGreen:'#39ff88',
   brightYellow:'#ffb703',brightBlue:'#60a5fa',brightMagenta:'#d8b4fe',
   brightCyan:'#67e8f9',brightWhite:'#f1f5f9'},
   fontFamily:'JetBrains Mono, monospace',fontSize:13,
   lineHeight:1.45,cursorBlink:true,scrollback:3000,
   convertEol:true,allowTransparency:true});
  if(window.FitAddon){const f=new FitAddon.FitAddon();t.loadAddon(f);this._fit=f}
  if(window.WebLinksAddon)t.loadAddon(new WebLinksAddon.WebLinksAddon());
  t.open(host);
  this._inst=t;
  setTimeout(()=>this.ajustar(),80);
  const ro=new ResizeObserver(()=>this.ajustar());
  ro.observe(host);
  return t;
 },
 ajustar(){ try{this._fit?.fit()}catch(_){} },
 escr(txt,tipo='std'){
  const t=this._inst; if(!t)return;
  if(tipo==='err')t.write('\x1b[31m'+txt+'\x1b[0m');
  else if(tipo==='sys')t.write('\x1b[33m'+txt+'\x1b[0m');
  else t.write(txt);
 },
 limpiar(){ this._inst?.clear() },
 bienvenida(d){
  if(!this._inst)return;
  this._inst.writeln(`\x1b[32m╭─ Bitlab-IT Terminal ─────────────────────────────╮\x1b[0m`);
  this._inst.writeln(`\x1b[32m│\x1b[0m  Equipo : \x1b[1m${d.nombre}\x1b[0m`);
  this._inst.writeln(`\x1b[32m│\x1b[0m  SO     : ${d.sistema} ${d.version_so||''}`);
  this._inst.writeln(`\x1b[32m│\x1b[0m  IP     : ${d.ip_local||'—'}`);
  this._inst.writeln(`\x1b[32m╰──────────────────────────────────────────────────╯\x1b[0m`);
  this._inst.writeln('');
 }
};

Vistas.terminal={
 titulo:'Terminal',
 sub:()=>S.dispActivo?dev(S.dispActivo)?.nombre||'':'Elige un equipo',
 llena:true,
 _q:'',
 render(){
  return `<div class="t-wrap">
   <!-- columna central: terminal -->
   <div class="t-main tarj">
    ${this.cabecera()}
    <div id="xterm-host"></div>
    <div class="t-pie">
     <div class="t-linea">
      <span class="gp">&gt;_</span>
      <input id="t-input" data-inp="tCmd" placeholder="Escribe un comando…" autocomplete="off" spellcheck="false" ${!S.dispActivo?'disabled':''}>
      <button class="btn ok" data-acc="tEnviar" ${!S.dispActivo?'disabled':''} style="flex:none">${ico('play',16)}</button>
     </div>
     <div id="t-aviso" class="t-aviso">${this.estado()}</div>
    </div>
   </div>
   <!-- columna derecha: comandos + datos equipo -->
   <div class="t-lado tarj">
    <div class="lado-cmd">
     <div class="buscar">
      <span class="ico">${ico('search',14)}</span>
      <input class="inp" data-inp="tBuscar" placeholder="Buscar…" value="${esc(this._q)}">
     </div>
     <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font:600 10.5px var(--f-mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.08em">Comandos recomendados</span>
      <button class="btn-ic" data-acc="tLimpiar" title="Limpiar terminal">${ico('x',14)}</button>
     </div>
     <div class="rec" id="rec-lista">${this.recomendados()}</div>
    </div>
    <div class="lado-eq" id="lado-eq-data">${this.datos()}</div>
   </div>
  </div>`;
 },
 montar(){
  const host=$('#xterm-host');
  if(host){
   Term.mont(host);
   const d=dev(S.dispActivo);
   if(d)Term.bienvenida(d);
  }
  this.hist();
  Bus.on('equipos',()=>{
   const h=$('#lado-eq-data'); if(h)h.innerHTML=this.datos();
   const inp=$('#t-input'); const btn=$('[data-acc=tEnviar]');
   const ok=!!dev(S.dispActivo);
   if(inp)inp.disabled=!ok;
   if(btn)btn.disabled=!ok;
  });
 },
 salir(){ Realtime.dejar() },
 cabecera(){
  const d=dev(S.dispActivo);
  return `<div class="t-cab">
   <div class="nn">
    <b>${d?esc(d.nombre):'Sin equipo seleccionado'}</b>
    <small>${d?`${d.sistema} · ${d.ip_local||'—'}`:'Selecciona un equipo en Equipos'}</small>
   </div>
   ${d?`<span id="ws-ind" style="display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.12);font:600 10.5px var(--f-mono);letter-spacing:.05em;color:var(--tx3)">
    <span class="dot"></span><span id="ws-txt">Conectando…</span></span>`:''}
   ${d?`<span class="seg">${ico('stop',14)}<button class="btn-ic" data-acc="tCancelar" title="Cancelar ejecución" disabled>${ico('stop',14)}</button></span>`:''}
   <select class="sel-inline" data-inp="tInt" style="font:600 11.5px var(--f-mono)">
    ${(d?.ints||['powershell']).map(i=>`<option>${i}</option>`).join('')}
   </select>
  </div>`;
 },
 estado(){
  const ej=S.ejActiva;
  if(!ej)return `${ico('terminal',14)} Listo`;
  const cl={en_cola:'var(--tx3)',despachado:'var(--ambar)',ejecutando:'var(--verde)',
   exitoso:'var(--verde)',fallido:'var(--pel)',tiempo_agotado:'var(--pel)',cancelado:'var(--tx3)'};
  const lbl={en_cola:'En cola…',despachado:'Despachando…',ejecutando:'Ejecutando…',
   exitoso:`Listo (${ej.codigo_salida??'—'})`,fallido:`Error (${ej.codigo_salida??'—'})`,
   tiempo_agotado:'Tiempo agotado',cancelado:'Cancelado'};
  return `<span style="color:${cl[ej.estado]||'var(--tx)'}">${ico('activity',14)} ${lbl[ej.estado]||ej.estado}</span>`;
 },
 recomendados(){
  const d=dev(S.dispActivo); if(!d)return '<div class="mut3" style="font-size:12px;padding:4px">Selecciona un equipo para ver comandos recomendados</div>';
  const q=this._q.toLowerCase();
  const lista=Datos.recomendados(d).filter(c=>!q||c.nombre.toLowerCase().includes(q));
  if(!lista.length)return '<div class="mut3" style="font-size:12px;padding:4px">Sin comandos disponibles</div>';
  return lista.slice(0,30).map(c=>{
   const ta=c.tipo_alerta&&TA[c.tipo_alerta];
   const badge=ta?`<span style="color:${ta.c};font-size:10px;font-weight:600">${ico(ta.ic,10)} ${c.tipo_alerta}</span>`:
    `<span style="color:var(--tx3);font-size:10px">${c.interprete||'auto'}</span>`;
   const dest=c.destructivo?`<span class="flag pel" style="font-size:10px;padding:1px 5px">${ico('alert',9)}</span>`:'';
   return `<button class="rec-i" data-acc="tCmd2" data-id="${c.id}" ${!d.en_linea?'disabled':''}
    title="${esc(c.descripcion||c.nombre)}">
    <span class="cico" style="--c:${ta?.c||'var(--indigo)'};width:30px;height:30px;border-radius:10px;flex:none">${ico(ta?.ic||'terminal',14)}</span>
    <span class="tt"><b>${esc(c.nombre)}</b><small>${esc(c.descripcion||'')||badge}</small></span>
    ${dest}
   </button>`;
  }).join('');
 },
 datos(){
  const d=dev(S.dispActivo); if(!d)return '<div class="mut3" style="padding:12px;font-size:12px">Sin equipo</div>';
  const bar=(v,max=100)=>`<div class="med-b"><i style="width:${Math.min(100,v||0)}%;background:${v>80?'var(--pel)':v>60?'var(--ambar)':'var(--verde)'}"></i></div>`;
  return `<dl class="kv" style="grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px">
   <dt>IP</dt><dd>${esc(d.ip_local||'—')}</dd>
   <dt>SO</dt><dd>${esc(d.sistema)} ${esc(d.version_so||'')}</dd>
   <dt>Arch</dt><dd>${esc(d.arquitectura||'—')}</dd>
   <dt>Agente</dt><dd>v${esc(d.version_agente||'—')}</dd>
   <dt>CPU</dt><dd>${d.cpu!=null?d.cpu+'%':'—'}${d.cpu!=null?bar(d.cpu):''}</dd>
   <dt>RAM</dt><dd>${d.ram!=null?d.ram+'%':'—'}${d.ram!=null?bar(d.ram):''}</dd>
   ${d.disco?`<dt>${esc(d.disco.u||'C:')}</dt><dd>${d.disco.libre!=null?d.disco.libre+'GB libre':'—'}${d.disco.pct!=null?bar(100-d.disco.pct):''}</dd>`:''}
   <dt>Visto</dt><dd>${relativo(d.visto)}</dd>
  </dl>`;
 },
 hist(){
  const ej=S.ejActiva;
  if(!ej)return;
  Datos.salida(ej.id,0).then(frags=>{
   frags.forEach(f=>Term.escr(f.texto,f.flujo==='error_estandar'?'err':'std'));
  });
  if(!FIN.includes(ej.estado))
   Realtime.seguir(ej.id,
    f=>Term.escr(f.contenido,f.flujo==='error_estandar'?'err':'std'),
    n=>{ S.ejActiva={...S.ejActiva,...n};
     const a=$('#t-aviso'); if(a)a.innerHTML=Vistas.terminal.estado();
     const btn=$('[data-acc=tCancelar]'); if(btn)btn.disabled=FIN.includes(n.estado);
     if(FIN.includes(n.estado))Realtime.dejar(); }
   );
 }
};

Inp.tCmd=el=>{S._cmdPendiente=el.value};
Inp.tBuscar=el=>{Vistas.terminal._q=el.value;const r=$('#rec-lista');if(r)r.innerHTML=Vistas.terminal.recomendados()};
Inp.tInt=el=>{S._interprete=el.value};

/* =====================================================================
   Motor de ejecución
   ===================================================================== */

const Motor={
 async lanzar(texto=null,cmdId=null,confirmar=false){
  const d=dev(S.dispActivo);
  if(!d){Toast.mostrar('Selecciona un equipo primero','aviso');return}
  if(!d.en_linea){Toast.mostrar('El equipo está fuera de línea','aviso');return}
  if(!texto&&!cmdId){Toast.mostrar('Escribe un comando','aviso');return}
  try{
   const id=await Datos.ejecutar({dispositivo:d.id,comando:cmdId,texto,confirmar});
   S.ejActiva={id,estado:'en_cola',codigo_salida:null};
   Term.limpiar();
   if(texto)Term.escr(`\x1b[36m$ ${texto}\x1b[0m\r\n`);
   const aviso=$('#t-aviso'); if(aviso)aviso.innerHTML=Vistas.terminal.estado();
   const btn=$('[data-acc=tCancelar]'); if(btn)btn.disabled=false;
   const inp=$('#t-input'); if(inp){inp.value='';S._cmdPendiente=''}
   Vistas.terminal.hist();
  }catch(e){
   if(e.message?.includes('destructivo')||e.message?.includes('confirmacion')){
    Modal.abrir({aria:'Confirmar ejecución',ancho:420,titulo:'Acción destructiva',
     html:`<p style="line-height:1.6">Este comando está marcado como <b style="color:var(--pel)">destructivo</b>.<br>
      ¿Deseas continuar?</p>`,
     pie:`<button class="btn" data-acc="mCerrar">Cancelar</button>
      <button class="btn pel" data-acc="tConfirmar" data-txt="${esc(texto||'')}" data-id="${cmdId||''}">Ejecutar de todas formas</button>`});
   }else{
    Toast.mostrar('Error al lanzar comando','err',e.message);
   }
  }
 },
 async avance(ej){
  if(!ej||FIN.includes(ej.estado))return;
  const datos=await Datos.ejecucion(ej.id);
  if(!datos)return;
  S.ejActiva={...ej,...datos};
  const aviso=$('#t-aviso'); if(aviso)aviso.innerHTML=Vistas.terminal.estado();
 },
 reconciliar(){
  if(!S.ejActiva||FIN.includes(S.ejActiva.estado))return;
  this.avance(S.ejActiva);
 }
};

setInterval(()=>{if(S.perfil&&S.ejActiva)Motor.reconciliar()},8000);

Acc.tEnviar=()=>Motor.lanzar(S._cmdPendiente?.trim()||$('#t-input')?.value?.trim());
Acc.tCmd2=el=>{
 const c=S.comandos.find(x=>x.id===parseInt(el.dataset.id)); if(!c)return;
 if(c.destructivo){
  Modal.abrir({aria:'Confirmar ejecución',ancho:420,titulo:'Acción destructiva',
   html:`<p style="line-height:1.6">El comando <b>${esc(c.nombre)}</b> está marcado como <b style="color:var(--pel)">destructivo</b>.<br>¿Continuar?</p>`,
   pie:`<button class="btn" data-acc="mCerrar">Cancelar</button>
    <button class="btn pel" data-acc="tConfirmar" data-id="${c.id}">Ejecutar de todas formas</button>`});
 }else{
  Motor.lanzar(null,c.id);
 }
};
Acc.tConfirmar=el=>Motor.lanzar(el.dataset.txt||null,el.dataset.id?parseInt(el.dataset.id):null,true);
Acc.tCancelar=async()=>{
 if(!S.ejActiva)return;
 try{await Datos.cancelar(S.ejActiva.id);Toast.mostrar('Cancelando…','aviso')}
 catch(e){Toast.mostrar('Error al cancelar','err',e.message)}
};
Acc.tLimpiar=()=>Term.limpiar();

/* =====================================================================
   Mi cuenta · tema + cambio de contraseña
   ===================================================================== */
const Tema={
 clave:'btl.tema',
 actual(){ try{return localStorage.getItem(this.clave)||'oscuro'}catch(_){return 'oscuro'} },
 aplicar(t){
  document.documentElement.setAttribute('data-tema',t==='claro'?'claro':'oscuro');
  try{localStorage.setItem(this.clave,t)}catch(_){}
  // marcar visual en modal
  const oA=$('#mc-t-oscuro'),cA=$('#mc-t-claro');
  if(oA&&cA){
   oA.classList.toggle('act',t==='oscuro');
   cA.classList.toggle('act',t==='claro');
  }
 },
 iniciar(){ this.aplicar(this.actual()) }
};

const Cuenta={
 abrir(){
  $('#mc-ico').innerHTML=ico('user',22);
  $('#mc-cerrar').innerHTML=ico('x',18);
  $('#mc-ic-oscuro').innerHTML=ico('moon',22);
  $('#mc-ic-claro').innerHTML=ico('sun',22);
  const nom=S.perfil?.nombre||S.correo||'—';
  $('#mc-sub').textContent=nom;
  $('#mc-correo').textContent=S.correo||'—';
  $('#mc-rol').textContent=S.perfil?.rol||'usuario';
  $('#mc-pass1').value=''; $('#mc-pass2').value='';
  $('#mc-pass-err').textContent=''; $('#mc-pass-ok').textContent='';
  Tema.aplicar(Tema.actual()); // refrescar marca activa
  $('#m-cuenta').hidden=false;
  setTimeout(()=>$('#mc-pass1').focus(),120);
 },
 cerrar(){ $('#m-cuenta').hidden=true },
 async cambiarPass(e){
  e.preventDefault();
  const p1=$('#mc-pass1').value, p2=$('#mc-pass2').value;
  const err=$('#mc-pass-err'), ok=$('#mc-pass-ok'), btn=$('#mc-pass-btn');
  err.textContent=''; ok.textContent='';
  if(p1.length<8){err.textContent='La contraseña debe tener al menos 8 caracteres.';return}
  if(p1!==p2){err.textContent='Las contraseñas no coinciden.';return}
  btn.disabled=true; btn.textContent='Actualizando…';
  try{
   const {error}=await sb.auth.updateUser({password:p1});
   if(error) throw error;
   ok.textContent='Contraseña actualizada correctamente.';
   $('#mc-pass1').value=''; $('#mc-pass2').value='';
   setTimeout(()=>ok.textContent='',4000);
  }catch(e){
   err.textContent='No se pudo actualizar: '+(e.message||'error desconocido');
  }finally{
   btn.disabled=false; btn.textContent='Actualizar contraseña';
  }
 }
};

// Acciones
Acc.cuenta=()=>Cuenta.abrir();
Acc.cuentaCerrar=()=>Cuenta.cerrar();
Acc.temaSet=(el)=>{ const t=el?.dataset?.tema||'oscuro'; Tema.aplicar(t) };

// Submit del form
document.addEventListener('submit',e=>{
 if(e.target&&e.target.id==='f-cambia-pass')Cuenta.cambiarPass(e);
});

// Iniciar tema desde el arranque
Tema.iniciar();

/* =====================================================================
   Navegación, dock y menú flotante
   ===================================================================== */
const Nav={
 ir(v){
  if(!Vistas[v])v='equipos';
  const ant=Vistas[S.vista];
  if(ant&&ant.salir&&S.vista!==v)ant.salir();
  S.vista=v; guardar('vista',v);
  const V=Vistas[v], c=$('#vista');
  $('#tit').textContent=V.titulo;
  c.className=V.llena?'llena':'';
  c.innerHTML=`<div class="vista-in" style="${V.llena?'height:100%':''}">${V.render()}</div>`;
  c.scrollTop=0;
  V.montar&&V.montar();
  this.sub(); Dock.marcar();
 },
 sub(){ const V=Vistas[S.vista]; if(V&&V.sub)$('#subt').textContent=V.sub() }
};

const Dock={
 montar(){
  const d=$('#dock');
  if(d.querySelector('.btn-d'))return;
  d.insertAdjacentHTML('beforeend',VISTAS.map(([id,n,ic])=>
   `<button class="btn-d" data-acc="nav" data-v="${id}" aria-label="${n}">${ico(ic,22)}<span>${n}</span><b class="bd" hidden></b></button>`).join(''));
 },
 marcar(){
  const i=VISTAS.findIndex(x=>x[0]===S.vista), bs=$$('#dock .btn-d');
  if(!bs.length)return;
  bs.forEach((b,k)=>b.classList.toggle('act',k===i));
  const l=$('#lente'); if(l)l.style.transform=`translateX(${Math.max(0,i)*bs[0].offsetWidth}px)`;
  const bd=(k,n)=>{const e=$('.bd',bs[k]); if(!e)return; e.hidden=!n; e.textContent=n};
  bd(0,S.dispositivos.filter(x=>x.en_linea).length);
  bd(1,S.ejActiva&&!FIN.includes(S.ejActiva.estado)?1:0);
 }
};
Acc.nav=el=>{Fab.cerrar();Nav.ir(el.dataset.v)};
Acc.mCerrar=()=>Modal.cerrar();

const Fab={
 el:null,p:null,abierto:false,drag:null,movio:false,
 montar(){
  this.el=$('#fab'); this.p=$('#fabPanel');
  if(this._listo)return; this._listo=true;
  this.el.innerHTML=ico('terminal',24);
  const pos=leer('fab',null);
  if(pos){this.el.style.left=pos.x+'px';this.el.style.top=pos.y+'px'}
  else{this.el.style.left='16px';this.el.style.top='calc(14px + env(safe-area-inset-top,0px))'}
  this.el.addEventListener('pointerdown',e=>{
   const r=this.el.getBoundingClientRect();
   this.drag={sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,mov:false};
   this.el.setPointerCapture(e.pointerId);
  });
  this.el.addEventListener('pointermove',e=>{
   const d=this.drag; if(!d)return;
   const dx=e.clientX-d.sx, dy=e.clientY-d.sy;
   if(!d.mov&&Math.hypot(dx,dy)>6){d.mov=true;this.cerrar()}
   if(d.mov){
    this.el.style.left=Math.max(8,Math.min(innerWidth-60,d.ox+dx))+'px';
    this.el.style.top=Math.max(8,Math.min(innerHeight-60,d.oy+dy))+'px';
   }
  });
  const fin=()=>{
   const d=this.drag; this.drag=null;
   if(d&&d.mov){this.movio=true;setTimeout(()=>this.movio=false,80);
    const r=this.el.getBoundingClientRect();guardar('fab',{x:Math.round(r.left),y:Math.round(r.top)})}
  };
  this.el.addEventListener('pointerup',fin);
  this.el.addEventListener('pointercancel',fin);
 },
 html(){
  const on=S.dispositivos.filter(d=>d.en_linea), d=dev(S.dispActivo);
  const it=(ic,c,t,s,a,dis)=>`<button class="it" data-acc="${a}" ${dis?'disabled style="opacity:.4"':''}>
   <span class="cico" style="--c:${c}">${ico(ic,17)}</span><span><b>${t}</b><small>${esc(s)}</small></span></button>`;
  return `<div class="eyebrow" style="padding:6px 10px 4px">Acceso rápido</div>
   ${it('terminal','var(--verde)','Terminal',d?d.nombre:'Elige un equipo','fTerminal',!d)}
   ${it('monitor','var(--azul)','Equipos',`${on.length} en línea de ${S.dispositivos.length}`,'fEquipos')}
   ${it('list','var(--indigo)','Catálogo',`${S.comandos.length} comandos`,'fCatalogo')}
   ${it('activity','var(--cian)','Estado de agentes','Latidos y versiones','fAgentes')}
   ${it('retry','var(--lima)','Actualizar ahora','Vuelve a leer los equipos','fRefrescar')}
   <div class="recientes"><div class="eyebrow" style="margin-bottom:4px">Equipos en línea</div>
   ${on.slice(0,4).map(x=>`<div class="r"><span class="dot on"></span><span>${esc(x.nombre)}</span>${soB(x.sistema)}</div>`).join('')
     ||'<div class="mut3" style="font-size:11.5px;padding:2px 4px">Ninguno en línea</div>'}</div>`;
 },
 abrir(){
  this.abierto=true; this.el.classList.add('abierto');
  this.el.setAttribute('aria-expanded','true');
  this.p.innerHTML=this.html(); this.p.hidden=false;
  const r=this.el.getBoundingClientRect(), w=Math.min(322,innerWidth-24), h=this.p.offsetHeight;
  const x=Math.max(12,Math.min(r.left,innerWidth-w-12));
  const abajo=r.bottom+10+h<innerHeight;
  this.p.style.left=x+'px';
  this.p.style.top=(abajo?r.bottom+10:Math.max(12,r.top-10-h))+'px';
  this.p.style.setProperty('--ox',(r.left-x+26)+'px');
  this.p.style.setProperty('--oy',abajo?'0px':h+'px');
 },
 cerrar(){
  if(!this.abierto)return;
  this.abierto=false; this.el.classList.remove('abierto');
  this.el.setAttribute('aria-expanded','false'); this.p.hidden=true;
 }
};
Acc.fab=()=>{ if(Fab.movio)return; Fab.abierto?Fab.cerrar():Fab.abrir() };
Acc.fTerminal=()=>{Fab.cerrar();Nav.ir('terminal')};
Acc.fEquipos=()=>{Fab.cerrar();Nav.ir('equipos')};
Acc.fCatalogo=()=>{Fab.cerrar();Nav.ir('catalogo')};
Acc.fRefrescar=async()=>{Fab.cerrar();await Datos.cargar();Bus.emit('equipos');Toast.mostrar('Equipos actualizados','ok')};
Acc.fAgentes=()=>{
 Fab.cerrar();
 const on=S.dispositivos.filter(d=>d.en_linea).length;
 Modal.abrir({aria:'Estado de agentes',lado:true,ancho:460,titulo:'Estado de agentes',
  html:`<div class="stats" style="grid-template-columns:1fr 1fr">
   <div class="stat cr" style="--c:var(--verde)"><b>${on}</b><small>En línea</small></div>
   <div class="stat cr" style="--c:var(--pel)"><b>${S.dispositivos.length-on}</b><small>Fuera de línea</small></div></div>
   <div class="lista-c" style="max-height:none">${S.dispositivos.map(d=>
    `<div class="item-c" style="cursor:default"><span class="dot ${d.en_linea?'on':'off'}"></span>
     <div style="flex:1;min-width:0"><b>${esc(d.nombre)}</b>
      <small>v${esc(d.version_agente||'—')} · ${d.en_linea?'latido '+relativo(d.visto):'sin latido '+relativo(d.visto)}</small></div>
     ${soB(d.sistema)}</div>`).join('')||'<div class="vacio">Sin equipos</div>'}</div>`});
};
Acc.notif=()=>{
 if(!S.silenciado)Toast.mostrar('Notificaciones silenciadas','forzar','Puedes activarlas de nuevo aquí.');
 S.silenciado=!S.silenciado; guardar('silencio',S.silenciado); pintaNotif();
 if(!S.silenciado)Toast.mostrar('Notificaciones activadas','ok');
};
Acc.salir=()=>{
 Modal.abrir({aria:'Cerrar sesión',ancho:420,titulo:'Cerrar sesión',
  html:`<p style="line-height:1.6">Se cerrará la sesión de <b>${esc(S.perfil?.nombre||S.correo||'')}</b>.
   Las ejecuciones en curso siguen su camino en el equipo.</p>`,
  pie:`<button class="btn" data-acc="mCerrar">Quedarme</button>
   <button class="btn pel" data-acc="salirYa">Cerrar sesión</button>`});
};
Acc.salirYa=()=>{Modal.cerrar();Acceso.salir()};

/* ---------- eventos globales ---------- */
document.addEventListener('click',e=>{
 if(Fab.abierto&&!e.target.closest('#fabPanel')&&!e.target.closest('#fab'))Fab.cerrar();
 const el=e.target.closest('[data-acc]'); if(!el)return;
 const f=Acc[el.dataset.acc]; if(f)f(el,e);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){ if(!$('#m-cuenta').hidden){Cuenta.cerrar()} else if(!$('#modal').hidden){Modal.cerrar()} else {Fab.cerrar()} }
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&Chg[el.dataset.chg])Chg[el.dataset.chg](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-inp]');if(el&&Inp[el.dataset.inp])Inp[el.dataset.inp](el,e)});
document.addEventListener('pointermove',e=>{
 const v=e.target.closest&&e.target.closest('.vid');
 if(v){const r=v.getBoundingClientRect();v.style.setProperty('--mx',(e.clientX-r.left)+'px');v.style.setProperty('--my',(e.clientY-r.top)+'px')}
},{passive:true});
addEventListener('resize',()=>Dock.marcar());

/* ---------- arranque ---------- */
Acceso.iniciar();
})();

})();</script></body></html>
