<style>
:root {
    color-scheme: dark;
    --neg: #04070a;
    --tx: #e6f5ee;
    --tx2: #98afa6;
    --tx3: #62786f;
    --verde: #39ff88;

    --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --rim: rgba(255, 255, 255, .12)
}

* {
    box-sizing: border-box
}

[hidden] {
    display: none !important
}

html,
body {
    height: 100%
}

body {
    background: var(--neg);
    color: var(--tx);
    font: 14px/1.45 var(--f-cuerpo);
    overflow: hidden;
    -webkit-font-smoothing: antialiased
}

button {
    font: inherit;
    color: inherit;
    cursor: pointer
}

:focus-visible {
    outline: 2px solid var(--cian);
    outline-offset: 2px
}

h1,
h2,
h3,
p {
    margin: 0
}

code,
pre,
.mono {
    font-family: var(--f-mono)
}

.mut {
    color: var(--tx2)
}

.mut3 {
    color: var(--tx3)
}

.ico {
    flex: none;
    display: block
}

/* ===== fondo (optimizado para Chrome / Safari / Edge) ===== */
.fondo {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    background: radial-gradient(120% 90% at 50% 0%, #07100f 0%, #04070a 60%);
    contain: strict
}

.fondo i {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    contain: strict;
    pointer-events: none
}

.fondo .a {
    width: 48vmax;
    height: 48vmax;
    right: -14vmax;
    top: -16vmax;
    background: radial-gradient(circle, rgba(25, 255, 138, .65), transparent 66%);
    opacity: .45
}

.fondo .b {
    width: 54vmax;
    height: 54vmax;
    left: -20vmax;
    bottom: -26vmax;
    background: radial-gradient(circle, rgba(31, 107, 255, .7), transparent 66%);
    opacity: .45
}

.fondo .c {
    width: 26vmax;
    height: 26vmax;
    left: 44%;
    top: 34%;
    background: radial-gradient(circle, rgba(18, 217, 255, .5), transparent 66%);
    opacity: .2
}

.fondo::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .03) 1px, transparent 1px);
    background-size: 46px 46px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 25%, #000, transparent 72%);
    mask-image: radial-gradient(ellipse at 50% 25%, #000, transparent 72%)
}

/* Ocultar char-measure de xterm correctamente sin romper medicion de fuentes */
.xterm-char-measure-element {
    position: absolute !important;
    top: 0 !important;
    left: -9999em !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important
}

/* ===== liquid glass optimizado ===== */
.vid {
    position: relative;
    background: linear-gradient(150deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .02) 42%, rgba(255, 255, 255, .05));
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .08);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), inset 0 -1px 0 rgba(255, 255, 255, .05), inset 0 0 34px rgba(90, 255, 190, .045), 0 22px 50px -18px rgba(0, 0, 0, .75)
}

.vid::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    pointer-events: none;
    background: linear-gradient(155deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0) 28%, rgba(255, 255, 255, 0) 62%, rgba(47, 123, 255, .5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude
}

.vid::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    transition: opacity .35s;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .13), transparent 62%)
}

.vid:hover::after {
    opacity: 1
}

.cr {
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .085);
    border-radius: 16px
}

/* ===== controles ===== */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .14);
    background: rgba(255, 255, 255, .07);
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    transition: transform .2s cubic-bezier(.3, 1.5, .5, 1), background .2s, box-shadow .2s, border-color .2s;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22)
}

.btn:hover {
    background: rgba(255, 255, 255, .13);
    border-color: rgba(255, 255, 255, .22)
}

.btn:active {
    transform: scale(.95)
}

.btn.pri {
    background: linear-gradient(135deg, var(--verde), var(--cian));
    color: #021a10;
    border-color: rgba(255, 255, 255, .45);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 0 26px rgba(57, 255, 136, .35)
}

.btn.pri:hover {
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 0 34px rgba(57, 255, 136, .55)
}

.btn.azul {
    background: linear-gradient(135deg, var(--azul), var(--cian));
    color: #02121d;
    border-color: rgba(255, 255, 255, .4);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 24px rgba(47, 123, 255, .4)
}

.btn.pel {
    background: rgba(255, 77, 109, .16);
    border-color: rgba(255, 77, 109, .5);
    color: #ffb3c0
}

.btn.sm {
    padding: 6px 12px;
    font-size: 12px
}

.btn[disabled] {
    opacity: .4;
    pointer-events: none
}

.ib {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(255, 255, 255, .06);
    color: var(--tx2);
    transition: .2s;
    flex: none
}

.ib:hover {
    color: var(--tx);
    background: rgba(255, 255, 255, .14)
}

.ib.pel:hover {
    color: var(--pel)
}

.chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(255, 255, 255, .05);
    font-size: 12px;
    font-weight: 600;
    color: var(--tx2);
    transition: .2s
}

button.chip:hover {
    color: var(--tx);
    background: rgba(255, 255, 255, .12)
}

.chip.on {
    color: #021a10;
    background: linear-gradient(135deg, var(--verde), var(--cian));
    border-color: transparent
}

.chip[disabled] {
    opacity: .35;
    pointer-events: none
}

input[type=text],
input[type=search],
input[type=number],
select,
textarea {
    font: inherit;
    color: var(--tx);
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 12px;
    padding: 11px 14px;
    outline: none;
    width: 100%;
    min-width: 0;
    font-size: 13.5px;
    transition: border-color .2s, box-shadow .2s, background .2s
}

input:focus-visible,
select:focus-visible,
textarea:focus-visible {
    outline: none;
    border-color: var(--cian);
    box-shadow: 0 0 0 3px rgba(34, 229, 255, .18)
}

select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--tx2) 50%), linear-gradient(135deg, var(--tx2) 50%, transparent 50%);
    background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
    background-size: 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px
}

select option {
    background: #0b1218;
    color: var(--tx)
}

textarea {
    font-family: var(--f-mono);
    font-size: 12.5px;
    resize: vertical;
    min-height: 84px
}

input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 1.5px solid rgba(255, 255, 255, .35);
    background: rgba(255, 255, 255, .05);
    display: inline-grid;
    place-content: center;
    cursor: pointer;
    flex: none;
    margin: 0;
    transition: .15s
}

input[type=checkbox]:checked {
    background: linear-gradient(135deg, var(--verde), var(--cian));
    border-color: transparent
}

input[type=checkbox]:checked::after {
    content: "";
    width: 9px;
    height: 5px;
    border-left: 2px solid #02110a;
    border-bottom: 2px solid #02110a;
    transform: rotate(-45deg) translate(1px, -1px)
}

label.campo {
    display: grid;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--tx2);
    letter-spacing: .04em;
    text-transform: uppercase
}

label.campo>*:not(span) {
    text-transform: none;
    letter-spacing: 0;
    font-weight: 500;
    color: var(--tx)
}

.sw {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--tx2);
    cursor: pointer;
    user-select: none
}

.sw input {
    appearance: none;
    -webkit-appearance: none;
    width: 34px;
    height: 20px;
    border-radius: 99px;
    background: rgba(255, 255, 255, .14);
    position: relative;
    cursor: pointer;
    transition: .2s;
    border: 0;
    margin: 0
}

.sw input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: .25s cubic-bezier(.3, 1.5, .5, 1)
}

.sw input:checked {
    background: linear-gradient(135deg, var(--verde), var(--cian))
}

.sw input:checked::after {
    transform: translateX(14px)
}

/* identificadores */
.os {
    font: 700 10px var(--f-mono);
    letter-spacing: .06em;
    padding: 2px 6px;
    border-radius: 6px;
    color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
    background: color-mix(in srgb, var(--c) 12%, transparent)
}

.int {
    font: 600 10.5px var(--f-mono);
    padding: 2px 7px;
    border-radius: 6px;
    color: var(--tx2);
    border: 1px solid rgba(255, 255, 255, .12);
    background: rgba(0, 0, 0, .28)
}

.cico {
    width: 38px;
    height: 38px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    flex: none;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 42%, transparent);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 0 18px color-mix(in srgb, var(--c) 22%, transparent)
}

.pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px 3px 8px;
    border-radius: 99px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--c);
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    background: color-mix(in srgb, var(--c) 12%, transparent);
    white-space: nowrap
}

.pill i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 8px var(--c)
}

.pill.ejecutando i,
.pill.en_ejecucion i {
    animation: lat 1s ease-in-out infinite
}

@keyframes lat {
    50% {
        opacity: .25;
        transform: scale(.7)
    }
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: none;
    background: var(--tx3)
}

.dot.on {
    background: var(--verde);
    box-shadow: 0 0 10px var(--verde)
}

.dot.off {
    background: var(--pel);
    box-shadow: 0 0 8px var(--pel)
}

.flag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 6px
}

.flag.adm {
    color: var(--ambar);
    background: rgba(255, 200, 87, .12);
    border: 1px solid rgba(255, 200, 87, .35)
}

.flag.des {
    color: var(--pel);
    background: rgba(255, 77, 109, .12);
    border: 1px solid rgba(255, 77, 109, .4)
}

.flag.seg {
    color: var(--tx2);
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .1);
    font-family: var(--f-mono)
}

.etq {
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 99px;
    color: var(--cian);
    background: rgba(34, 229, 255, .08);
    border: 1px solid rgba(34, 229, 255, .25)
}

/* ===== monitoreo ===== */
.kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 12px
}

.kpi {
    padding: 12px 14px;
    display: flex;
    gap: 12px;
    align-items: center
}

.kpi b {
    font: 600 20px var(--f-mono);
    display: block;
    font-variant-numeric: tabular-nums;
    line-height: 1.1
}

.kpi small {
    font-size: 11.5px;
    color: var(--tx2)
}

.grid-mon {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
    gap: 12px;
    margin-bottom: 12px
}

.mapa {
    position: relative;
    height: 340px;
    border-radius: 18px;
    background: rgba(0, 0, 0, .28);
    border: 1px solid rgba(255, 255, 255, .08);
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none
}

.mapa .zona {
    position: absolute;
    border-radius: 22px;
    border: 1px dashed rgba(255, 255, 255, .16);
    background: linear-gradient(160deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .01))
}

.mapa .zona span {
    position: absolute;
    left: 12px;
    top: 8px;
    font: 600 10.5px var(--f-mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--tx3)
}

.mapa svg.lineas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none
}

.hub {
    position: absolute;
    width: 10px;
    height: 10px;
    margin: -5px;
    border-radius: 50%;
    border: 1.5px solid rgba(34, 229, 255, .6);
    background: rgba(34, 229, 255, .15)
}

.nodo {
    position: absolute;
    transform: translate(-50%, -50%);
    display: grid;
    justify-items: center;
    gap: 4px;
    background: none;
    border: 0;
    padding: 6px;
    border-radius: 14px;
    color: var(--tx2)
}

.nodo .pt {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8, var(--c) 45%);
    --c: var(--verde);
    box-shadow: 0 0 14px var(--c), 0 0 0 4px color-mix(in srgb, var(--c) 18%, transparent);
    transition: .25s cubic-bezier(.3, 1.5, .5, 1)
}

.nodo.off .pt {
    --c: var(--pel);
    filter: saturate(.8)
}

.nodo small {
    font: 600 9.5px var(--f-mono);
    letter-spacing: .02em;
    white-space: nowrap
}

.nodo:hover .pt {
    transform: scale(1.2)

}

.t-izq-btn {
    display: none
}

.hs {
    display: none
}

/* ===== masiva ===== */
.mcab {
    display: grid;
    gap: 12px;
    margin-bottom: 12px
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px
}

.stat {
    padding: 10px 12px;
    border-radius: 16px
}

.stat b {
    font: 600 22px var(--f-mono);
    display: block;
    font-variant-numeric: tabular-nums;
    color: var(--c)
}

.stat small {
    font-size: 11.5px;
    color: var(--tx2)
}

.mosaico {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px
}

.tile {
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 230px
}

.tile>header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(0, 0, 0, .3)
}

.tile>header b {
    font: 700 12.5px var(--f-mono);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap
}

.tile .tb {
    flex: 1;
    overflow: auto;
    background: rgba(0, 0, 0, .5);
    padding: 8px 10px;
    font: 11px/1.5 var(--f-mono);
    scrollbar-width: thin
}

.tile>footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: rgba(0, 0, 0, .36);
    font: 11px var(--f-mono);
    color: var(--tx2)
}

.tile>footer .grow {
    flex: 1
}

/* ===== modal / hoja ===== */
#modal {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: grid;
    place-items: center;
    padding: 16px
}

#modal .velo {
    position: absolute;
    inset: 0;
    background: rgba(2, 6, 8, .55);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    animation: vel .3s
}

@keyframes vel {
    from {
        opacity: 0
    }
}

.caja,
.hoja {
    position: relative;
    width: min(var(--w, 640px), 100%);
    max-height: calc(100% - 8px);
    display: flex;
    flex-direction: column;
    border-radius: 30px;
    animation: pop .4s cubic-bezier(.3, 1.35, .5, 1);
    transform-origin: center;
    background: linear-gradient(150deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .06) 45%, rgba(255, 255, 255, .1))
}

.hoja {
    margin-left: auto;
    height: calc(100% - 8px);
    border-radius: 30px;
    transform-origin: right center
}

.caja>header,
.hoja>header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px 10px
}

.caja>header h2,
.hoja>header h2 {
    font: 600 15px var(--f-disp);
    flex: 1
}

.cuerpo {
    padding: 6px 18px 12px;
    overflow: auto;
    display: grid;
    gap: 14px;
    align-content: start;
    scrollbar-width: thin
}

.caja>footer,
.hoja>footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    padding: 12px 18px 16px;
    flex-wrap: wrap;
    align-items: center
}

.f2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px
}

.chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap
}

.val {
    display: grid;
    gap: 5px;
    font-size: 12.5px
}

.val div {
    display: flex;
    gap: 8px;
    align-items: flex-start
}

.val .ok {
    color: var(--verde)
}

.val .av {
    color: var(--ambar)
}

.val .no {
    color: var(--pel)
}

.prev {
    font: 12.5px/1.6 var(--f-mono);
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(0, 0, 0, .5);
    border: 1px solid rgba(255, 255, 255, .07);
    word-break: break-all
}

.prev .ps {
    color: var(--cian);
    user-select: none
}

.desb {
    border: 1px solid rgba(255, 77, 109, .5);
    background: rgba(255, 77, 109, .1);
    border-radius: 16px;
    padding: 12px;
    display: grid;
    gap: 8px;
    font-size: 12.5px
}

.esq {
    display: grid;
    gap: 6px
}

.esq .r {
    display: grid;
    grid-template-columns: 1fr 110px 1fr 34px;
    gap: 6px
}

.sec-t {
    font: 600 10.5px var(--f-mono);
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--tx3)
}

/* ===== toasts ===== */
#toasts {
    position: fixed;
    z-index: 90;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 14px;
    display: grid;
    gap: 8px;
    width: min(340px, calc(100vw - 28px));
    pointer-events: none
}

.toast {
    pointer-events: auto;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 11px 14px;
    border-radius: 20px;
    animation: tin .45s cubic-bezier(.3, 1.4, .5, 1);
    font-size: 13px
}

.toast b {
    display: block
}

.toast small {
    color: var(--tx2)
}

.toast .cico {
    width: 28px;
    height: 28px;
    border-radius: 10px
}

@keyframes tin {
    from {
        opacity: 0;
        transform: translateX(40px) scale(.9)
    }
}


/* capas flotantes con más cuerpo para legibilidad */
#fabPanel,
#mini,
.caja,
.hoja,
.toast,
#dock {
    background-color: rgba(6, 12, 16, .62)
}

#mini {
    max-height: calc(100% - 170px);
    overflow: auto;
    scrollbar-width: thin
}

.tab .x {
    background: none;
    border: 0;
    padding: 0
}

#toasts {
    top: calc(74px + env(safe-area-inset-top, 0px))
}

/* ===== responsive ===== */
@media (max-width:1180px) {
    .term-g {
        grid-template-columns: 230px minmax(0, 1fr)
    }

    .t-der {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        height: min(60vh, 460px);
        transform: translateY(calc(100% + 16px));
        transition: transform .45s cubic-bezier(.3, 1.2, .5, 1)
    }

    .t-der.abierto {
        transform: none
    }

    .hs {
        display: inline-flex
    }
}

@media (max-width:900px) {
    .grid-mon {
        grid-template-columns: 1fr
    }

    .term-g {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr)
    }

    .t-izq {
        display: none
    }

    .t-izq.abierto {
        display: flex;
        position: fixed;
        inset: 80px 12px calc(96px + env(safe-area-inset-bottom, 0px)) 12px;
        z-index: 31
    }

    .t-izq-btn {
        display: inline-flex
    }

    .stats {
        grid-template-columns: repeat(2, 1fr)
    }
}

@media (max-width:720px) {
    .top {
        padding-left: 16px
    }

    .top .ws {
        display: none
    }

    .f2 {
        grid-template-columns: 1fr
    }

    #mini {
        left: 12px !important;
        right: 12px;
        top: auto !important;
        bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        width: auto;
        max-height: 64vh;
        overflow: auto
    }

    #mini .mh {
        cursor: default
    }

    .acc {
        min-height: 58px
    }

    .ib {
        width: 38px;
        height: 38px
    }

    #dock .btn-d {
        width: 58px
    }

    #lente {
        width: 58px
    }

    .mapa {
        height: 300px
    }

    .esq .r {
        grid-template-columns: 1fr 1fr
    }

    .caja,
    .hoja {
        border-radius: 26px
    }
}

/* =====================================================================
   TEMA CLARO  · variables + overrides completos
   Activado con  <html data-tema="claro">
   ===================================================================== */
:root[data-tema="claro"] {
    color-scheme: light;
    /* superficie y texto */
    --neg: #f5f3ff;
    --tx:  #1a0a3d;
    --tx2: #5b4878;
    --tx3: #9480b0;
    /* acento: morado sólido y profundo — legible sobre fondo blanco */
    --verde:  #6c27d4;
    --azul:   #9b3cf7;
    --cian:   #7c3aed;
    --lima:   #4f46e5;
    --indigo: #5b4fd4;
    --pel:    #c0215a;
    --ambar:  #9a6300;
    /* borde sutil */
    --rim: rgba(108, 39, 212, .14)
}

/* ── fondo del body ── */
:root[data-tema="claro"] body {
    background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%)
}

/* ── orbes de fondo (más pálidos, tonos pastel) ── */
:root[data-tema="claro"] .fondo {
    background: radial-gradient(120% 90% at 50% 0%, #ede9fe 0%, #f5f3ff 60%)
}
:root[data-tema="claro"] .fondo .a {
    background: radial-gradient(circle, rgba(108,39,212,.35), transparent 66%);
    opacity: .30
}
:root[data-tema="claro"] .fondo .b {
    background: radial-gradient(circle, rgba(79,70,229,.4), transparent 66%);
    opacity: .22
}
:root[data-tema="claro"] .fondo .c {
    background: radial-gradient(circle, rgba(155,60,247,.35), transparent 66%);
    opacity: .12
}
:root[data-tema="claro"] .fondo::after {
    background-image:
        linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px)
}

/* ── liquid glass claro ── */
:root[data-tema="claro"] .vid {
    background: linear-gradient(150deg,
        rgba(255,255,255,.88),
        rgba(248,245,255,.72) 42%,
        rgba(243,238,255,.80));
    border-color: rgba(108,39,212,.15);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -1px 0 rgba(108,39,212,.06),
        inset 0 0 34px rgba(108,39,212,.04),
        0 8px 32px -8px rgba(80,30,160,.18)
}
:root[data-tema="claro"] .vid::before {
    background: linear-gradient(155deg,
        rgba(255,255,255,.95),
        rgba(255,255,255,0) 28%,
        rgba(255,255,255,0) 62%,
        rgba(26,102,255,.35))
}
:root[data-tema="claro"] .vid::after {
    background: radial-gradient(260px circle at var(--mx,50%) var(--my,0%),
        rgba(255,255,255,.45), transparent 62%)
}

/* tarjeta base claro */
:root[data-tema="claro"] .cr {
    background: rgba(255,255,255,.60);
    border-color: rgba(0,0,0,.08)
}

/* ── controles claro ── */
:root[data-tema="claro"] .btn {
    border-color: rgba(0,0,0,.14);
    background: rgba(255,255,255,.65);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(0,0,0,.08)
}
:root[data-tema="claro"] .btn:hover {
    background: rgba(255,255,255,.85);
    border-color: rgba(0,0,0,.2)
}

    background: rgba(217,48,96,.10);

/* ===== ALERTAS: animación banda → campana ===== */
#alerta-banda-wrap {
    overflow: hidden;
    transform-origin: top right;
    transition: none;
}
#alerta-banda-wrap.visible {
    display: block !important;
    animation: banda-entrada .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes banda-entrada {
    from { opacity:0; transform: translateY(-12px) scaleY(.85); }
    to   { opacity:1; transform: translateY(0) scaleY(1); }
}
#alerta-banda-wrap.colapsando {
    animation: banda-succion .55s cubic-bezier(.4,0,1,1) forwards !important;
}
@keyframes banda-succion {
    0%   { opacity:1; transform: translate(0,0) scale(1); filter: blur(0); }
    40%  { opacity:.9; transform: translate(calc(var(--dest-x,0)*.4), calc(var(--dest-y,0)*.3)) scale(.6,.4); }
    80%  { opacity:.4; transform: translate(calc(var(--dest-x,0)*.9), calc(var(--dest-y,0)*.85)) scale(.15,.08); filter: blur(2px); }
    100% { opacity:0; transform: translate(var(--dest-x,0), var(--dest-y,0)) scale(0); filter: blur(4px); }
}

/* Badge en la campana */
#btnNotif {
    position: relative;
    transition: color .3s;
}
#btnNotif[data-badge]:not([data-badge=""]):not([data-badge="0"])::after {
    content: attr(data-badge);
    position: absolute;
    top: -5px; right: -5px;
    min-width: 17px; height: 17px;
    padding: 0 4px;
    background: var(--pel);
    color: #fff;
    font: 700 10px var(--f-cuerpo);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    pointer-events: none;
    box-shadow: 0 0 8px rgba(255,77,109,.5);
    animation: badge-pop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes badge-pop {
    from { transform: scale(0); }
    to   { transform: scale(1); }
}
#btnNotif.tiene-alertas {
    color: var(--ambar);
}
/* Vibración de la campana cuando llegan las alertas */
#btnNotif.campana-absorbe {
    animation: campana-absorbe .7s cubic-bezier(.36,.07,.19,.97) !important;
}
@keyframes campana-absorbe {
    0%  { transform: scale(1) rotate(0); }
    15% { transform: scale(1.4) rotate(-25deg); }
    30% { transform: scale(1.2) rotate(20deg); }
    45% { transform: scale(1.35) rotate(-15deg); }
    60% { transform: scale(1.15) rotate(10deg); }
    75% { transform: scale(1.25) rotate(-5deg); }
    90% { transform: scale(1.1) rotate(2deg); }
    100%{ transform: scale(1) rotate(0); }
}

/* Panel de alertas flotante */
.alerta-popup {
    border-radius: 16px;
    padding: 0;
    overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,.6), 0 0 0 1px var(--rim);
    animation: popup-in .2s cubic-bezier(.34,1.56,.64,1);
    min-width: 300px; max-width: 350px;
}
@keyframes popup-in {
    from{opacity:0;transform:translateY(-10px) scale(.93)}
    to{opacity:1;transform:translateY(0) scale(1)}
}
.ap-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255,255,255,.04);
    border-bottom: 1px solid var(--rim);
    font-size: 13px; font-weight: 600;
}
.ap-titulo { display:flex; align-items:center; gap:6px; }
.ap-count {
    background: var(--pel); color: #fff;
    font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 9px; min-width: 18px; text-align: center;
    box-shadow: 0 0 8px rgba(255,77,109,.4);
}
.ap-sil { padding: 5px 14px; color: var(--tx3); font-size: 11.5px; display:flex;align-items:center;gap:6px; }

/* Lista scrollable */
.ap-lista { max-height: 55vh; overflow-y: auto; }
.ap-lista::-webkit-scrollbar { width: 4px; }
.ap-lista::-webkit-scrollbar-thumb { background: var(--rim); border-radius: 4px; }

/* Items de alerta */
.ap-item {
    padding: 9px 14px;
    border-bottom: 1px solid var(--rim);
    transition: background .15s;
}
.ap-item:last-child { border-bottom: none; }
.ap-item:hover { background: rgba(255,255,255,.04); }
.ap-item-top { display:flex; align-items:flex-start; gap:9px; }
.ap-ico-equipo { flex:none; margin-top:1px; }
.ap-txt { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
.ap-nombre { font-size: 13px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ap-msg { color: var(--tx2); font-size: 11.5px; }

/* Botones de acción por alerta */
.ap-acciones { display:flex; gap:6px; margin-top:7px; padding-left:24px; }
.ap-btn {
    display:inline-flex; align-items:center; gap:4px;
    font-size: 11.5px; font-weight: 500;
    padding: 3px 9px; border-radius: 7px;
    border: 1px solid var(--rim); cursor: pointer;
    background: rgba(255,255,255,.04); color: var(--tx2);
    transition: all .15s;
}
.ap-btn:hover { background: rgba(255,255,255,.08); color: var(--tx); }
.ap-btn-menu:hover { border-color: var(--cian); color: var(--cian); }
.ap-btn-det:hover { border-color: var(--azul); color: var(--azul); }

/* Bloque detalle expandible */
.ap-detalle-bloque {
    font-size: 11px; color: var(--tx2);
    background: rgba(255,255,255,.03);
    border: 1px solid var(--rim); border-radius: 7px;
    padding: 5px 8px; margin-top: 6px; margin-left: 24px;
    line-height: 1.6; animation: popup-in .15s ease;
}

.ap-vacio { padding: 18px 14px; color: var(--tx3); font-size: 13px; text-align: center; }
.ap-pie {
    padding: 7px 10px;
    background: rgba(255,255,255,.02);

/* ========== Tema claro — gris marcado, bordes visibles, texto denso ========== */
:root[data-tema="claro"]{color-scheme:light;
  /* fondos en tonos grises, no blanco puro */
  --neg:#e8ecee; --tx:#0a1420; --tx2:#3d4d5c; --tx3:#6b7a8a;
  --rim:#b4c0cc;
  /* acentos más oscuros para contraste */
  --verde:#15803d; --azul:#1e40af; --cian:#0e7490; --lima:#4d7c0f;
  --indigo:#4338ca; --pel:#b91c1c; --ambar:#c2410c;
}
:root[data-tema="claro"] body{background:#e8ecee;color:var(--tx);font-weight:500}
:root[data-tema="claro"] .fondo{background:#e8ecee}
:root[data-tema="claro"] .fondo .a,:root[data-tema="claro"] .fondo .b,:root[data-tema="claro"] .fondo .c{display:none}
:root[data-tema="claro"] .fondo::after{background-image:linear-gradient(rgba(10,20,32,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(10,20,32,.06) 1px,transparent 1px)}
:root[data-tema="claro"] .vid{background:#f1f4f6;border:1.5px solid #b4c0cc;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 1px 2px rgba(10,20,32,.06),0 4px 12px rgba(10,20,32,.08)}
:root[data-tema="claro"] .panel{background:#f1f4f6}

/* Textos con más cuerpo */
:root[data-tema="claro"] h1,:root[data-tema="claro"] h2,:root[data-tema="claro"] h3{color:var(--tx);font-weight:700}
:root[data-tema="claro"] .mut{color:var(--tx)}
:root[data-tema="claro"] .mut2,:root[data-tema="claro"] .ts{color:var(--tx2);font-weight:600}
:root[data-tema="claro"] .mut3{color:var(--tx3);font-weight:600}
:root[data-tema="claro"] p,:root[data-tema="claro"] span,:root[data-tema="claro"] div,:root[data-tema="claro"] label{font-weight:500}
:root[data-tema="claro"] b,:root[data-tema="claro"] strong{font-weight:700}

/* Inputs */
:root[data-tema="claro"] input[type=email],
:root[data-tema="claro"] input[type=password],
:root[data-tema="claro"] input[type=text],
:root[data-tema="claro"] input[type=search],
:root[data-tema="claro"] input[type=number],
:root[data-tema="claro"] select,
:root[data-tema="claro"] textarea{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:500;box-shadow:inset 0 1px 2px rgba(10,20,32,.06)}
:root[data-tema="claro"] input::placeholder,:root[data-tema="claro"] textarea::placeholder{color:#7d8c96;opacity:1;font-weight:500}
:root[data-tema="claro"] input:focus-visible,
:root[data-tema="claro"] select:focus-visible,
:root[data-tema="claro"] textarea:focus-visible{border-color:var(--azul);background:#fff;box-shadow:0 0 0 3px rgba(30,64,175,.15)}

/* Botones */
:root[data-tema="claro"] .btn{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(10,20,32,.06)}
:root[data-tema="claro"] .btn:hover{background:#f1f4f6;border-color:var(--azul);transform:none}
:root[data-tema="claro"] .btn.pri{background:linear-gradient(180deg,#1e40af,#1e3a8a);color:#fff;border-color:#1e3a8a;box-shadow:0 1px 2px rgba(30,64,175,.35),0 2px 5px rgba(30,64,175,.2);font-weight:700}
:root[data-tema="claro"] .btn.pri:hover{background:linear-gradient(180deg,#2451c7,#1e40af);box-shadow:0 2px 4px rgba(30,64,175,.45),0 3px 8px rgba(30,64,175,.3)}
:root[data-tema="claro"] .btn.pel{background:#fee2e2;color:#991b1b;border-color:#dc2626;font-weight:700}
:root[data-tema="claro"] .btn.pel:hover{background:#fecaca;border-color:#991b1b}

/* Header */
:root[data-tema="claro"] .top{background:#f1f4f6;border-bottom:1.5px solid #b4c0cc}

/* Dock, FAB, avatar */
:root[data-tema="claro"] #dock{background:#f1f4f6;border:1.5px solid #b4c0cc;box-shadow:0 8px 24px rgba(10,20,32,.1)}
:root[data-tema="claro"] #dock .btn-d{color:var(--tx2);font-weight:600}

/* ========== Modal: base (Mi cuenta) ========== */
.modal{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;animation:mfade .2s ease}
.modal[hidden]{display:none}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-caja{position:relative;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:24px;padding:0;background:linear-gradient(150deg,rgba(255,255,255,.12),rgba(255,255,255,.035) 42%,rgba(255,255,255,.075));-webkit-backdrop-filter:blur(26px) saturate(185%) brightness(1.06);backdrop-filter:blur(26px) saturate(185%) brightness(1.06);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08) inset,0 1px 0 rgba(255,255,255,.14) inset}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;z-index:1;background:rgba(14,22,20,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.modal-tit{display:flex;align-items:center;gap:12px}
.modal-tit .cico{width:38px;height:38px;border-radius:12px;flex:none}
.modal-tit b{display:block;font:700 15px var(--f-disp);letter-spacing:.005em;color:var(--tx)}
.modal-tit small{color:var(--tx3);font:600 10.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:2px}
.modal-head .ib{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer;color:var(--tx);flex:none}
.modal-head .ib:hover{background:rgba(255,255,255,.12)}
.modal-cuerpo{padding:20px 24px 24px;display:grid;gap:22px}
.mc-sec{display:grid;gap:10px}
.mc-h{font:700 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin:0 0 2px}
.mc-info{display:grid;gap:1px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden}
.mc-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:rgba(0,0,0,.2);gap:12px}
.mc-k{color:var(--tx3);font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.mc-v{color:var(--tx);font:500 13.5px var(--f-cuerpo);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-tema{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc-opt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);border-radius:14px;cursor:pointer;color:var(--tx);font-weight:600;font-size:13px;transition:all .18s}
.mc-opt:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.mc-opt.act{background:rgba(34,229,255,.1);border-color:var(--cian);box-shadow:0 0 0 3px rgba(34,229,255,.15)}
.mc-opt-ic{color:var(--tx2);display:block}
.mc-opt.act .mc-opt-ic{color:var(--cian)}
.mc-form{display:grid;gap:12px}
.mc-form .ok{color:var(--verde);font-size:13px;min-height:19px;line-height:1.4;font-weight:500}
.mc-form .err{color:var(--pel);font-size:13px;min-height:19px;line-height:1.4;font-weight:500}
@keyframes mfade{from{opacity:0}to{opacity:1}}

/* ========== Modal Mi cuenta · modo claro ========== */
:root[data-tema="claro"] .modal-bg{background:rgba(15,31,26,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
:root[data-tema="claro"] .modal-caja{background:#ffffff;border:1px solid #e5eaeb;box-shadow:0 20px 60px rgba(15,31,26,.15),0 4px 12px rgba(15,31,26,.08)}
:root[data-tema="claro"] .modal-head{background:#ffffff;border-bottom:1px solid #eef2f3}
:root[data-tema="claro"] .modal-tit b{color:var(--tx)}
:root[data-tema="claro"] .modal-tit small{color:var(--tx3)}
:root[data-tema="claro"] .modal-head .ib{background:#f6f8f9;border:1px solid #d1d9dc;color:var(--tx)}
:root[data-tema="claro"] .modal-head .ib:hover{background:#eef2f3}
:root[data-tema="claro"] .mc-h{color:var(--tx3)}
:root[data-tema="claro"] .mc-info{background:#f6f8f9;border:1px solid #e5eaeb}
:root[data-tema="claro"] .mc-row{background:#ffffff;border-bottom:1px solid #eef2f3}
:root[data-tema="claro"] .mc-row:last-child{border-bottom:0}
:root[data-tema="claro"] .mc-k{color:var(--tx3)}
:root[data-tema="claro"] .mc-v{color:var(--tx)}
:root[data-tema="claro"] .mc-opt{background:#f6f8f9;border:1.5px solid #e5eaeb;color:var(--tx)}
:root[data-tema="claro"] .mc-opt:hover{background:#eef2f3;border-color:#a8b5b0}
:root[data-tema="claro"] .mc-opt.act{background:#eff6ff;border-color:var(--cian);box-shadow:0 0 0 3px rgba(8,145,178,.12)}
:root[data-tema="claro"] .mc-opt-ic{color:var(--tx3)}
:root[data-tema="claro"] .mc-opt.act .mc-opt-ic{color:var(--cian)}

/* Modal estándar (Modal.abrir) en claro */
:root[data-tema="claro"] #modal .fondo-md{background:rgba(15,31,26,.35)}
:root[data-tema="claro"] #modal .caja-md{background:#ffffff;border:1px solid #e5eaeb;box-shadow:0 20px 60px rgba(15,31,26,.15)}

/* Pills y status */
:root[data-tema="claro"] .pill{background:rgba(0,0,0,.04);color:var(--tx2);border:1px solid rgba(0,0,0,.08)}

/* Terminal sigue oscura dentro de la vista aunque el tema sea claro (xterm es terminal) */
:root[data-tema="claro"] #xt-host,:root[data-tema="claro"] .xterm{background:#0f1f1a !important}

/* ========== Toolbar del catálogo con chips de filtro ========== */
.cata-toolbar{display:grid;gap:12px;margin-bottom:18px;grid-template-columns:1fr auto;align-items:start}
.cata-buscar{position:relative;grid-column:1/-1}
.cata-buscar input{width:100%;padding:12px 40px 12px 42px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:14px;color:var(--tx);font:500 14px var(--f-cuerpo);outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.cata-buscar input:focus-visible{border-color:var(--cian);background:rgba(34,229,255,.04);box-shadow:0 0 0 3px rgba(34,229,255,.15)}
.cata-buscar-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.cata-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:26px;height:26px;display:grid;place-items:center;border-radius:7px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:var(--tx2);cursor:pointer}
.cata-clear:hover{background:rgba(255,255,255,.16);color:var(--tx)}

.cata-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip-wrap{position:relative}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);color:var(--tx);font:600 12.5px var(--f-cuerpo);cursor:pointer;transition:all .18s;white-space:nowrap}
.chip:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.chip-on{background:rgba(34,229,255,.12);border-color:var(--cian);color:var(--cian)}
.chip-wrap.open .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
.chip-wrap.open .chip svg:last-child{transform:rotate(180deg)}
.chip svg:last-child{transition:transform .2s}
.chip-reset{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.35);color:#ffb3c0;font-weight:700}
.chip-reset:hover{background:rgba(255,77,109,.18);border-color:#ff4d6d;color:#fff}

.chip-pop{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;max-height:340px;overflow-y:auto;background:rgba(14,22,20,.98);border:1.5px solid rgba(255,255,255,.12);border-radius:14px;padding:6px;z-index:50;backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:0 12px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.3);animation:chipPopIn .18s ease}
.chip-pop[hidden]{display:none}
.chip-opt{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:none;border:0;color:var(--tx);font:500 13px var(--f-cuerpo);text-align:left;cursor:pointer;border-radius:9px;transition:background .12s}
.chip-opt:hover{background:rgba(255,255,255,.08)}
.chip-opt.act{background:rgba(34,229,255,.12);color:var(--cian);font-weight:700}
.chip-opt.act::after{content:"✓";margin-left:auto;font-weight:700}
.chip-dot{width:10px;height:10px;border-radius:50%;flex:none}
@keyframes chipPopIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.cata-new-btn{align-self:start;padding:11px 18px;font-size:13.5px;border-radius:14px}
@media (max-width:720px){
 .cata-toolbar{grid-template-columns:1fr}
 .cata-new-btn{width:100%}
 .chip-pop{position:fixed;left:16px;right:16px;min-width:auto}
}

/* Modo claro para chips y buscador */
:root[data-tema="claro"] .cata-buscar input{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:500}

:root[data-tema="claro"] .chip{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);font-weight:600}

:root[data-tema="claro"] .chip-pop{background:#fafbfc;border:1.5px solid #8a99a8;color:var(--tx);box-shadow:0 12px 40px rgba(10,20,32,.18),0 2px 8px rgba(10,20,32,.1)}
:root[data-tema="claro"] .chip-opt{color:var(--tx);font-weight:500}
:root[data-tema="claro"] .chip-opt:hover{background:#eef2f7}
:root[data-tema="claro"] .chip-opt.act{background:rgba(30,64,175,.12);color:var(--azul);font-weight:700}
:root[data-tema="claro"] .chip-reset{background:#fee2e2;border-color:#dc2626;color:#991b1b}
:root[data-tema="claro"] .chip-reset:hover{background:#fecaca}

/* ====== Estilos de módulos (fase A) ====== */
/* =====================================================================
   Mini menú contextual por equipo
   ===================================================================== */
.mm-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.25);backdrop-filter:blur(2px);animation:mmFade .18s}
.mm-panel{position:fixed;z-index:601;width:min(380px, calc(100vw - 32px));max-height:min(600px, calc(100vh - 32px));
 overflow:hidden;display:flex;flex-direction:column;border-radius:20px;padding:0;
 background:linear-gradient(155deg,rgba(18,18,26,.96),rgba(8,8,13,.96));
 border:1px solid rgba(255,255,255,.1);

 color:var(--tx3);font:700 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}

.mm-sec-titulo small{font:500 10.5px var(--f-mono);text-transform:none;letter-spacing:0;color:var(--tx3)}

.mm-cmds{display:flex;flex-direction:column;gap:3px;padding:2px 10px;overflow:auto;flex:1;min-height:0;max-height:300px}

 border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;font:inherit;transition:.14s}
.mm-cmd:hover:not(:disabled){background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08);transform:translateX(2px)}

 background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);
 font:600 11.5px var(--f-cuerpo);color:var(--tx2);user-select:none;transition:.14s}

.ta-chip:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
.ta-chip.act{background:color-mix(in srgb, var(--c) 15%, transparent);border-color:color-mix(in srgb, var(--c) 45%, transparent);color:var(--c)}
.ta-chip-i{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:5px;background:color-mix(in srgb, var(--c) 18%, transparent);color:var(--c)}
.ta-chip.act .ta-chip-i{background:var(--c);color:#0a1420}

/* Alertas en el catálogo */
.cata-alertas{display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.cata-alertas .flag{font:700 9.5px var(--f-mono);padding:2px 6px 2px 4px}

/* ----- Tema claro para mini menú ----- */
:root[data-tema="claro"] .mm-overlay{background:rgba(10,20,32,.3)}
:root[data-tema="claro"] .mm-panel{background:linear-gradient(155deg,#fafbfc,#f1f4f6);border:1.5px solid #b4c0cc;box-shadow:0 20px 50px rgba(10,20,32,.2),0 1px 3px rgba(10,20,32,.08)}
:root[data-tema="claro"] .mm-head{border-bottom:1.5px solid #d1dae2}
:root[data-tema="claro"] .mm-nn b{color:var(--tx)}
:root[data-tema="claro"] .mm-nn small{color:var(--tx2);font-weight:600}
:root[data-tema="claro"] .mm-sec-titulo{color:var(--tx2);font-weight:700}
:root[data-tema="claro"] .mm-alertas{background:rgba(194,65,12,.08);border-bottom:1.5px solid #d1dae2}
:root[data-tema="claro"] .mm-cmd:hover:not(:disabled){background:#f1f4f6;border-color:#d1dae2}
:root[data-tema="claro"] .mm-cmd b{color:var(--tx)}
:root[data-tema="claro"] .mm-cmd small{color:var(--tx2);font-weight:500}
:root[data-tema="claro"] .mm-acciones{border-top:1.5px solid #d1dae2}
:root[data-tema="claro"] .ta-chip{background:#fafbfc;border-color:#8a99a8;color:var(--tx)}
:root[data-tema="claro"] .ta-chip:hover{background:#f1f4f6;border-color:#64748b}
:root[data-tema="claro"] .eq-alerta-chip{background:rgba(194,65,12,.15);border:1.5px solid #c2410c;color:#c2410c;font-weight:700}

/* =====================================================================
   MONITOREO · KPIs, Alertas, Tarjetas de equipos
   ===================================================================== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.kpi-v{font:700 26px var(--f-mono);font-variant-numeric:tabular-nums;line-height:1;color:var(--tx)}
.kpi-l{font:12px var(--f-cuerpo);color:var(--tx2);margin-top:4px}
.kpi.ok .kpi-v{color:var(--verde)}.kpi.pel .kpi-v{color:var(--pel)}.kpi.warn .kpi-v{color:var(--ambar)}

/* Alertas banda */
.alerta-banda{position:relative;display:block;width:100%;box-sizing:border-box;pointer-events:auto;
 border-radius:16px;background:rgba(255,77,109,.06);border:1px solid rgba(255,77,109,.2);
 padding:12px 16px;margin-bottom:14px}
.banda-h{display:flex;align-items:center;gap:8px;font:600 13px var(--f-cuerpo);color:var(--pel);margin-bottom:8px}
.alerta-lista{display:grid;gap:6px}
.alerta-fila{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:rgba(255,77,109,.04);cursor:pointer;transition:.15s}
.alerta-fila:hover{background:rgba(255,77,109,.1)}
.al-ico{flex-shrink:0}.al-txt{font:12.5px var(--f-cuerpo);color:var(--tx2)}
.al-txt b{color:var(--tx);font-weight:600}

/* Filtros toolbar */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;width:100%}
.tools .bq{position:relative;flex:1 1 200px;min-width:180px}
.tools .bq input{width:100%;padding-left:36px!important;box-sizing:border-box}
.tools .bq-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.tools select.sel-filt, select.sel-filt{flex:0 0 auto;width:auto!important;min-width:130px;background:rgba(255,255,255,.05);color:var(--tx);border:1px solid rgba(255,255,255,.085);
 border-radius:10px;padding:8px 30px 8px 12px;font:13px var(--f-cuerpo);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer}
.tools-der{display:flex;gap:6px;align-items:center;margin-left:auto;flex-shrink:0}
.btn-ico{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
 color:var(--tx2);padding:7px 12px;border-radius:10px;font:600 12px var(--f-cuerpo);cursor:pointer;transition:.15s}
.btn-ico:hover{background:rgba(255,255,255,.1);color:var(--tx)}
.sel-count{font:600 12px var(--f-mono);color:var(--cian)}

/* Tarjetas de equipos */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.eq-card{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;
 background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
 cursor:pointer;transition:all .25s cubic-bezier(.3,1.2,.5,1)}
.eq-card:hover{background:rgba(255,255,255,.06);transform:translateY(-2px);
 box-shadow:0 8px 32px rgba(0,0,0,.3)}
.eq-card.sel{border-color:rgba(47,123,255,.5);background:rgba(47,123,255,.06);
 box-shadow:0 0 0 1px rgba(47,123,255,.3),0 4px 20px rgba(47,123,255,.12)}
.eq-card.off{opacity:.65}
.eq-card.off:hover{opacity:.85}
.eq-top{display:flex;align-items:center;gap:10px}
.eq-estado{flex-shrink:0}
.eq-info{flex:1;min-width:0}
.eq-nombre{font:700 14px/1.2 var(--f-cuerpo);color:var(--tx);cursor:text;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq-meta{font:12px var(--f-cuerpo);color:var(--tx2);display:flex;gap:6px;align-items:center;margin-top:2px}
.eq-ip{font-family:var(--f-mono);font-size:11px}
.eq-check{flex-shrink:0}
.eq-check input{width:16px;height:16px;accent-color:var(--azul)}
.eq-alerta{display:flex;gap:5px;flex-wrap:wrap}
.eq-al-tag{display:inline-flex;align-items:center;gap:3px;font:600 10px var(--f-mono);
 padding:2px 7px;border-radius:6px;background:rgba(255,77,109,.1);color:var(--pel);
 border:1px solid rgba(255,77,109,.2);text-transform:uppercase;letter-spacing:.04em}

/* Barras de métricas */
.eq-metricas{display:grid;gap:6px}
.met{display:grid;grid-template-columns:42px 1fr 36px;gap:6px;align-items:center}
.met-l{font:600 10px var(--f-mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.met-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.met-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.25,.46,.45,.94)}
.met-fill.warn{background:var(--ambar)!important}
.met-fill.crit{background:var(--pel)!important;animation:pulse-bar 1.5s ease-in-out infinite}
@keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.6}}
.met-v{font:600 11px var(--f-mono);color:var(--tx);text-align:right;font-variant-numeric:tabular-nums}

/* Pie de tarjeta */
.eq-pie{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px}
.eq-lat{display:inline-flex;align-items:center;gap:4px;font:11px var(--f-mono);color:var(--tx3)}
.eq-ints{display:flex;gap:4px}

.vacio{text-align:center;padding:40px;color:var(--tx2);font:14px var(--f-cuerpo)}

/* Renombrar inline */
.inp-rename{background:rgba(255,255,255,.06)!important;border:1px solid var(--verde)!important;
 color:var(--tx)!important;padding:2px 6px!important;border-radius:4px!important;
 font:inherit!important;width:100%!important;outline:none!important}
.grid-mon{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px;margin-bottom:12px}
.mapa{position:relative;height:340px;border-radius:18px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.mapa .zona{position:absolute;border-radius:22px;border:1px dashed rgba(255,255,255,.16);background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01))}
.mapa .zona span{position:absolute;left:12px;top:8px;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.mapa svg.lineas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hub{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;border:1.5px solid rgba(34,229,255,.6);background:rgba(34,229,255,.15)}
.nodo{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:4px;background:none;border:0;padding:6px;border-radius:14px;color:var(--tx2);cursor:pointer}
.nodo .pt{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8,var(--c) 45%);--c:var(--verde);box-shadow:0 0 14px var(--c),0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent);transition:.25s cubic-bezier(.3,1.5,.5,1)}
.nodo.off .pt{--c:var(--pel);filter:saturate(.8)}
.nodo small{font:600 9.5px var(--f-mono);letter-spacing:.02em;white-space:nowrap}
.nodo:hover .pt{transform:scale(1.2)}
.nodo.sel .pt{box-shadow:0 0 18px var(--azul),0 0 0 4px rgba(47,123,255,.4),0 0 0 8px rgba(34,229,255,.16);transform:scale(1.15)}
.nodo.sel small{color:var(--cian)}
.banda{position:absolute;border:1px solid var(--cian);background:rgba(34,229,255,.1);border-radius:8px;pointer-events:none}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--tx2)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;text-align:left;width:100%;transition:.2s;position:relative;overflow:hidden;cursor:pointer;background:none;border:0;color:var(--tx)}
.alerta:hover{background:rgba(255,255,255,.1)}
.alerta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.alerta b{font-size:13px;display:block}
.alerta small{color:var(--tx2);font-size:11.5px}
.lista-al{display:grid;gap:8px;max-height:340px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}

/* ===== herramientas tabla ===== */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools .grow{flex:1 1 200px;min-width:160px;position:relative}
.tools .grow .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3)}
.tools .grow input{padding-left:36px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:720px}
table.t th{position:sticky;top:0;text-align:left;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:8px 12px;background:rgba(6,10,14,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
table.t td{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);vertical-align:middle}
table.t tr.fila{cursor:pointer;transition:background .15s}
table.t tr.fila:hover{background:rgba(255,255,255,.05)}
table.t tr.sel{background:linear-gradient(90deg,rgba(47,123,255,.2),rgba(34,229,255,.06))}
table.t tr.grupo td{background:rgba(255,255,255,.045);cursor:pointer}
table.t tr.hijo td:first-child{padding-left:30px}
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nm b{display:block;font-weight:700}
.nm small{color:var(--tx3);font-family:var(--f-mono);font-size:11px}
.cmdn{font-weight:700;display:block}
.cmdt{font:11.5px var(--f-mono);color:var(--tx2);display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:4px;justify-content:flex-end}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:16px}
.stat b{font:600 22px var(--f-mono);display:block;font-variant-numeric:tabular-nums;color:var(--c)}
.stat small{font-size:11.5px;color:var(--tx2)}

/* =====================================================================
   HISTORIAL · Estilos
   ===================================================================== */
.hist-wrap{padding:0 16px 20px}
.hist-wrap .filtros{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hist-wrap .filtros .campo{display:flex;flex-direction:column;gap:4px;min-width:140px}
.hist-wrap .filtros .campo span{font:11px/1 var(--f-cuerpo);color:var(--tx2);text-transform:uppercase;letter-spacing:.6px}
.hist-wrap .filtros select,
.hist-wrap .filtros input[type=date]{
 background:rgba(255,255,255,.05);color:var(--tx);border:1px solid rgba(255,255,255,.085);
 border-radius:10px;padding:8px 12px;font:13px var(--f-cuerpo);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.hist-wrap .t{width:100%;border-collapse:collapse;font:13px/1.5 var(--f-cuerpo)}
.hist-wrap .t thead{position:sticky;top:0;z-index:2}
.hist-wrap .t th{text-align:left;padding:10px 12px;font-weight:600;font-size:11px;
 text-transform:uppercase;letter-spacing:.6px;color:var(--tx2);
 background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.085)}
.hist-wrap .t .fila{cursor:pointer;transition:background .15s}
.hist-wrap .t .fila:hover{background:rgba(255,255,255,.03)}
.hist-wrap .t .fila td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04)}
.hist-wrap .t .fila.hijo{background:rgba(255,255,255,.015)}
.hist-wrap .t .fila.hijo td:first-child{border-left:3px solid var(--azul)}
.hist-wrap .t .grupo{cursor:pointer;background:rgba(47,123,255,.06)}
.hist-wrap .t .grupo:hover{background:rgba(47,123,255,.1)}
.hist-wrap .t .grupo td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.085);font-weight:500}
.hist-wrap .nm{display:flex;flex-direction:column;gap:2px}
.hist-wrap .nm small{color:var(--tx2);font:11px var(--f-mono)}
.hist-wrap .cmdn{font-weight:500;display:block}
.hist-wrap .cmdt{font:11px var(--f-mono);color:var(--tx2);
 display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-wrap .acts{display:flex;gap:4px}
.hist-wrap .ib{background:none;border:none;color:var(--tx2);cursor:pointer;
 padding:4px;border-radius:6px;transition:all .15s}
.hist-wrap .ib:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.hist-wrap .ib.pel:hover{color:var(--pel)}
.hist-wrap .fl{display:flex;align-items:center;gap:6px}
.hist-wrap .flag{background:var(--azul);color:#fff;padding:2px 8px;
 border-radius:6px;font:11px/1.4 var(--f-cuerpo);font-weight:600}
.hist-wrap .vacio{text-align:center;padding:40px;color:var(--tx2);font:14px var(--f-cuerpo)}
.tab-scroll{overflow-x:auto;max-height:calc(100vh - 300px);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;border-radius:16px}

/* =====================================================================
   CATÁLOGO · Tarjetas (card grid)
   ===================================================================== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;
 transition:transform .3s cubic-bezier(.3,1.4,.5,1);
 backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.card:hover{transform:translateY(-3px)}
.card.inact{opacity:.5}
.card .h{display:flex;gap:11px;align-items:center}
.card .h b{font:600 14px/1.2 var(--f-cuerpo);display:block;color:var(--tx)}
.card .h small{font-size:11.5px;color:var(--c,var(--tx2))}
.card .cico{width:32px;height:32px;border-radius:10px}
.card p{font:12.5px/1.5 var(--f-cuerpo);color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .fl{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.card .flag{padding:2px 8px;border-radius:6px;font:600 11px/1.4 var(--f-cuerpo);
 background:rgba(255,255,255,.06);color:var(--tx2);border:1px solid rgba(255,255,255,.06);
 display:inline-flex;align-items:center;gap:4px}
.card .flag.pel{color:var(--pel);border-color:rgba(255,77,109,.2);background:rgba(255,77,109,.08)}
.card .flag.seg{color:var(--cian);border-color:rgba(34,229,255,.15);background:rgba(34,229,255,.06)}
.codebox{font:11.5px/1.5 var(--f-mono);padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.4);
 border:1px solid rgba(255,255,255,.06);color:#c8fbe0;overflow:hidden;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.codebox code{white-space:pre-wrap;word-break:break-all}
.card .pie{display:flex;gap:6px;align-items:center;margin-top:auto}
.card .pie .btn{flex:1}
.card .pie .ib{background:none;border:none;color:var(--tx2);cursor:pointer;
 padding:6px;border-radius:8px;transition:all .15s}
.card .pie .ib:hover{background:rgba(255,255,255,.08);color:var(--tx)}
.card .pie .ib.pel:hover{color:var(--pel)}
.hl-a{color:var(--cian);background:rgba(34,229,255,.12);border-radius:4px;padding:0 3px}
.hl-v{color:var(--azul);filter:brightness(1.5)}
.hl-s{color:var(--lima)}
.hl-f{color:#c6b6ff}

/* =====================================================================
   TERMINAL · 3 columnas
   ===================================================================== */
.term-g{display:grid;grid-template-columns:264px minmax(0,1fr) 336px;gap:12px;height:100%;min-height:0}
.col{border-radius:24px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.col>header{padding:14px 14px 8px}
.arbol{overflow:auto;padding:4px 8px 12px;flex:1;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.arbol details{margin-bottom:4px}
.arbol summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 8px;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.arbol summary::-webkit-details-marker{display:none}
.arbol summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:.2s}
.arbol details[open] summary::before{transform:rotate(45deg)}
.dv{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;transition:.15s}
.dv:hover{background:rgba(255,255,255,.07)}
.dv.sel{background:rgba(47,123,255,.2)}
.dv.act{box-shadow:inset 0 0 0 1px rgba(34,229,255,.55)}
.dv-n{flex:1;font:600 12.5px var(--f-cuerpo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-int{font:10px var(--f-mono);color:var(--tx3);flex-shrink:0}
.dv button.nom{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:grid;line-height:1.2;color:var(--tx);cursor:pointer}
.dv button.nom b{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv button.nom small{font-size:10.5px;color:var(--tx3);font-family:var(--f-mono)}
.tabs{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none;align-items:center}
.tab{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:14px 14px 0 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-bottom:0;font:600 12px var(--f-mono);color:var(--tx2);white-space:nowrap;cursor:pointer}
.tab.act{background:rgba(0,0,0,.42);color:var(--tx);box-shadow:inset 0 2px 0 var(--verde)}
.tab .x{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:var(--tx3);background:none;border:0;padding:0;cursor:pointer}
.tab .x:hover{background:rgba(255,255,255,.15);color:#fff}
.tbarra{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap;background:rgba(0,0,0,.42);border-bottom:1px solid rgba(255,255,255,.06)}
.tbarra b{font:700 13px var(--f-mono)}
.tbarra select{width:auto;padding:5px 26px 5px 10px;font:600 11.5px var(--f-mono);border-radius:99px}
.tcuerpo{flex:1;min-height:180px;overflow:auto;background:rgba(0,0,0,.5);padding:12px 14px;font:12.5px/1.55 var(--f-mono);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.ln{white-space:pre-wrap;word-break:break-word}
.ln.o{color:#d7efe4}.ln.e{color:#ff8fa3}.ln.s{color:var(--tx3);font-style:italic}

/* ---------- Sesion: gestión de sesiones de terminal ---------- */
const Sesion={
 abrir(dispId,int){
  let s=S.sesiones.find(x=>x.dispId===dispId);
  if(!s){
   const d=dev(dispId);
   if(!d) return null;
   const defInt=d.sistema&&SO[d.sistema]?SO[d.sistema].def:'powershell';
   const pref=Sel.interprete!=='auto'&&(d.ints||[]).includes(Sel.interprete)?Sel.interprete:
    ((d.ints||[]).includes(defInt)?defInt:(d.ints||['powershell'])[0]);
   s={id:uid('s'),dispId,int:int||pref,lineas:[],ejId:null,hist:[],hi:-1,guardable:null};
   s.lineas.push(
    {f:'s',t:`agente:saludo · v${d.version_agente||'—'} · ${(SO[d.sistema]||{n:d.sistema}).n} · intérpretes: ${(d.ints||[]).join(', ')}`},
    {f:'s',t:d.en_linea?'Sesión lista.':'Agente fuera de línea.'}
   );
   S.sesiones.push(s);
  }
  S.sesionActiva=s.id; S.ultimoDisp=dispId; S.dispActivo=dispId; guardar('disp',dispId);
  return s;
 },
 cerrar(id){
  const i=S.sesiones.findIndex(s=>s.id===id); if(i<0)return;
  S.sesiones.splice(i,1);
  if(S.sesionActiva===id) S.sesionActiva=S.sesiones[Math.max(0,i-1)]?.id||null;
  if(S.sesiones.length){
   const act=this.actual();
   if(act){S.dispActivo=act.dispId;guardar('disp',act.dispId)}
  }
 },
 actual(){return S.sesiones.find(s=>s.id===S.sesionActiva)||null}
};

/* ---------- Sync: sincronizar checkboxes con Sel ---------- */
function Sync(){
 $$('[data-dev]').forEach(el=>{
  const s=Sel.ids.has(el.dataset.dev);
  el.classList.toggle('sel',s);
  const c=el.querySelector('input[type=checkbox]');
  if(c)c.checked=s;
 });
}

/* ─── acciones de selección compartidas ─── */
const modSel=e=>e.shiftKey||e.metaKey||e.ctrlKey||Sel.multi;
const pt=e=>({x:e.clientX,y:e.clientY});
Acc.selNodo=(el,e)=>{const id=el.dataset.dev||el.dataset.id,p=pt(e);if(modSel(e))Sel.alternar(id,p);else if(Sel.ids.size===1&&Sel.ids.has(id))Sel.limpiar();else Sel.fijar([id],p)};
Acc.selChk=(el,e)=>{e.stopPropagation();Sel.alternar(el.dataset.id,pt(e))};
Acc.selEnLinea=(el,e)=>Sel.enLinea(pt(e));
Acc.selTag=(el,e)=>Sel.porEtiqueta(el.dataset.v,pt(e));
Acc.selLimpiar=()=>Sel.limpiar();

/* ─── Sel → re-sync vistas ─── */
Bus.on('sel',()=>{
 Sync();
 Nav.sub&&Nav.sub();
 Dock.marcar&&Dock.marcar();
 // Abrir mini menú si hay selección individual (solo desde fuera de Terminal)
 if(Sel.ids.size>0 && typeof MiniMenu!=='undefined' && MiniMenu.abrir){

  }
 }
});

 normaliza(d){

   disco:pr?{u:pr.unidad,tot:pr.total_gb,libre:pr.libre_gb,pct:pr.libre_pct}:null,

 async comandos(){
  // Categorías base por defecto si la base de datos está vacía
  const defaultCats=[
   {id:1,nombre:'Diagnóstico',color:'#00f59b',icono:'activity',orden:10},
   {id:2,nombre:'Red',color:'#06b6d4',icono:'wifi',orden:20},
   {id:3,nombre:'Servicios',color:'#3b82f6',icono:'cpu',orden:30},
   {id:4,nombre:'Mantenimiento',color:'#8b5cf6',icono:'wrench',orden:40},
   {id:5,nombre:'Seguridad',color:'#10b981',icono:'lock',orden:50},

  ];
  let {data:cats}=await sb.from('categorias_comandos').select('id,nombre,color,icono,orden').order('orden').order('nombre');
  if(!cats || !cats.length){
   cats=leer('categorias_locales',defaultCats);
  }
  S.categorias=(cats||[]).map(c=>({...c,color:c.color||'#06b6d4',icono:c.icono||'tag'}));
  // Intentar con variantes + tipos_alerta (array) y tipo_alerta (texto legacy).
  // Si alguna columna no existe, se hace fallback sin ella.
  let cmds, error;
  ({data:cmds,error}=await sb.from('comandos')

   .eq('activo',true).order('nombre'));
  if(error && /tipos_alerta|column/i.test(error.message||'')){
   ({data:cmds,error}=await sb.from('comandos')
    .select('id,categoria_id,nombre,descripcion,sistema,script,interprete,variantes,destructivo,requiere_admin,timeout_seg,tipo_alerta,activo')
    .eq('activo',true).order('nombre'));
  }
  if(error && /tipo_alerta|column/i.test(error.message||'')){
   ({data:cmds,error}=await sb.from('comandos')
    .select('id,categoria_id,nombre,descripcion,sistema,script,interprete,variantes,destructivo,requiere_admin,timeout_seg,activo')
    .eq('activo',true).order('nombre'));
  }
  if(error && /variantes|column/i.test(error.message||'')){
   // variantes aún no existe en BD — funciona sin ella (retrocompatible)
   ({data:cmds,error}=await sb.from('comandos')
    .select('id,categoria_id,nombre,descripcion,sistema,script,interprete,destructivo,requiere_admin,timeout_seg,activo')
    .eq('activo',true).order('nombre'));
  }
  if(error){
   if(typeof Toast!=='undefined')Toast.mostrar('No se pudo leer el catálogo','aviso',error.message);
   S.comandos=[]; return;
  }
  // Normalizar: siempre dejar tipos_alerta como array, aún cuando sólo
  // venga la columna legacy tipo_alerta.
  S.comandos=(cmds||[]).map(c=>{
   const ta=alertasDe(c);
   return {...c, tipos_alerta:ta, tipo_alerta:ta[0]||null};
  });
  Bus.emit('comandos:cargados', S.comandos);
 },

 /* ─── Recomendaciones por reglas ────────────────────────────────────
    Devuelve los comandos del catálogo relevantes para las métricas
    reales del equipo. Alertas activas primero, luego el resto.         */
 recomendados(d){
  if(!d)return [];
  const alertas=this._alertasActivas(d);
  const compatibles=S.comandos.filter(c=>
   c.sistema===d.sistema || c.sistema==='todos');
  const puntua=c=>{
   const ta=alertasDe(c);
   if(!ta.length)return 0;
   // cuántas de sus categorías coinciden con alertas activas
   return ta.filter(t=>alertas.includes(t)).length;
  };
  const conPeso=compatibles.map(c=>[c,puntua(c)]);
  conPeso.sort((a,b)=>b[1]-a[1]);
  return conPeso.map(x=>x[0]);
 },

 _alertasActivas(d){
  const alertas=[];
  const m=d;
  if(m.cpu!=null && m.cpu>80) alertas.push('cpu');
  if(m.ram!=null && m.ram>85) alertas.push('memoria');
  if(m.disco){
   const usadoPct=m.disco.pct!=null?m.disco.pct:null;
   if(usadoPct!=null && usadoPct<20) alertas.push('disco');
  }
  if(Array.isArray(m.discos)){
   m.discos.forEach(dk=>{
    if(dk.libre_pct!=null && dk.libre_pct<20 && !alertas.includes('disco'))
     alertas.push('disco');
   });
  }
  if(Array.isArray(m.procesos)&&m.procesos.some(p=>p.cpu>50))
   alertas.push('proceso');
  if(m.visto){
   const seg=(Date.now()-new Date(m.visto))/1000;
   if(seg>120) alertas.push('red');
  }
  return alertas;
 },

  // Intentar primero con tipos_alerta (array). Si el backend sólo

const Realtime={
 conectar(){
  this.cortar();
  S.canalEq=sb.channel('eq')
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'dispositivos'},({new:n})=>{
    const i=S.dispositivos.findIndex(d=>d.id===n.id);
    if(i<0){Datos.equipos().then(()=>Bus.emit('equipos'));return}
    const antes=S.dispositivos[i].en_linea;
    S.dispositivos[i]=Datos.normaliza({...S.dispositivos[i],...n});
    if(antes!==n.en_linea&&!S.silenciado)
     Toast.mostrar(n.nombre+(n.en_linea?' se conectó':' se desconectó'),n.en_linea?'ok':'aviso');
    Bus.emit('equipos');
   })
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'dispositivos'},()=>{
    Datos.equipos().then(()=>Bus.emit('equipos'));
   })
   .subscribe(st=>this.indicador(st));
 },
 seguir(id,alLlegar,alCerrar){
  this.dejar();
  S.canalSalida=sb.channel('sal-'+id)
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'fragmentos_salida_comandos',
        filter:'ejecucion_id=eq.'+id},({new:n})=>alLlegar(n))
   .subscribe();
  S.canalEjec=sb.channel('ej-'+id)
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'ejecuciones_comandos',
        filter:'id=eq.'+id},({new:n})=>alCerrar(n))
   .subscribe();
 },
 dejar(){
  if(S.canalSalida){sb.removeChannel(S.canalSalida);S.canalSalida=null}
  if(S.canalEjec){sb.removeChannel(S.canalEjec);S.canalEjec=null}
 },
 cortar(){ this.dejar(); if(S.canalEq){sb.removeChannel(S.canalEq);S.canalEq=null} },
 indicador(st){
  const ok=st==='SUBSCRIBED', e=$('#ws-ind');
  if(!e)return;
  const txt=$('#ws-txt'); if(txt)txt.textContent=ok?'En vivo':'Reconectando…';
  e.style.borderColor=ok?'rgba(57,255,136,.3)':'rgba(255,183,3,.35)';
  e.style.background=ok?'rgba(57,255,136,.08)':'rgba(255,183,3,.08)';
  e.style.color=ok?'var(--verde)':'var(--ambar)';
 }
};

/* =====================================================================
   VARIANTES · Helpers para comandos Multi-SO con scripts por plataforma
   ===================================================================== */

function esMultiPlataforma(cmd){
 if(!cmd)return false;
 if(!cmd.variantes)return false;
 const v=cmd.variantes;
 return !!(v.windows||v.macos||v.linux);
}

function resolverScript(cmd, dispositivo){
 if(!cmd)return null;
 const so=(dispositivo?.sistema||'').toLowerCase();
 if(cmd.variantes){
  const v=cmd.variantes;
  let s=null;
  if(so==='windows'&&v.windows) s=v.windows;
  else if((so==='macos'||so==='darwin')&&v.macos) s=v.macos;
  else if(so==='linux'&&v.linux) s=v.linux;
  if(s){
   // Compatibilidad BSD: en macOS, ps no tiene el flag GNU '--sort'
   if((so==='macos'||so==='darwin') && s.includes('ps aux --sort')) {
    s = `ps -A -o user,pid,%cpu,%mem,comm -r | head -11 | awk 'NR==1{print "USER      PID   %CPU  %MEM  COMANDO"} NR>1{printf "%-8s  %-6s  %-5s  %-5s  %s\\n", $1,$2,$3,$4,$5}'`;
   }
   return s;
  }
 }
 return cmd.script||null;
}

function sistemasCubiertos(cmd){
 if(!esMultiPlataforma(cmd)) return cmd?.sistema?[cmd.sistema]:[];
 const v=cmd.variantes;
 return ['windows','macos','linux'].filter(s=>v[s]&&v[s].trim());
}

 mostrar(t,tipo='ok',sub=''){
  if(S.silenciado&&tipo!=='forzar')return;
  const c={ok:'var(--verde)',aviso:'var(--ambar)',err:'var(--pel)',info:'var(--cian)'}[tipo]||'var(--cian)';
  const icn={ok:'check',aviso:'alert',err:'alert',info:'zap'}[tipo]||'zap';
  const el=document.createElement('div');el.className='toast vid';
  el.innerHTML=`<span class="cico" style="--c:${c}">${ico(icn,15)}</span><div><b>${esc(t)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div>`;
  $('#toasts').appendChild(el);setTimeout(()=>{el.style.transition='.4s';el.style.opacity=0;el.style.transform='translateX(30px)';setTimeout(()=>el.remove(),400)},4200);
 }
};

const PanelAlertas={
 _abierto:false,_el:null,
 // Recopilar alertas de todos los dispositivos (mismo helper que VistaMonitoreo)
 _alertas(){
  const info={cpu:['CPU alta','pel','cpu'],memoria:['Memoria alta','ambar','cpu'],
   disco:['Disco casi lleno','ambar','hardDrive'],proceso:['Proceso elevado','indigo','activity'],
   red:['Sin contacto reciente','tx3','wifiOff']};
  const lista=[];

   });

 },
 abrir(){
  if(this._abierto){this.cerrar();return}
  const btn=$('#btnNotif'); if(!btn)return;
  const alertas=this._alertas();
  const r=btn.getBoundingClientRect();
  const panel=document.createElement('div');
  panel.id='alerta-panel'; panel.className='vid alerta-popup';
  panel.innerHTML=`<div class="ap-head"><span>${ico('bell',14)} <b>Alertas activas</b></span>
   <span class="badge">${alertas.length}</span></div>
   ${alertas.length?alertas.map(a=>`<div class="ap-item" data-id="${a.id}">
    <div class="ap-item-top">
     <span class="ap-ico-equipo" style="color:${a.color}">${ico(a.icono,15)}</span>

    </div>

      ${ico('monitor',12)} Mini menú
     </button>

   </div>`).join(''):'<div class="ap-vacio">✅ Sin alertas activas</div>'}
   ${S.silenciado?`<div class="ap-sil">${ico('bellOff',12)} Notificaciones silenciadas</div>`:''}
   <div class="ap-pie">

   </div>`;
  const w=280, x=Math.max(8,Math.min(r.right-w,innerWidth-w-8));
  panel.style.cssText=`position:fixed;top:${r.bottom+6}px;left:${x}px;width:${w}px;z-index:9999`;

const Nav={
 ir(v){
  const lista=Mod.listaVistas();

   v=lista[0]?.id||'monitoreo';
  }
  const ant=Vistas[S.vista];
  if(ant&&ant.salir&&S.vista!==v)ant.salir();

  if(!V){ c.innerHTML='<div class="vacio" style="padding:40px">Esta vista ya no está instalada.</div>'; return }

  c.scrollTop=0;

  this.sub(); Dock.marcar();
 },
 sub(){ const V=Vistas[S.vista]; if(V&&V.sub)$('#subt').textContent=V.sub() }
};

const Dock={
 montar(){
  const d=$('#dock');
  const lista=Mod.listaVistas();
  const marca=d.querySelector('#lente');
  d.innerHTML='';
  if(marca)d.appendChild(marca); else d.insertAdjacentHTML('beforeend','<i id="lente"></i>');
  d.insertAdjacentHTML('beforeend',lista.map(v=>
   `<button class="btn-d" data-acc="nav" data-v="${v.id}" aria-label="${esc(v.nombre)}">${ico(v.icono,22)}<span>${esc(v.nombre)}</span><b class="bd" hidden></b></button>`).join(''));

 },
 marcar(){

  bs.forEach((b,k)=>b.classList.toggle('act',k===i));

/* =====================================================================
   UI · Menú flotante global superior izquierdo (FAB)
   ===================================================================== */
const Fab={
 el:null,p:null,abierto:false,drag:null,movio:false,
 montar(){
  this.el=$('#fab'); this.p=$('#fabPanel');
  if(this._listo)return; this._listo=true;
  const pos=leer('fab',null);
  if(pos){this.el.style.left=pos.x+'px';this.el.style.top=pos.y+'px'}
  else{this.el.style.left='16px';this.el.style.top='calc(14px + env(safe-area-inset-top,0px))'}
  this.el.addEventListener('pointerdown',e=>{
   const r=this.el.getBoundingClientRect();
   this.drag={sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,mov:false};
   this.el.setPointerCapture(e.pointerId);
  });
  this.el.addEventListener('pointermove',e=>{
   const d=this.drag; if(!d)return;
   const dx=e.clientX-d.sx, dy=e.clientY-d.sy;
   if(!d.mov&&Math.hypot(dx,dy)>6){d.mov=true;this.cerrar()}
   if(d.mov){
    this.el.style.left=Math.max(8,Math.min(innerWidth-60,d.ox+dx))+'px';
    this.el.style.top=Math.max(8,Math.min(innerHeight-60,d.oy+dy))+'px';
   }
  });
  const fin=()=>{
   const d=this.drag; this.drag=null;
   if(d&&d.mov){this.movio=true;setTimeout(()=>this.movio=false,80);
    const r=this.el.getBoundingClientRect();guardar('fab',{x:Math.round(r.left),y:Math.round(r.top)})}
  };
  this.el.addEventListener('pointerup',fin);
  this.el.addEventListener('pointercancel',fin);
  // Cerrar al hacer clic fuera
  document.addEventListener('pointerdown',e=>{
   if(this.abierto&&!this.el.contains(e.target)&&!this.p.contains(e.target)){this.cerrar()}
  },{capture:true});
 },
 html(){
  const on=S.dispositivos.filter(d=>d.en_linea), d=dev(S.dispActivo);
  const it=(icn,c,t,s,a,dis)=>`<button class="it" data-acc="${a}" ${dis?'disabled style="opacity:.4"':''}>
   <span class="cico" style="--c:${c}">${ico(icn,17)}</span><span><b>${t}</b><small>${esc(s)}</small></span></button>`;
  return `<div class="eyebrow" style="padding:6px 10px 4px">Acceso rápido</div>
   ${it('terminal','var(--verde)','Terminal',d?d.nombre:'Elige un equipo','fTerminal',!d)}
   ${it('monitor','var(--azul)','Equipos',`${on.length} en línea de ${S.dispositivos.length}`,'fEquipos')}
   ${it('list','var(--indigo)','Catálogo',`${S.comandos.length} comandos`,'fCatalogo')}
   ${it('history','var(--ambar)','Historial',`Ejecuciones recientes`,'fHistorial')}
   ${it('layers','var(--violeta,#8b5cf6)','Masiva',`Ejecutar en varios equipos`,'fMasiva')}
   ${it('activity','var(--cian)','Estado de agentes','Latidos y versiones','fAgentes')}
   ${it('retry','var(--lima)','Actualizar ahora','Vuelve a leer los equipos','fRefrescar')}
   <div class="recientes"><div class="eyebrow" style="margin-bottom:4px">Equipos en línea</div>
   ${on.slice(0,4).map(x=>`<div class="r"><span class="dot on"></span><span>${esc(x.nombre)}</span>${soB(x.sistema)}</div>`).join('')
     ||'<div class="mut3" style="font-size:11.5px;padding:2px 4px">Ninguno en línea</div>'}</div>`;
 },
 abrir(){
  this.abierto=true; this.el.classList.add('abierto');
  this.el.setAttribute('aria-expanded','true');
  this.p.innerHTML=this.html(); this.p.hidden=false;
  const r=this.el.getBoundingClientRect(), w=Math.min(322,innerWidth-24), h=this.p.offsetHeight;
  const x=Math.max(12,Math.min(r.left,innerWidth-w-12));
  const abajo=r.bottom+10+h<innerHeight;
  this.p.style.left=x+'px';
  this.p.style.top=(abajo?r.bottom+10:Math.max(12,r.top-10-h))+'px';
  this.p.style.setProperty('--ox',(r.left-x+26)+'px');
  this.p.style.setProperty('--oy',abajo?'0px':h+'px');
 },
 cerrar(){
  if(!this.abierto)return;
  this.abierto=false; this.el.classList.remove('abierto');
  this.el.setAttribute('aria-expanded','false'); this.p.hidden=true;
 }
};
